name: Agent 15 OSGi Wire Probe PR #225 (cce60d44)

on:
  push:
    branches:
      - agent/15-wire-probe-225
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent15-wire-probe-225-cce60d44
  cancel-in-progress: false

jobs:
  verify:
    name: "Agent 15 Wire Probe PR #225 (exact cce60d44)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Maven and p2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-simcp-v1
          restore-keys: |
            ${{ runner.os }}-m2-simcp-

      - name: Install Maven 3.9.9, Xvfb & GTK3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          if [ ! -x /opt/apache-maven-3.9.9/bin/mvn ]; then
            curl -fsSL --retry 4 --retry-delay 2 https://archive.apache.org/dist/maven/maven/3/3.9.9/binaries/apache-maven-3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://downloads.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
            sudo tar -xzf /tmp/mvn.tgz -C /opt
          fi
          /opt/apache-maven-3.9.9/bin/mvn -version

      - name: Checkout SI-MCP exact cce60d44fe3a (ephemeral copy)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch agent/14-197-followup-unknown-cap --depth=20 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git checkout -q cce60d44fe3ab3dda091953d72f27969b12333d4
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "EXACT_PR225_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "cce60d44fe3ab3dda091953d72f27969b12333d4"

      - name: Append Agent 15 PR #225 OSGi wire tests and run targeted Tycho verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import textwrap
          from pathlib import Path

          p = Path('src/server/tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/wire/DiagnosticsCompletenessWireTest.java')
          text = p.read_text(encoding='utf-8')
          idx = text.rfind('}')
          assert idx != -1

          addition = textwrap.dedent(r"""
              @Test
              public void agent15Pr225MaskingOnNeverLeaksPartialSecret() throws InterruptedException
              {
                  assertNotNull("OSGi preference store required", store);
                  store.setValue(PrefKeys.PREF_PII_REDACT_ENABLED, true);
                  final String req = "{\"jsonrpc\":\"2.0\",\"id\":\"sentinel@example.com\",\"method\":\"tools/call\",\"params\":{\"name\":\"get_project_errors\",\"arguments\":{}}}";

                  // 1. Sync tools/call sweep across synthetic email cuts
                  String emailBody = "email ivanov@example.com tail padding";
                  int syncChecks = 0;
                  for (int limit = 10; limit < ResponseCap.byteLength(emailBody); limit++)
                  {
                      registry.clear();
                      registry.register(new StubProblemsTool(emailBody,
                          DiagnosticsCompleteness.builder().returnedCount(0).totalMatching(0L).build()));
                      ToolCallScope scope = ToolCallScope.create(null);
                      scope.setResponseByteLimit(limit);
                      ToolCallScope.enter(scope);
                      try
                      {
                          String raw = router.processRequest(req);
                          JsonObject env = JsonParser.parseString(raw).getAsJsonObject();
                          assertEquals("sentinel@example.com", env.get("id").getAsString());
                          String bodyText = extractText(env.getAsJsonObject("result"));
                          assertFalse("leaked email fragment at limit=" + limit + ": " + bodyText,
                              bodyText.contains("ivanov") || bodyText.contains("example."));
                          assertTrue("must carry truncation notice at limit=" + limit,
                              bodyText.contains("[truncated=true:"));
                          syncChecks++;
                      }
                      finally
                      {
                          ToolCallScope.exit();
                      }
                  }

                  // 2. Sync tools/call compact JSON with email + phone + card
                  String compactPii = "{\"u\":\"ivanov@example.com\",\"p\":\"+7 (999) 123-45-67\",\"c\":\"4276 1234 5678 9012\",\"k\":\"tail\"}";
                  int compactChecks = 0;
                  for (int limit = 20; limit < ResponseCap.byteLength(compactPii); limit += 5)
                  {
                      registry.clear();
                      registry.register(new StubProblemsTool(compactPii,
                          DiagnosticsCompleteness.builder().returnedCount(0).totalMatching(0L).build()));
                      ToolCallScope scope = ToolCallScope.create(null);
                      scope.setResponseByteLimit(limit);
                      ToolCallScope.enter(scope);
                      try
                      {
                          String raw = router.processRequest(req);
                          JsonObject env = JsonParser.parseString(raw).getAsJsonObject();
                          String bodyText = extractText(env.getAsJsonObject("result"));
                          assertFalse("compact JSON PII leak at limit=" + limit + ": " + bodyText,
                              bodyText.contains("ivanov") || bodyText.contains("123-45-67")
                                  || bodyText.contains("4276") || bodyText.contains("5678")
                                  || bodyText.contains("9012"));
                          assertTrue(bodyText.contains("[truncated=true:"));
                          compactChecks++;
                      }
                      finally
                      {
                          ToolCallScope.exit();
                      }
                  }

                  // 3. Async tasks/result (finishedResultOf) with masking ON
                  registry.clear();
                  registry.register(new StubProblemsTool("ok", DiagnosticsCompleteness.noSessionChanges()));
                  TaskDirectory.Task settled = runSettledTask("get_project_errors", Map.of(), emailBody);
                  ToolCallScope asyncScope = ToolCallScope.create(null);
                  asyncScope.setResponseByteLimit(ResponseCap.byteLength("email ivanov@example."));
                  ToolCallScope.enter(asyncScope);
                  try
                  {
                      JsonObject inner = callTasksResult(901, settled.taskId)
                          .getAsJsonObject("result").getAsJsonObject("result");
                      String asyncText = extractText(inner);
                      assertFalse("async finishedResultOf leaked partial email: " + asyncText,
                          asyncText.contains("ivanov") || asyncText.contains("example."));
                      assertTrue(asyncText.contains("[truncated=true:"));
                  }
                  finally
                  {
                      ToolCallScope.exit();
                  }
                  System.out.println("AGENT15_PR225_MASKING_ON=PASS syncChecks=" + syncChecks + " compactChecks=" + compactChecks);
              }

              @Test
              public void agent15Pr225MaskingOffPreservesCompactJson() throws InterruptedException
              {
                  assertNotNull("OSGi preference store required", store);
                  store.setValue(PrefKeys.PREF_PII_REDACT_ENABLED, false);
                  String compactJson = "{\"status\":\"ok\",\"items\":[\"Catalog.Nomenclature\",\"Document.SalesOrder\",\"InformationRegister.Prices\"],\"note\":\"compact_no_spaces_123\"}";
                  int limit = 80;
                  String expectedHead = ResponseCap.truncateUtf8(compactJson, limit);
                  assertEquals(80, ResponseCap.byteLength(expectedHead));

                  // 1. Sync tools/call path
                  registry.clear();
                  registry.register(new StubProblemsTool(compactJson,
                      DiagnosticsCompleteness.builder().returnedCount(0).totalMatching(0L).build()));
                  ToolCallScope syncScope = ToolCallScope.create(null);
                  syncScope.setResponseByteLimit(limit);
                  ToolCallScope.enter(syncScope);
                  try
                  {
                      String raw = router.processRequest(
                          "{\"jsonrpc\":\"2.0\",\"id\":902,\"method\":\"tools/call\",\"params\":{\"name\":\"get_project_errors\",\"arguments\":{}}}");
                      JsonObject env = JsonParser.parseString(raw).getAsJsonObject();
                      String text = extractText(env.getAsJsonObject("result"));
                      int noticeIdx = text.indexOf("\n\n[truncated=true:");
                      assertTrue("notice missing: " + text, noticeIdx > 0);
                      String head = text.substring(0, noticeIdx);
                      assertEquals("unmasked compact JSON must keep exact 80B prefix on sync path", expectedHead, head);
                  }
                  finally
                  {
                      ToolCallScope.exit();
                  }

                  // 2. Async tasks/result (finishedResultOf) path
                  TaskDirectory.Task settled = runSettledTask("get_project_errors", Map.of(), compactJson);
                  ToolCallScope asyncScope = ToolCallScope.create(null);
                  asyncScope.setResponseByteLimit(limit);
                  ToolCallScope.enter(asyncScope);
                  try
                  {
                      JsonObject inner = callTasksResult(903, settled.taskId)
                          .getAsJsonObject("result").getAsJsonObject("result");
                      String text = extractText(inner);
                      int noticeIdx = text.indexOf("\n\n[truncated=true:");
                      assertTrue("async notice missing: " + text, noticeIdx > 0);
                      String head = text.substring(0, noticeIdx);
                      assertEquals("unmasked compact JSON must keep exact 80B prefix on async path", expectedHead, head);
                  }
                  finally
                  {
                      ToolCallScope.exit();
                  }
                  System.out.println("AGENT15_PR225_MASKING_OFF_COMPACT_JSON=PASS headBytes=" + ResponseCap.byteLength(expectedHead));
              }

              @Test
              public void agent15Pr225WholeWireSidecarAndAmplification()
              {
                  assertNotNull("OSGi preference store required", store);
                  store.setValue(PrefKeys.PREF_PII_REDACT_ENABLED, true);
                  final int limit = 512;
                  final String request = "{\"jsonrpc\":\"2.0\",\"id\":\"sentinel@example.com\",\"method\":\"tools/call\",\"params\":{\"name\":\"get_project_errors\",\"arguments\":{}}}";
                  for (int count : new int[] { 100, 1000 })
                  {
                      List<String> unresolved = new ArrayList<>();
                      for (int i = 0; i < count; i++)
                      {
                          unresolved.add("Catalog.\"" + i + " ivanov@example.com " + "\\\"".repeat(40));
                      }
                      for (int bodyBytes : new int[] { limit - 1, limit, limit + 1 })
                      {
                          registry.clear();
                          String body = "\"".repeat(bodyBytes);
                          registry.register(new StubProblemsTool(body, DiagnosticsCompleteness.builder()
                              .returnedCount(0).totalMatching(0L).unresolvedObjects(unresolved).build()));
                          ToolCallScope scope = ToolCallScope.create(null);
                          scope.setResponseByteLimit(limit);
                          ToolCallScope.enter(scope);
                          try
                          {
                              String raw = router.processRequest(request);
                              long bytes = ResponseCap.byteLength(raw);
                              JsonObject envelope = JsonParser.parseString(raw).getAsJsonObject();
                              assertEquals("sentinel@example.com", envelope.get("id").getAsString());
                              assertFalse("unresolved PII must be masked", raw.contains("ivanov@example.com"));
                              JsonObject result = envelope.getAsJsonObject("result");
                              JsonObject comp = result.getAsJsonObject("structuredContent").getAsJsonObject("completeness");
                              assertFalse(comp.get("complete").getAsBoolean());
                              assertTrue(comp.get("capped").getAsBoolean());
                              assertTrue(containsReason(comp.getAsJsonArray("reasons"), DiagnosticsCompleteness.REASON_RESPONSE_TRUNCATED));
                              assertTrue(comp.getAsJsonArray("unresolvedObjects").size() < count);
                              assertTrue("unexpected wire amplification " + bytes, bytes <= 6L * limit + 2048L);
                              System.out.println("AGENT15_PR225_WIRE body=" + bodyBytes + " count=" + count + " bytes=" + bytes);
                          }
                          finally
                          {
                              ToolCallScope.exit();
                          }
                      }
                  }
              }
          """)
          indented = "\n".join(("    " + ln if ln else ln) for ln in addition.splitlines())
          p.write_text(text[:idx] + "\n" + indented + "\n" + text[idx:], encoding='utf-8')
          PY
          git -C src diff --stat
          set +e
          (cd src/server && xvfb-run -a /opt/apache-maven-3.9.9/bin/mvn -B -ntp -Dstyle.color=never \
            -pl targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests -am \
            -Dtest=ResponseCapTest,ThreeWayComparisonToolTest,DiagnosticsCompletenessWireTest,DiagnosticsCompletenessWireIsolationTest verify) > /tmp/mvn_wire.log 2>&1
          RC=$?
          set -e
          echo "MVN_EXIT=$RC"
          grep "AGENT15_" /tmp/mvn_wire.log || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total_t = total_f = total_e = total_s = 0
          for xp in sorted(glob.glob('src/server/tests/si.edt.mcp.server.tests/target/surefire-reports/TEST-*.xml')):
              root = ET.parse(xp).getroot()
              t = int(root.attrib.get('tests', 0))
              f = int(root.attrib.get('failures', 0))
              e = int(root.attrib.get('errors', 0))
              s = int(root.attrib.get('skipped', 0))
              total_t += t; total_f += f; total_e += e; total_s += s
              print(f"XML {root.attrib.get('name')}: T={t} F={f} E={e} S={s}")
              for tc in root.findall('testcase'):
                  st = 'PASS'
                  for tag in ('failure', 'error', 'skipped'):
                      el = tc.find(tag)
                      if el is not None:
                          st = f"{tag.upper()}: {el.attrib.get('message', '')}"
                  print(f"  - {tc.attrib.get('name')}: {st}")
          print(f"TOTAL: T={total_t} F={total_f} E={total_e} S={total_s}")
          PY
          if [ "$RC" -ne 0 ]; then
            grep -E "\[(ERROR|FAILURE|WARN)\]" /tmp/mvn_wire.log | tail -n 35 || true
          fi
          exit "$RC"
