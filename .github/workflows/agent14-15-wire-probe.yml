name: Agent 14+15 Whole-Wire & Truncation Probe (e1051751)

on:
  push:
    branches:
      - agent/14-hosted-wire-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent14-hosted-wire-probe-e1051751
  cancel-in-progress: true

jobs:
  verify:
    name: "Agent 14+15 Wire Probe (exact e1051751)"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Maven and p2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-simcp-v1
          restore-keys: |
            ${{ runner.os }}-m2-simcp-

      - name: Install Maven 3.9.9, Xvfb & GTK3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          if [ ! -x /opt/apache-maven-3.9.9/bin/mvn ]; then
            curl -fsSL --retry 4 --retry-delay 2 https://archive.apache.org/dist/maven/maven/3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://downloads.apache.org/maven/maven/3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
            sudo tar -xzf /tmp/mvn.tgz -C /opt
          fi
          /opt/apache-maven-3.9.9/bin/mvn -version

      - name: Checkout SI-MCP exact e1051751 (test copy)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch agent/14-p0-r2-diagnostics-completeness --depth=40 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git checkout -q e1051751fd0e1afe9d89ea40e38ffe54e12e5e36
          echo "EXACT_R2_SHA=$(git rev-parse HEAD)"

      - name: Append Agent 15 methods to test copy and run OSGi wire tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import textwrap
          from pathlib import Path

          p = Path('src/server/tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/wire/DiagnosticsCompletenessWireTest.java')
          text = p.read_text(encoding='utf-8')
          idx = text.rfind('}')
          assert idx != -1

          addition = textwrap.dedent(r"""
              @Test
              public void agent15WholeWireBoundariesAndMasking()
              {
                  assertNotNull("OSGi preference store required", store);
                  store.setValue(PrefKeys.PREF_PII_REDACT_ENABLED, true);
                  final int limit = 512;
                  final String request = "{\"jsonrpc\":\"2.0\",\"id\":\"sentinel@example.com\",\"method\":\"tools/call\",\"params\":{\"name\":\"get_project_errors\",\"arguments\":{}}}";
                  for (int count : new int[] { 100, 1000 })
                  {
                      List<String> unresolved = new ArrayList<>();
                      for (int i = 0; i < count; i++)
                      {
                          unresolved.add("Каталог.\"" + i + " ivanov@example.com " + "\\\"".repeat(40));
                      }
                      for (int bodyBytes : new int[] { limit - 1, limit, limit + 1 })
                      {
                          registry.clear();
                          String body = "\"".repeat(bodyBytes);
                          registry.register(new StubProblemsTool(body, DiagnosticsCompleteness.builder()
                              .returnedCount(0).totalMatching(0L).unresolvedObjects(unresolved).build()));
                          ToolCallScope scope = ToolCallScope.create(null);
                          scope.setResponseByteLimit(limit);
                          ToolCallScope.enter(scope);
                          try
                          {
                              String raw = router.processRequest(request);
                              long bytes = ResponseCap.byteLength(raw);
                              JsonObject envelope = JsonParser.parseString(raw).getAsJsonObject();
                              assertEquals("sentinel@example.com", envelope.get("id").getAsString());
                              assertFalse("unresolved PII must be masked", raw.contains("ivanov@example.com"));
                              JsonObject result = envelope.getAsJsonObject("result");
                              JsonObject comp = result.getAsJsonObject("structuredContent").getAsJsonObject("completeness");
                              assertFalse(comp.get("complete").getAsBoolean());
                              assertTrue(comp.get("capped").getAsBoolean());
                              assertTrue(containsReason(comp.getAsJsonArray("reasons"), DiagnosticsCompleteness.REASON_RESPONSE_TRUNCATED));
                              assertTrue(comp.getAsJsonArray("unresolvedObjects").size() < count);
                              assertTrue("unexpected wire amplification " + bytes, bytes <= 6L * limit + 2048L);
                              System.out.println("AGENT15_WIRE body=" + bodyBytes + " count=" + count + " bytes=" + bytes);
                          }
                          finally
                          {
                              ToolCallScope.exit();
                          }
                      }
                  }
              }

              @Test
              public void agent15CappedBodyCutInsideSyntheticEmail()
              {
                  assertNotNull("OSGi preference store required", store);
                  store.setValue(PrefKeys.PREF_PII_REDACT_ENABLED, true);
                  String full = "email ivanov@example.com tail";
                  long limit = ResponseCap.byteLength("email ivanov@example.");
                  registry.register(new StubProblemsTool(full,
                      DiagnosticsCompleteness.builder().returnedCount(0).totalMatching(0L).build()));
                  ToolCallScope scope = ToolCallScope.create(null);
                  scope.setResponseByteLimit(limit);
                  ToolCallScope.enter(scope);
                  try
                  {
                      String raw = router.processRequest("{\"jsonrpc\":\"2.0\",\"id\":\"sentinel@example.com\",\"method\":\"tools/call\",\"params\":{\"name\":\"get_project_errors\",\"arguments\":{}}}");
                      JsonObject env = JsonParser.parseString(raw).getAsJsonObject();
                      assertEquals("sentinel@example.com", env.get("id").getAsString());
                      String text = extractText(env.getAsJsonObject("result"));
                      assertTrue("characterization of pre-existing cut/redact behavior", text.contains("ivanov@example."));
                      assertFalse(text.contains("ivanov@example.com"));
                      assertTrue(text.contains("[truncated=true:"));
                      System.out.println("AGENT15_PII_PARTIAL_CHARACTERIZED=1");
                  }
                  finally
                  {
                      ToolCallScope.exit();
                  }
              }
          """)
          indented = "\n".join(("    " + ln if ln else ln) for ln in addition.splitlines())
          p.write_text(text[:idx] + "\n" + indented + "\n" + text[idx:], encoding='utf-8')
          PY
          git -C src diff --stat
          set +e
          (cd src/server && xvfb-run -a /opt/apache-maven-3.9.9/bin/mvn -B -ntp -Dstyle.color=never \
            -pl targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests -am \
            -Dtest=DiagnosticsCompletenessWireTest,DiagnosticsCompletenessWireIsolationTest verify) > /tmp/mvn_wire.log 2>&1
          RC=$?
          set -e
          echo "MVN_EXIT=$RC"
          grep "AGENT15_" /tmp/mvn_wire.log || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for xp in sorted(glob.glob('src/server/tests/si.edt.mcp.server.tests/target/surefire-reports/TEST-*.xml')):
              root = ET.parse(xp).getroot()
              print(f"XML {root.attrib.get('name')}: T={root.attrib.get('tests')} F={root.attrib.get('failures')} E={root.attrib.get('errors')} S={root.attrib.get('skipped')}")
              for tc in root.findall('testcase'):
                  st = 'PASS'
                  for tag in ('failure', 'error', 'skipped'):
                      el = tc.find(tag)
                      if el is not None:
                          st = f"{tag.upper()}: {el.attrib.get('message', '')}"
                  print(f"  - {tc.attrib.get('name')}: {st}")
          PY
          if [ "$RC" -ne 0 ]; then
            grep -E "\[(ERROR|FAILURE|WARN)\]" /tmp/mvn_wire.log | tail -n 30 || true
          fi
          exit "$RC"
