name: "Agent 12 OSGi Regression #284 (comparison-adjacent classes)"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'SI-MCP branch to clone'
        required: true
        default: 'final'
      sha:
        description: 'SI-MCP exact SHA to check out'
        required: true
        default: '6892e7546bc8cd4e3621efecb7af710d359b2125'
      label:
        description: 'Label for this run (base or candidate)'
        required: true
        default: 'base'

permissions:
  contents: read

concurrency:
  group: agent12-osgi-regression-284
  cancel-in-progress: false

jobs:
  regression:
    name: "Agent 12 Regression #284"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
      PROBE_REF: ${{ github.event.inputs.ref }}
      PROBE_SHA: ${{ github.event.inputs.sha }}
      PROBE_LABEL: ${{ github.event.inputs.label }}
    steps:
      - name: Setup JDK 17 and Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Maven and p2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-simcp-v1
          restore-keys: |
            ${{ runner.os }}-m2-simcp-

      - name: Install Maven 3.9.9, Xvfb and GTK3
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          if [ ! -x /opt/apache-maven-3.9.9/bin/mvn ]; then
            curl -fsSL --retry 4 --retry-delay 2 https://archive.apache.org/dist/maven/maven/3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://downloads.apache.org/maven/maven/3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
            sudo tar -xzf /tmp/mvn.tgz -C /opt
          fi
          /opt/apache-maven-3.9.9/bin/mvn -version

      - name: Checkout SI-MCP exact SHA (ephemeral copy)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch "$PROBE_REF" --depth=30 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git checkout -q "$PROBE_SHA"
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "AGENT12_284R_EXACT_SHA=$ACTUAL_SHA label=$PROBE_LABEL"
          test "$ACTUAL_SHA" = "$PROBE_SHA"

      - name: Run comparison-adjacent classes once
        shell: bash
        run: |
          set -uo pipefail
          set +e
          CLASSES=ThreeWayComparisonToolTest,UpdateReportTest,TheBaselineComparesByTripleTest,SupportSnapshotTest,SupportEntryNamingTest,ExtensionDiffSaysMissingChildrenAreInheritedTest,WhatTheSchemaStoppedSayingTheHelpSaysTest,MergeSaysWhatThisSideLostTest,MergeRestorePointTest,CoarseGrainHoldsWhatItCannotProveTest,AHelpCallMustBeMakeableTest
          echo "AGENT12_284R_BEGIN label=$PROBE_LABEL classes=$CLASSES"
          (cd src/server && xvfb-run -a /opt/apache-maven-3.9.9/bin/mvn -B -ntp -Dstyle.color=never \
            -pl targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests -am \
            -Dtest="$CLASSES" verify) > /tmp/mvn_regression.log 2>&1
          echo "AGENT12_284R_MVN_EXIT label=$PROBE_LABEL rc=$?"
          tail -n 20 /tmp/mvn_regression.log
          LABEL="$PROBE_LABEL" python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          label = os.environ['LABEL']
          tt = ff = ee = ss = 0
          for xp in sorted(glob.glob('src/server/tests/si.edt.mcp.server.tests/target/surefire-reports/TEST-*.xml')):
              root = ET.parse(xp).getroot()
              t = int(root.attrib.get('tests', 0)); f = int(root.attrib.get('failures', 0))
              e = int(root.attrib.get('errors', 0)); s = int(root.attrib.get('skipped', 0))
              tt += t; ff += f; ee += e; ss += s
              print(f"AGENT12_284R_XML {label} {root.attrib.get('name')}: T={t} F={f} E={e} S={s}")
              for tc in root.findall('testcase'):
                  st = 'PASS'
                  for tag in ('failure', 'error', 'skipped'):
                      el = tc.find(tag)
                      if el is not None:
                          st = f"{tag.upper()}: {el.attrib.get('message','')}"
                  if st != 'PASS':
                      print(f"AGENT12_284R_BAD {label} {tc.attrib.get('name')}: {st[:250]}")
          print(f"AGENT12_284R_TOTAL {label}: T={tt} F={ff} E={ee} S={ss}")
          PY
          exit 0
