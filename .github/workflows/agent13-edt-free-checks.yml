name: '№13 — EDT-free проверки SI-MCP на hosted (точный SHA)'

# Кто:    участник №13.
# Когда:  28.11.2026.
# Что:    1) добавлен workflow_call и вход check (all по умолчанию) для маршрутизации workflow SI-MCP без ubuntu-*;
#         2) починена установка gitleaks v8.24.3 (модуль github.com/zricethezav/gitleaks/v8) и передача .gitleaksignore;
#         3) починен парсер сводки pytest -q в client + подключена проверка baseline subTest (213);
#         4) добавлена безопасная сводка кодов проверок run-gates.sh без вывода приватных путей;
#         5) серверный job суммирует tests/failures/errors/skipped из Surefire/Failsafe XML без имён тестов.
# Почему: в матрице #46053956569 на 57e8ca96 gitleaks падал на go.mod пути, client печатал CLIENT_TESTS_SUMMARY=unavailable,
#         scripts не сообщал имя покрасневшего гейта; #678 требует сравнить тестовые счётчики головы и базы.
# Основание: issue #660 / А1-0487; issue #678 / А1-0494.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Точный 40-символьный SHA SI-MCP'
        required: true
        type: string
      check:
        description: 'Категория матрицы или all (по умолчанию all)'
        required: false
        default: 'all'
        type: string
  workflow_call:
    inputs:
      sha:
        description: 'Точный 40-символьный SHA SI-MCP'
        required: true
        type: string
      check:
        description: 'Категория матрицы или all (по умолчанию all)'
        required: false
        default: 'all'
        type: string
permissions:
  contents: read
concurrency:
  # было: group: si-mcp-edt-free-${{ inputs.sha }}-${{ github.actor }}
  group: si-mcp-edt-free-${{ inputs.sha }}-${{ inputs.check || 'all' }}-${{ github.actor }}
  cancel-in-progress: true
jobs:
  checks:
    name: 'Hosted EDT-free: ${{ matrix.check }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # было: check: [client, text, gitleaks, scripts, docs, form-skd, bsl, contract, powershell, server, snapshot]
        check: ${{ fromJSON((!inputs.check || inputs.check == 'all') && '["client","text","gitleaks","scripts","docs","form-skd","bsl","contract","powershell","server","snapshot"]' || format('["{0}"]', inputs.check)) }}
    env:
      TARGET_SHA: ${{ inputs.sha }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Validate immutable source SHA
        shell: bash
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid SHA input'; exit 2; }
      - name: Checkout public workflow wrapper
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout private SI-MCP at exact SHA using read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: ${{ inputs.sha }}
          ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 0
          path: source
      - name: Verify checked-out source
        shell: bash
        run: |
          actual=$(git -C source rev-parse HEAD)
          echo "SOURCE_SHA=$actual"
          test "${actual,,}" = "${TARGET_SHA,,}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        if: matrix.check == 'client' || matrix.check == 'form-skd' || matrix.check == 'contract'
        run: python -m pip install --quiet --disable-pip-version-check pytest requests pyyaml
      - uses: actions/setup-java@v4
        if: matrix.check == 'scripts' || matrix.check == 'server'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        if: matrix.check == 'gitleaks'
        with:
          go-version: '1.24.x'
      - name: Install pinned Gitleaks
        if: matrix.check == 'gitleaks'
        shell: bash
        run: |
          # Кто: участник №13. Когда: 28.11.2026.
          # Что: исправлен Go module path для gitleaks v8.24.3.
          # Почему: go.mod v8.24.3 объявляет module github.com/zricethezav/gitleaks/v8 (падение job 140691814951).
          # Основание: issue #660, наряд А1-0487.
          # было: go install github.com/gitleaks/gitleaks/v8@v8.24.3
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Client tests
        if: matrix.check == 'client'
        shell: bash
        run: |
          set +e
          (cd source/client && python make_installer.py) > "$RUNNER_TEMP/installer.log" 2>&1
          build_rc=$?
          if [ "$build_rc" -eq 0 ]; then
            (cd source/client && python -m pytest -q tests > "$RUNNER_TEMP/client-tests.log" 2>&1)
            test_rc=$?
          else
            test_rc=99
          fi
          echo "INSTALLER_EXIT=$build_rc CLIENT_TESTS_EXIT=$test_rc"
          # Кто: участник №13. Когда: 28.11.2026.
          # Что: парсер сводки pytest -q поддерживает failed перед passed, subtests passed и отсутствие рамок ===,
          #      плюс вызывает tools/pytest_subtests.py --baseline 213 (#613).
          # Почему: прежняя регулярка требовала рамки === и passed первым полем, возвращая CLIENT_TESTS_SUMMARY=unavailable (job 140691814999).
          # Основание: issue #660, наряд А1-0487.
          # было: lines=re.findall(r'(?m)^=+\s*(\d+\s+passed(?:,\s*\d+\s+(?:failed|skipped|error|errors))*(?:,\s*[0-9.]+s)?)\s*=+$',text)
          python - "$RUNNER_TEMP/client-tests.log" <<'PY'
          import re,sys
          try: text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          except OSError: text=''
          pat=re.compile(r'(?m)^=*\s*((?:\d+\s+(?:failed|passed|skipped|xfailed|xpassed|warnings?|errors?|subtests?\s+passed)(?:,\s*)?)+(?:\s+in\s+[0-9.]+s(?:\s*\([0-9:]+\))?)?)\s*=*$')
          lines=[m.group(1).strip() for m in pat.finditer(text)]
          print('CLIENT_TESTS_SUMMARY='+ (lines[-1] if lines else 'unavailable'))
          PY
          subtest_rc=0
          if [ "$build_rc" -eq 0 ] && [ -f tools/pytest_subtests.py ]; then
            python tools/pytest_subtests.py "$RUNNER_TEMP/client-tests.log" --baseline 213
            subtest_rc=$?
            echo "SUBTEST_CHECK_EXIT=$subtest_rc"
          fi
          [ "$build_rc" -eq 0 ] && [ "$test_rc" -eq 0 ] && [ "$subtest_rc" -eq 0 ]
      - name: Clean text gate
        if: matrix.check == 'text'
        shell: bash
        run: |
          set +e
          python source/tools/проверка-текста.py > "$RUNNER_TEMP/text.log" 2>&1
          rc=$?
          echo "TEXT_GATE_EXIT=$rc"
          [ "$rc" -eq 0 ]
      - name: Gitleaks scan of private source history (redacted, no report upload)
        if: matrix.check == 'gitleaks'
        shell: bash
        run: |
          set +e
          # Кто: участник №13. Когда: 28.11.2026.
          # Что: передача --gitleaks-ignore-path source/.gitleaksignore при наличии файла в приватном дереве.
          # Почему: скан вызывается из родительского каталога по пути source, явный флаг гарантирует учёт исключений не-секретов.
          # Основание: issue #660, наряд А1-0487.
          # было: gitleaks git --redact --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" source > "$RUNNER_TEMP/gitleaks.log" 2>&1
          ignore_args=()
          if [ -f source/.gitleaksignore ]; then
            ignore_args=(--gitleaks-ignore-path source/.gitleaksignore)
          fi
          gitleaks git --redact "${ignore_args[@]}" --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" source > "$RUNNER_TEMP/gitleaks.log" 2>&1
          rc=$?
          python - "$RUNNER_TEMP/gitleaks.json" <<'PY'
          import json,sys
          try: findings=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception: findings=[]
          print('GITLEAKS_FINDINGS='+str(len(findings)))
          PY
          echo "GITLEAKS_EXIT=$rc"
          [ "$rc" -eq 0 ]
      - name: Server script gates and Python tests
        if: matrix.check == 'scripts'
        shell: bash
        run: |
          set +e
          (cd source/server && bash scripts/run-gates.sh) > "$RUNNER_TEMP/script-gates.log" 2>&1
          gates_rc=$?
          (cd source/server/scripts/tests && python -m unittest discover -s . -p 'test_*.py') > "$RUNNER_TEMP/script-tests.log" 2>&1
          tests_rc=$?
          # Кто: участник №13. Когда: 28.11.2026.
          # Что: печать безопасной сводки имён/кодов проверок run-gates.sh без приватных путей и исходников.
          # Почему: в прогоне #46053956569 (job 140691814854) выводился только SCRIPT_GATES_EXIT=1 без имени упавшей проверки.
          # Основание: issue #660, наряд А1-0487.
          python - "$RUNNER_TEMP/script-gates.log" <<'PY'
          import re,sys
          try: text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          except OSError: text=''
          failed=[]
          total=0
          for m in re.finditer(r'(?m)^([A-Za-z0-9_.-]+\.py)\s+(\d+)\s+(\S+)\s+([^\r\n]+)$',text):
              name,code,verdict=m.group(1),int(m.group(2)),m.group(4).strip()
              total+=1
              if code==1:
                  failed.append(f'{name}(rc={code},{verdict})')
          print(f"SCRIPT_GATES_COUNT={total} SCRIPT_GATES_FAILED={','.join(failed) if failed else 'none'}")
          PY
          echo "SCRIPT_GATES_EXIT=$gates_rc SCRIPT_TESTS_EXIT=$tests_rc"
          [ "$gates_rc" -eq 0 ] && [ "$tests_rc" -eq 0 ]
      - name: Documentation hygiene and ZIP path regression
        if: matrix.check == 'docs'
        shell: bash
        run: |
          set +e
          python source/tools/проверка-длин-имен.py > "$RUNNER_TEMP/docs-hygiene.log" 2>&1
          hygiene_rc=$?
          python - <<'PYZIP'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED,ZipFile
          root=Path('source/docs')
          with ZipFile('/tmp/si-mcp-docs.zip','w',compression=ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  z.write(p,p.as_posix())
          PYZIP
          unzip -l /tmp/si-mcp-docs.zip > "$RUNNER_TEMP/unzip-list.log" 2>&1
          zip_rc=$?
          if grep -q 'File name too long' "$RUNNER_TEMP/unzip-list.log"; then zip_rc=1; fi
          echo "DOCS_HYGIENE_EXIT=$hygiene_rc ZIP_PATH_REGRESSION_EXIT=$zip_rc"
          [ "$hygiene_rc" -eq 0 ] && [ "$zip_rc" -eq 0 ]
      - name: Form and SKD offline tools
        if: matrix.check == 'form-skd'
        shell: bash
        run: |
          set +e
          for f in tests/test_form_tools.py tests/test_skd_tools.py tests/test_form_roundtrip.py tests/test_skd_roundtrip.py; do
            python "source/$f" > "$RUNNER_TEMP/$(basename "$f").log" 2>&1
            rc=$?
            echo "${f##*/}_EXIT=$rc"
            [ "$rc" -eq 0 ] || exit "$rc"
          done
      - name: Static BSL corpus validation
        if: matrix.check == 'bsl'
        shell: bash
        run: |
          set +e
          (cd source/data/bsl-corpus && python check_corpus.py) > "$RUNNER_TEMP/bsl-corpus.log" 2>&1
          rc=$?
          echo "BSL_CORPUS_EXIT=$rc"
          [ "$rc" -eq 0 ]
      - name: MCP contract tests (no EDT)
        if: matrix.check == 'contract'
        shell: bash
        run: |
          set +e
          python -m pytest -q source/tests/mcp/test_mcp_contract.py > "$RUNNER_TEMP/mcp-contract.log" 2>&1
          rc=$?
          python - "$RUNNER_TEMP/mcp-contract.log" <<'PY'
          import re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          m=re.search(r'(\d+ passed(?:, \d+ failed)?(?:, \d+ skipped)?(?: in [0-9.]+s)?)',text)
          print('MCP_CONTRACT_SUMMARY='+ (m.group(1) if m else 'unavailable'))
          PY
          echo "MCP_CONTRACT_EXIT=$rc"
          [ "$rc" -eq 0 ]
      - name: PowerShell EDT-update unit test (mock-only, no EDT)
        if: matrix.check == 'powershell'
        shell: bash
        run: |
          set +e
          pwsh -NoLogo -NoProfile -File source/server/scripts/tests/test_edt_selfupdate.ps1 > "$RUNNER_TEMP/powershell.log" 2>&1
          rc=$?
          echo "POWERSHELL_TEST_EXIT=$rc"
          [ "$rc" -eq 0 ]
      - name: Install Xvfb for the hosted Maven test suite
        if: matrix.check == 'server'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
      - name: Install pinned Maven 3.9.9
        if: matrix.check == 'server'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 20 --max-time 300 -o "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz
          mkdir -p "$RUNNER_TEMP/maven"
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP/maven" --strip-components=1
          echo "$RUNNER_TEMP/maven/bin" >> "$GITHUB_PATH"
      - name: Server Maven verify
        if: matrix.check == 'server'
        shell: bash
        env:
          MAVEN_OPTS: -Xmx3g
        run: |
          set +e
          xvfb-run --auto-servernum mvn -B -ntp -Dstyle.color=never -f source/server/pom.xml verify > "$RUNNER_TEMP/server-maven.log" 2>&1
          rc=$?
          python - "$RUNNER_TEMP/server-maven.log" source/server <<'PY'
          # Кто: №13, 28.11.2026. Что: агрегировать только четыре числовых счётчика JUnit.
          # Почему: #678 требует сравнить passed/failed/errors/skipped на точной голове и базе;
          #      имена классов/кейсов и содержимое отчётов в публичный домик не выводятся.
          # Основание: issue #678, критерий 4.
          # Было: SUREFIRE_LINES считал строки Maven, но не сообщал общее число тестов.
          import pathlib,re,sys,xml.etree.ElementTree as ET
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          source=pathlib.Path(sys.argv[2])
          print('MAVEN_VERDICT='+ ('BUILD SUCCESS' if 'BUILD SUCCESS' in text else 'BUILD FAILURE' if 'BUILD FAILURE' in text else 'unavailable'))
          counts=re.findall(r'Tests run: [^\r\n]+',text)
          print('SUREFIRE_LINES='+str(len(counts)))
          totals={'tests':0,'failures':0,'errors':0,'skipped':0}
          xml_files=0
          parse_errors=0
          for path in source.rglob('TEST-*.xml'):
              if not any(part in ('surefire-reports','failsafe-reports') for part in path.parts):
                  continue
              xml_files+=1
              try:
                  root=ET.parse(path).getroot()
                  for key in totals:
                      totals[key]+=int(root.attrib.get(key,'0'))
              except (OSError,ET.ParseError,ValueError):
                  parse_errors+=1
          print('SERVER_TEST_COUNTS='+' '.join(f'{key}={value}' for key,value in totals.items()))
          print(f'SERVER_TEST_XML_FILES={xml_files} SERVER_TEST_XML_PARSE_ERRORS={parse_errors}')
          if xml_files == 0 or parse_errors:
              raise SystemExit(2)
          PY
          summary_rc=$?
          echo "SERVER_VERIFY_EXIT=$rc SERVER_TEST_SUMMARY_EXIT=$summary_rc"
          [ "$rc" -eq 0 ] && [ "$summary_rc" -eq 0 ]
      - name: Snapshot packaging smoke test (private output not uploaded)
        if: matrix.check == 'snapshot'
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git -C source rev-parse HEAD)
          git -C source archive --format=zip --prefix="SI-MCP-$SHA/" -o "$RUNNER_TEMP/snapshot.zip" "$SHA"
          git -C source bundle create "$RUNNER_TEMP/history.bundle" --all
          git -C source bundle verify "$RUNNER_TEMP/history.bundle" >/dev/null 2>&1
          python - "$SHA" "$RUNNER_TEMP/snapshot.zip" "$RUNNER_TEMP/history.bundle" <<'PY'
          import sys,zipfile
          z=zipfile.ZipFile(sys.argv[2]);bad=z.testzip()
          if bad: raise SystemExit('ZIP integrity failed')
          print('SNAPSHOT_SHA='+sys.argv[1])
          print('SNAPSHOT_FILE_COUNT='+str(len([n for n in z.namelist() if not n.endswith('/')])) )
          print('SNAPSHOT_PACKAGING=valid')
          PY
          rm -f "$RUNNER_TEMP/snapshot.zip" "$RUNNER_TEMP/history.bundle"
