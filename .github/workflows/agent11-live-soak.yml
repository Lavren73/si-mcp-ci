    - name: Upload sanitized smoke evidence only
      if: always() && env.SMOKE_RUN != ''
      uses: actions/upload-artifact@v4
      with:
        name: live-observation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.SMOKE_RUN }}/reports/
        retention-days: 7
    - name: Show retained result path and disk space
      if: always()
      shell: bash
      run: |
        if [ -n "${SMOKE_RUN:-}" ]; then
          echo "RETAINED=$SMOKE_RUN"
          df -h "$SMOKE_RUN"
        fi
