name: SI-MCP — isolated EDT read-only live and 60-minute observation (11)
'on':
  workflow_dispatch:
    inputs:
      observation_seconds:
        description: 0=quick live check; 3600=one-hour low-load observation
        required: true
        default: '3600'
        type: choice
        options:
        - '0'
        - '3600'
permissions:
  contents: read
concurrency:
  group: si1c-team-test-stand
  cancel-in-progress: false
jobs:
  smoke:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - si1c
    timeout-minutes: 80
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      OBSERVATION_SECONDS: ${{ inputs.observation_seconds }}
    steps:
    - name: Hold shared lock; visible-session guard; isolated live EDT and one-hour low-load observation
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        BASE="$HOME/si1c-team-tests"
        test -d "$BASE" && test ! -L "$BASE" && test -O "$BASE"
        test "$(cat "$BASE/OWNER.txt")" = 'SI-MCP team test stand; provisioned by agent 11'
        exec 9>"$BASE/locks/live-tests.lock"
        echo 'Waiting for exclusive team live lock; never cancelling others.'
        flock -w 600 9
        RUN="$BASE/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        test ! -e "$RUN"
        mkdir -m 700 "$RUN"
        mkdir "$RUN/reports" "$RUN/home" "$RUN/workspace"
        echo "SMOKE_RUN=$RUN" >> "$GITHUB_ENV"
        export SMOKE_RUN="$RUN"
        python3 - <<'PY'
        """Runner-only read-only GUI/MCP smoke. No infobase or mutating tool calls."""
        import os,pathlib,json,time,secrets,subprocess,signal,socket,re,hashlib,urllib.request,urllib.error,sys,ipaddress
        BASE=pathlib.Path('/home/runner/si1c-team-tests')
        PREPARED=BASE/'runs/43070810460-1'
        RUN=pathlib.Path(os.environ['SMOKE_RUN'])
        WS=RUN/'workspace';HOME=RUN/'home';REPORTS=RUN/'reports'
        SUMMARY={'source':'b029b9e0566310aea3b02242bb23a568b71771f1','build_target':'2026.1','runtime_expected':'2026.2.2.21','scope':'Empty private workspace; no infobase opened, no mutating tool or model call','checks':{},'outcome':'failure'}
        TOKEN=secrets.token_urlsafe(40);SID=None;PROC=None;LOG=None
        CHECKS=SUMMARY['checks'];ERROR=None
        SUMMARY['host_manual_sessions']='Owner explicitly confirmed host EDT/1C manual sessions closed; container process scan is supplementary only'
        SUMMARY['purpose']='Prepared-build live transport/read-only call and 60-minute low-load observation; not release RC or full host stability certification'
        OBSERVATION_SECONDS=int(os.environ['OBSERVATION_SECONDS'])
        if OBSERVATION_SECONDS not in (0,3600):raise SystemExit('Unsupported observation duration')
        SUMMARY['soak_requested_seconds']=OBSERVATION_SECONDS

        def telemetry():
            mem={x.split(':')[0]:int(x.split()[1])*1024 for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith(('MemTotal:','MemAvailable:','SwapFree:','SwapTotal:'))}
            out={'time_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'monotonic':time.monotonic(),'uptime_seconds':float(pathlib.Path('/proc/uptime').read_text().split()[0]),'loadavg':pathlib.Path('/proc/loadavg').read_text().strip(),'memory':mem}
            for name in ('cpu','memory','io'):
                p=pathlib.Path('/proc/pressure')/name
                if p.is_file():out['pressure_'+name]=p.read_text().strip()
            for name in ('memory.current','memory.max','memory.events','memory.swap.current'):
                p=pathlib.Path('/sys/fs/cgroup')/name
                if p.is_file():out[name]=p.read_text().strip()
            return out

        def kernel_signals():
            try:
                p=subprocess.run(['dmesg','--color=never'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=10)
            except (OSError,subprocess.TimeoutExpired):return {'available':False,'scope':'container; no privilege escalation'}
            if p.returncode:return {'available':False,'exit':p.returncode,'scope':'container; not host-wide absence of errors'}
            text=p.stdout
            patterns={'soft_lockup':r'(?i)soft lockup','rcu_stall':r'(?i)rcu.*(?:stall|stuck)','netdev_watchdog':r'NETDEV WATCHDOG','iommu_fault':r'IO_PAGE_FAULT','oom':r'(?i)out of memory|oom-kill','kernel_panic':r'(?i)kernel panic','hung_task':r'(?i)blocked for more than'}
            return {'available':True,'scope':'readable kernel ring buffer only, may wrap','counts':{k:len(re.findall(v,text)) for k,v in patterns.items()}}


        def check(name,condition,detail=None):
            CHECKS[name]={'passed':bool(condition)}
            if detail is not None:CHECKS[name]['detail']=detail
            print('CHECK '+name+'='+('PASS' if condition else 'FAIL'),flush=True)
            if not condition:raise RuntimeError(name)

        def safe_path(p,parent):
            check('safe_path_'+p.name,p.is_dir() and not p.is_symlink() and p.resolve().is_relative_to(parent.resolve()))

        def other_sessions():
            busy=[]
            for p in pathlib.Path('/proc').iterdir():
                if not p.name.isdecimal():continue
                try:
                    name=(p/'comm').read_text().strip()
                    if name in ('java','javaw','1cedt','1cedtcli','1cv8','1cv8c','rphost','ragent','rmngr','ras'):
                        busy.append({'pid':int(p.name),'name':name})
                except (OSError,ValueError):pass
            return busy

        def listeners(port):
            out=[]
            for filename in ('/proc/net/tcp','/proc/net/tcp6'):
                for line in pathlib.Path(filename).read_text().splitlines()[1:]:
                    a=line.split()
                    if len(a)<10 or a[3]!='0A':continue
                    ip,p=a[1].split(':')
                    if int(p,16)==port:
                        raw=bytes.fromhex(ip)
                        packed=raw[::-1] if filename.endswith('/tcp') else b''.join(raw[i:i+4][::-1] for i in range(0,16,4))
                        address=ipaddress.ip_address(packed)
                        address=getattr(address,'ipv4_mapped',None) or address
                        out.append((str(address),a[9]))
            return out

        def owned_socket_inodes():
            owned=set()
            if PROC is None:return owned
            for p in pathlib.Path('/proc').iterdir():
                if not p.name.isdecimal():continue
                try:
                    if os.getpgid(int(p.name))!=PROC.pid:continue
                    for f in (p/'fd').iterdir():
                        try:
                            target=os.readlink(f)
                            m=re.fullmatch(r'socket:\[(\d+)\]',target)
                            if m:owned.add(m.group(1))
                        except OSError:pass
                except (OSError,ValueError):pass
            return owned

        def own_workspace_processes():
            found=[]
            for p in pathlib.Path('/proc').iterdir():
                if not p.name.isdecimal():continue
                try:
                    if p.stat().st_uid!=os.getuid():continue
                    name=(p/'comm').read_text().strip()
                    if name not in ('java','javaw','1cedt','1cedtcli'):continue
                    args=(p/'cmdline').read_bytes().split(b'\0')
                    if str(WS).encode() not in args:continue
                    if not any(x.startswith(str(PREPARED/'edt').encode()+b'/') for x in args):continue
                    start=(p/'stat').read_text().rsplit(')',1)[1].split()[19]
                    found.append((int(p.name),start))
                except (OSError,ValueError,IndexError):pass
            return found

        def stop_exact_own_processes():
            targets=own_workspace_processes()
            SUMMARY['cleanup_exact_own_processes_found']=len(targets)
            for sig,wait in ((signal.SIGTERM,15),(signal.SIGKILL,5)):
                for pid,start in targets:
                    if (pid,start) in own_workspace_processes():
                        try:os.kill(pid,sig)
                        except ProcessLookupError:pass
                deadline=time.monotonic()+wait
                while time.monotonic()<deadline and own_workspace_processes():time.sleep(.5)
                if not own_workspace_processes():break
            SUMMARY['cleanup_remaining_exact_own_processes']=len(own_workspace_processes())

        def http(path,payload=None,auth=None,sid=None,method=None,timeout=45):
            h={'Accept':'application/json, text/event-stream','User-Agent':'SI-MCP-Agent11-ReadOnly-Smoke'}
            if payload is not None:h['Content-Type']='application/json'
            if auth:h['Authorization']='Bearer '+auth
            if sid:h['Mcp-Session-Id']=sid
            req=urllib.request.Request('http://127.0.0.1:'+str(PORT)+path,data=None if payload is None else json.dumps(payload).encode(),headers=h,method=method)
            try:
                with urllib.request.urlopen(req,timeout=timeout) as r:return r.status,r.headers,r.read(8000000).decode('utf-8','replace')
            except urllib.error.HTTPError as e:return e.code,e.headers,e.read(8000000).decode('utf-8','replace')

        def rpc_parse(body,ident):
            if body.lstrip().startswith('{'):values=[json.loads(body)]
            else:
                values=[]
                for block in re.split(r'\r?\n\r?\n',body):
                    data='\n'.join(x[5:].lstrip() for x in block.splitlines() if x.startswith('data:'))
                    if data and data!='[DONE]':values.append(json.loads(data))
            matches=[x for x in values if isinstance(x,dict) and x.get('id')==ident]
            if len(matches)!=1:raise RuntimeError('RPC identity missing or duplicated')
            x=matches[0]
            if x.get('jsonrpc')!='2.0' or 'error' in x or not isinstance(x.get('result'),dict):raise RuntimeError('RPC error or invalid result')
            return x['result']

        def call(ident,method,params):
            code,headers,body=http('/mcp',{'jsonrpc':'2.0','id':ident,'method':method,'params':params},TOKEN,SID)
            check(method.replace('/','_')+'_http_'+str(ident),code==200,{'http_status':code})
            return rpc_parse(body,ident)

        try:
            SUMMARY['kernel']=os.uname().release
            check('diagnostic_kernel_5_15',SUMMARY['kernel']=='5.15.0-203-generic')
            mem={x.split(':')[0]:int(x.split()[1])*1024 for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith(('MemTotal:','MemAvailable:'))}
            SUMMARY['memory_before']=mem
            check('memory_available_at_least_5GiB',mem.get('MemAvailable',0)>=5*1024**3)
            for root,current,limit in [('/sys/fs/cgroup','memory.current','memory.max'),('/sys/fs/cgroup/memory','memory.usage_in_bytes','memory.limit_in_bytes')]:
                c=pathlib.Path(root)/current;l=pathlib.Path(root)/limit
                if c.exists() and l.exists():
                    v=l.read_text().strip();used=int(c.read_text().strip())
                    SUMMARY['cgroup_memory']={'limit':v,'used':used}
                    check('cgroup_memory_headroom',v=='max' or int(v)-used>=4*1024**3)
                    break
            for p,parent in [(RUN,BASE/'runs'),(PREPARED,BASE/'runs'),(WS,RUN),(HOME,RUN),(REPORTS,RUN)]:safe_path(p,parent)
            check('prepared_ready_marker',(PREPARED/'READY-FOR-READONLY-SMOKE').is_file())
            sha=subprocess.check_output(['git','-C',str(PREPARED/'source'),'rev-parse','HEAD'],text=True).strip()
            check('exact_source',sha==SUMMARY['source'])
            roots=[p.parent for p in (PREPARED/'edt').rglob('1cedt') if p.is_file()]
            check('one_prepared_launcher',len(roots)==1)
            EDT=roots[0]
            java=[p for p in (PREPARED/'edt').rglob('java') if p.is_file() and p.parent.name=='bin' and os.access(p,os.X_OK)]
            check('one_embedded_java',len(java)==1)
            expected={'si.edt.mcp.server_1.0.0.202611111717.jar':'aa9c059a7b0f287f6ca14916bf56a428146c6f46a71c457b86f684a237194de2','si.edt.mcp.oform_1.0.0.202611111717.jar':'aa10906ad88d6f009ee94d2becc07d80db8e5b796019dd109e1caa9660990267'}
            for n,digest in expected.items():
                p=EDT/'plugins'/n
                check('plugin_hash_'+n,p.is_file() and not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest()==digest)
            busy=other_sessions();SUMMARY['preflight_visible_sessions']=busy
            check('no_other_visible_edt_java_1c_sessions',not busy,{'count':len(busy),'scope':'processes visible inside runner container only; no host-wide claim'})
            check('fresh_workspace',not (WS/'.metadata').exists() and not list(WS.iterdir()))
            with socket.socket() as s:s.bind(('127.0.0.1',0));PORT=s.getsockname()[1]
            SUMMARY['loopback_port']=PORT
            prefs=WS/'.metadata/.plugins/org.eclipse.core.runtime/.settings/si.edt.mcp.server.prefs';prefs.parent.mkdir(parents=True)
            prefs.write_text('eclipse.preferences.version=1\nmcpServerAutoStart=true\nmcpServerPort='+str(PORT)+'\nmcpServerPortSpan=1\nmcpAuthEnabled=true\nmcpAuthToken='+TOKEN+'\nmcpBindAllInterfaces=false\nmcpAllowNullOrigin=false\nmcpToolPreset=READ_ONLY\nmcpToolAccessLevel=readOnly\nmcpToolsetsGranted=false\nmcpAgentRightsMode=none\nmcpNaparnikBridgeEnabled=false\nmcpNaparnikAllToolsEnabled=false\nmcpUpkeepEnabled=false\nmcpHistoryFileEnabled=false\nmcpHistoryDiskEnabled=false\nmcpDebugLogEnabled=false\n',encoding='utf-8')
            prefs.chmod(0o600)
            env=os.environ.copy();env.update({'HOME':str(HOME),'XDG_CONFIG_HOME':str(HOME/'.config'),'XDG_CACHE_HOME':str(HOME/'.cache'),'XDG_DATA_HOME':str(HOME/'.local/share')})
            LOG=(RUN/'edt-private.log').open('wb')
            cmd=['nice','-n','10','ionice','-c2','-n7','xvfb-run','-a',str(EDT/'1cedt'),'-vm',str(java[0]),'-nosplash','-data',str(WS),'-consoleLog','--launcher.appendVmargs','-vmargs','-Xmx3g','-XX:ActiveProcessorCount=4','-Duser.home='+str(HOME),'-Dfile.encoding=UTF-8']
            PROC=subprocess.Popen(cmd,stdout=LOG,stderr=subprocess.STDOUT,start_new_session=True,env=env,cwd=str(RUN))
            SUMMARY['gui_process_launched']=True
            deadline=time.monotonic()+300;last=0
            while time.monotonic()<deadline:
                if PROC.poll() is not None:raise RuntimeError('EDT exited before listener readiness')
                active=listeners(PORT)
                if active:
                    check('listener_loopback_only',all(ipaddress.ip_address(ip).is_loopback for ip,inode in active),{'listeners':[{'address':ip,'inode':inode} for ip,inode in active]})
                    own=owned_socket_inodes()
                    check('listener_owned_by_our_process_group',all(inode in own for ip,inode in active))
                    break
                if time.monotonic()-last>10:print('Waiting for own EDT/MCP listener...',flush=True);last=time.monotonic()
                time.sleep(2)
            else:raise RuntimeError('MCP listener timeout after 300 seconds')
            health_deadline=time.monotonic()+90
            while True:
                code,h,body=http('/health',auth=TOKEN)
                if code!=200:raise RuntimeError('Health HTTP status '+str(code))
                health=json.loads(body)
                if health.get('blockedByDialog') is True:raise RuntimeError('Workbench blocked by dialog; no automatic answering')
                if health.get('phase')=='ready' and health.get('uiResponding') is True:break
                if time.monotonic()>=health_deadline:raise RuntimeError('Workbench readiness was not confirmed')
                print('Waiting for health phase=ready and uiResponding=true...',flush=True);time.sleep(3)
            check('health_http',code==200,{'http_status':code})
            SUMMARY['health']={k:health.get(k) for k in ('status','edt_version','phase','uiResponding','blockedByDialog','ordinaryFormsRegistered')}
            check('health_status',health.get('status')=='ok')
            check('workbench_ready',health.get('phase')=='ready' and health.get('uiResponding') is True)
            check('health_runtime_version',health.get('edt_version')=='2026.2.2.21')
            check('empty_health_projects',health.get('projects')==[])
            if health.get('blockedByDialog') is True:raise RuntimeError('Workbench blocked by dialog; no automatic answer/restart')
            init={'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-11-25','capabilities':{},'clientInfo':{'name':'agent11-readonly-smoke','version':'1'}}}
            code,_,_=http('/mcp',init)
            check('unauthenticated_401',code==401,{'http_status':code})
            code,_,_=http('/mcp',init,auth='deliberately-invalid-agent11-token')
            check('wrong_token_401',code==401,{'http_status':code})
            code,h,body=http('/mcp',init,TOKEN)
            check('initialize_http',code==200,{'http_status':code})
            initialized=rpc_parse(body,1)
            check('initialize_contract',isinstance(initialized.get('serverInfo'),dict) and isinstance(initialized.get('capabilities'),dict) and isinstance(initialized.get('protocolVersion'),str))
            SID=h.get('Mcp-Session-Id')
            check('session_id_present',bool(SID))
            code,_,_=http('/mcp',{'jsonrpc':'2.0','method':'notifications/initialized'},TOKEN,SID)
            check('initialized_notification',code in (200,202,204),{'http_status':code})
            ping=call(2,'ping',{});check('ping_empty_result',ping=={})
            tools=call(3,'tools/list',{})
            rows=tools.get('tools');check('nonempty_tool_catalog',isinstance(rows,list) and len(rows)>0)
            check('tool_schema_objects',all(isinstance(x,dict) and isinstance(x.get('name'),str) and isinstance(x.get('inputSchema'),dict) for x in rows))
            SUMMARY['advertised_tool_count_first_page']=len(rows)
            names=[x['name'] for x in rows]
            SUMMARY['advertised_tool_names']=names
            SUMMARY['project_admin_advertised']='project_admin' in names
            check('unique_catalog_names',len(names)==len(set(names)))
            check('catalog_complete_without_cursor',not tools.get('nextCursor'))
            # Agreed with owner/13: known source read-only alias only; never use the
            # mixed write facade, change unlisted/disabled/lease, or retry a refusal.
            tool_name='list_projects';arguments={}
            SUMMARY['list_projects_advertised']='list_projects' in names
            SUMMARY['discovery_separate_from_callability']=True
            SUMMARY['known_legacy_security_advertisements']=[n for n in ('vanessa','yaxunit_tests') if n in names]
            SUMMARY['known_security_advertisements_not_called']=True
            SUMMARY['read_only_project_entrypoint']=tool_name
            result=call(4,'tools/call',{'name':tool_name,'arguments':arguments})
            check('read_only_tool_not_error',result.get('isError') is not True)
            content=result.get('content');check('tool_content_list',isinstance(content,list))
            texts=[x['text'] for x in content if isinstance(x,dict) and x.get('type')=='text' and isinstance(x.get('text'),str)]
            text='\n'.join(texts)
            check('empty_workspace_project_count',bool(re.search(r'\*\*Project count:\*\*\s*0\s+projects',text)))
            check('no_project_files_created',not any(WS.glob('*/.project')))
            SUMMARY['mcp_read_only_smoke_passed']=True
            SUMMARY['kernel_signals_before']=kernel_signals()
            start=time.monotonic();end=start+OBSERVATION_SECONDS;index=0;minmem=None
            previous=telemetry()
            (REPORTS/'observation-state.json').write_text(json.dumps({'status':'started','elapsed_seconds':0,'source':SUMMARY['source']}))
            with (REPORTS/'stability-samples.jsonl').open('a',buffering=1) as samples:
                while True:
                    now=telemetry();index+=1
                    if PROC.poll() is not None:raise RuntimeError('EDT launcher exited during observation')
                    if now['uptime_seconds']<previous['uptime_seconds']:raise RuntimeError('Uptime discontinuity')
                    avail=now['memory'].get('MemAvailable',0)
                    minmem=avail if minmem is None else min(avail,minmem)
                    if avail<3*1024**3:raise RuntimeError('Observation memory safety threshold below 3GiB')
                    for tag in ('oom','oom_kill'):
                        parse=lambda x:{a:int(b) for a,b in (line.split() for line in x.get('memory.events','').splitlines())}
                        if parse(now).get(tag,0)>parse(previous).get(tag,0):raise RuntimeError('New cgroup '+tag+' event')
                    code,_,body=http('/health',auth=TOKEN,timeout=10)
                    if code!=200:raise RuntimeError('Observation health HTTP not 200')
                    h=json.loads(body)
                    if h.get('phase')!='ready' or h.get('uiResponding') is not True or h.get('blockedByDialog') is True:raise RuntimeError('Observation UI not ready or blocked')
                    if h.get('projects')!=[]:raise RuntimeError('Unexpected project in isolated workspace')
                    code,_,body=http('/mcp',{'jsonrpc':'2.0','id':1000+index,'method':'ping','params':{}},TOKEN,SID,timeout=10)
                    if code!=200 or rpc_parse(body,1000+index)!={}:raise RuntimeError('Observation ping failed')
                    now['health_ready']=True;now['mcp_ping']=True;now['elapsed_seconds']=round(time.monotonic()-start,2)
                    samples.write(json.dumps(now)+'\n')
                    (REPORTS/'observation-state.json').write_text(json.dumps({'status':'running','elapsed_seconds':now['elapsed_seconds'],'samples':index,'min_MemAvailable_bytes':minmem}))
                    print('OBSERVATION elapsed='+str(round(time.monotonic()-start))+'s/'+str(OBSERVATION_SECONDS)+'s; health=ready ping=PASS MemAvailableMiB='+str(avail//1024**2),flush=True)
                    previous=now
                    if time.monotonic()>=end:break
                    time.sleep(min(60,max(0,end-time.monotonic())))
            SUMMARY['observation']={'elapsed_seconds':round(time.monotonic()-start,2),'samples':index,'min_MemAvailable_bytes':minmem,'scope':'No stress generator: EDT/UI/MCP light periodic probes; not whole-host stability certification'}
            SUMMARY['kernel_signals_after']=kernel_signals()
            before=SUMMARY['kernel_signals_before'];after=SUMMARY['kernel_signals_after']
            if before.get('available') and after.get('available'):
                SUMMARY['kernel_signal_count_changes']={k:after['counts'][k]-before['counts'][k] for k in before['counts']}
                if any(v>0 for v in SUMMARY['kernel_signal_count_changes'].values()):raise RuntimeError('New suspicious kernel ring-buffer signals; investigate, do not claim stability')
            (REPORTS/'observation-state.json').write_text(json.dumps({'status':'completed','elapsed_seconds':SUMMARY['observation']['elapsed_seconds'],'samples':index}))
            code,_,_=http('/mcp',auth=TOKEN,sid=SID,method='DELETE')
            SUMMARY['session_delete_http']=code
            SUMMARY['outcome']='success'
        except Exception as e:
            ERROR=type(e).__name__+': '+str(e)
            for secret in (TOKEN,SID):
                if secret:ERROR=ERROR.replace(secret,'<redacted>')
            SUMMARY['failure']=ERROR[:800]
            print('SMOKE_FAILURE='+SUMMARY['failure'],flush=True)
        finally:
            if PROC is not None:
                try:os.killpg(PROC.pid,signal.SIGTERM)
                except ProcessLookupError:pass
                try:PROC.wait(timeout=20)
                except subprocess.TimeoutExpired:
                    try:os.killpg(PROC.pid,signal.SIGKILL)
                    except ProcessLookupError:pass
                    PROC.wait(timeout=10)
                SUMMARY['own_launcher_stopped']=PROC.poll() is not None
            if PROC is not None:
                stop_exact_own_processes()
                # xvfb-run may have exited before all children; close our surviving group too.
                try:os.killpg(PROC.pid,signal.SIGTERM)
                except ProcessLookupError:pass
            if 'PORT' in globals():
                until=time.monotonic()+10
                while listeners(PORT) and time.monotonic()<until:time.sleep(.5)
            if LOG:LOG.close()
            sources=[RUN/'edt-private.log',WS/'.metadata/.log']
            exception_types=[]
            for i,p in enumerate(sources):
                if not p.is_file() or p.is_symlink():continue
                text=p.read_text(encoding='utf-8',errors='replace')
                for secret in (TOKEN,SID):
                    if secret:text=text.replace(secret,'<redacted>')
                text=re.sub(r'(?i)(password|pwd|token|secret)(\s*[=:]\s*)[^\s;]+',r'\1\2<redacted>',text)
                (REPORTS/('edt-sanitized-'+str(i)+'.log')).write_text(text,encoding='utf-8')
                exception_types+=re.findall(r'\b((?:[a-zA-Z_]\w*\.)+(?:[A-Z]\w*(?:Exception|Error)))\b',text)
            SUMMARY['exception_types']=sorted(set(exception_types))
            if 'PORT' in globals():SUMMARY['own_port_closed']=not listeners(PORT)
            if SUMMARY.get('outcome')=='success' and (not SUMMARY.get('own_port_closed') or SUMMARY.get('cleanup_remaining_exact_own_processes',0)):
                SUMMARY['outcome']='failure';SUMMARY['failure']='Own listener still present after process cleanup'
            # The now-inactive random token is not retained in the workspace preferences.
            p=WS/'.metadata/.plugins/org.eclipse.core.runtime/.settings/si.edt.mcp.server.prefs'
            if p.is_file() and not p.is_symlink():
                text=p.read_text(encoding='utf-8',errors='replace')
                p.write_text('\n'.join(x for x in text.splitlines() if not x.startswith('mcpAuthToken='))+'\n',encoding='utf-8')
                p.chmod(0o600)
            (REPORTS/'smoke-summary.json').write_text(json.dumps(SUMMARY,ensure_ascii=False,indent=2),encoding='utf-8')
            print('SMOKE_OUTCOME='+SUMMARY['outcome'],flush=True)
        for p in REPORTS.rglob('*'):
            if not p.is_file() or p.is_symlink():continue
            text=p.read_text(errors='replace')
            if TOKEN in text or (SID and SID in text) or re.search(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|\bgh[pousr]_[A-Za-z0-9]{20,}|\bgithub_pat_[A-Za-z0-9_]{30,}',text):
                p.unlink()
                raise SystemExit('Potential secret report removed; refuse success')
        sys.exit(0 if SUMMARY['outcome']=='success' else 1)

