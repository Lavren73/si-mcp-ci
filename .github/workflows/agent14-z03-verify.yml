name: Agent 14 Hosted PR194 Verify (647f322e)
on:
  push:
    branches:
      - agent/14-hosted-z03-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-z03-verify
  cancel-in-progress: true

jobs:
  z03_settings_verify:
    name: "PR #194 (647f322e): settings OSGi suite + 2 isolation tests + negative control"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Maven and p2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-simcp-v1
          restore-keys: |
            ${{ runner.os }}-m2-simcp-

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          if ! command -v mvn >/dev/null 2>&1; then
            curl -fsSL https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
            sudo tar -xzf /tmp/mvn.tgz -C /opt
            echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          fi
          mvn -version || true

      - name: Checkout exact SHA 647f322e1e5b89a18eda1f59124ed27f18efedf0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch agent/14-z03-three-column-ui-tests --depth=30 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git checkout -q 647f322e1e5b89a18eda1f59124ed27f18efedf0
          echo "VERIFIED_SHA=$(git rev-parse HEAD)"

      - name: Text & server gates + settings OSGi tests + fault rollback negative control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          r_txt = subprocess.run(["python3", "tools/проверка-текста.py"], cwd=src, capture_output=True, text=True)
          print(f"Z03_TEXT exit={r_txt.returncode} last={(r_txt.stdout.strip().splitlines() or [''])[-1]}", flush=True)
          assert r_txt.returncode == 0

          r_gates = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"Z03_GATES exit={r_gates.returncode}", flush=True)
          print(r_gates.stdout.strip(), flush=True)
          assert r_gates.returncode == 0

          # 1. Focused 6 UI classes + RestoringToolDefaultsGivesTheShippedPresetTest (with 2 new isolation tests)
          focused = ",".join([
              "si.edt.mcp.server.settings.AKeptSetOutlivesThePresetChangeTest",
              "si.edt.mcp.server.settings.APresetChangeRepaintsTheHiddenMarksTest",
              "si.edt.mcp.server.settings.AQueryBringsBackTheTicksItShowsTest",
              "si.edt.mcp.server.settings.RestoringToolDefaultsGivesTheShippedPresetTest",
              "si.edt.mcp.server.settings.DefaultsDoNotCommitBeforeOkTest",
              "si.edt.mcp.server.settings.AGroupTickUnderAQuerySparesWhatItHidesTest",
          ])
          r_f = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              f"-Dtest={focused}", "test-compile", "tycho-surefire:test"
          ], cwd=srv, capture_output=True, text=True)
          print(f"Z03_FOCUSED_EXIT={r_f.returncode}", flush=True)
          if r_f.returncode != 0:
              print(r_f.stdout[-2500:], flush=True)

          # Parse JUnit XML for focused
          rep = srv / "tests/si.edt.mcp.server.tests/target/surefire-reports"
          ftot = [0, 0, 0, 0]
          for xp in sorted(rep.glob("TEST-*.xml")):
              root = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
              ftot[0] += int(root.attrib.get("tests", 0))
              ftot[1] += int(root.attrib.get("failures", 0))
              ftot[2] += int(root.attrib.get("errors", 0))
              ftot[3] += int(root.attrib.get("skipped", 0))
              print(f"  FOCUSED {root.attrib.get('name')}: T={root.attrib.get('tests')} F={root.attrib.get('failures')} E={root.attrib.get('errors')} S={root.attrib.get('skipped')}", flush=True)
          print(f"Z03_FOCUSED_TOTAL T={ftot[0]} F={ftot[1]} E={ftot[2]} S={ftot[3]}", flush=True)
          assert r_f.returncode == 0 and ftot[1] == 0 and ftot[2] == 0 and ftot[3] == 0

          # 2. Full settings package
          for xp in rep.glob("TEST-*.xml"):
              xp.unlink()
          r_all = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "tests/si.edt.mcp.server.tests",
              "-Dtest=si.edt.mcp.server.settings.*Test", "tycho-surefire:test"
          ], cwd=srv, capture_output=True, text=True)
          atot = [0, 0, 0, 0]
          xmls = sorted(rep.glob("TEST-*.xml"))
          for xp in xmls:
              root = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
              atot[0] += int(root.attrib.get("tests", 0))
              atot[1] += int(root.attrib.get("failures", 0))
              atot[2] += int(root.attrib.get("errors", 0))
              atot[3] += int(root.attrib.get("skipped", 0))
              if int(root.attrib.get("failures", 0)) or int(root.attrib.get("errors", 0)):
                  print("  FAIL_CLASS:", root.attrib.get("name"), flush=True)
          print(f"Z03_SETTINGS_TOTAL xmls={len(xmls)} T={atot[0]} F={atot[1]} E={atot[2]} S={atot[3]} exit={r_all.returncode}", flush=True)
          assert r_all.returncode == 0 and atot[1] == 0 and atot[2] == 0

          # 3. Negative control: remove constructor catch rollback in AToolsTabOnAShell (temporary copy only)
          helper = srv / "tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/settings/AToolsTabOnAShell.java"
          orig = helper.read_text(encoding="utf-8")
          try:
              mut = orig.replace("catch (RuntimeException | Error problem)\n        {\n            close();\n            throw problem;\n        }",
                                 "catch (RuntimeException | Error problem)\n        {\n            throw problem;\n        }")
              assert mut != orig, "mutation marker not found"
              helper.write_text(mut, encoding="utf-8")
              for xp in rep.glob("TEST-*.xml"):
                  xp.unlink()
              r_mut = subprocess.run([
                  "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", "tests/si.edt.mcp.server.tests",
                  "-Dtest=si.edt.mcp.server.settings.RestoringToolDefaultsGivesTheShippedPresetTest",
                  "test-compile", "tycho-surefire:test"
              ], cwd=srv, capture_output=True, text=True)
              mtot = [0, 0, 0, 0]
              for xp in rep.glob("TEST-*.xml"):
                  root = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  mtot[0] += int(root.attrib.get("tests", 0))
                  mtot[1] += int(root.attrib.get("failures", 0))
                  mtot[2] += int(root.attrib.get("errors", 0))
              print(f"Z03_NEG_CTRL_ROLLBACK exit={r_mut.returncode} T={mtot[0]} F={mtot[1]} E={mtot[2]}", flush=True)
              assert r_mut.returncode != 0 and (mtot[1] + mtot[2]) >= 1
          finally:
              helper.write_text(orig, encoding="utf-8")
          print("Z03_PR194_647f322e=VERIFIED_AND_MUTATION_CAUGHT", flush=True)
          PY_INNER
