name: '№11 — аудит зависимостей тестового runner'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Версии, ресурсы и безопасные проверки без чтения секретов
        shell: bash
        env:
          SOURCE_KEY_PRESENT: ${{ secrets.SI_MCP_DEPLOY_KEY != '' }}
        run: |
          set -euo pipefail
          echo "SOURCE_READ_KEY_CONFIGURED=$SOURCE_KEY_PRESENT"
          id
          uname -m
          free -m
          df -h / "$HOME"
          for x in java javac mvn python3 pip3 node npm pwsh ssh xvfb-run xauth curl git flock timeout; do
            printf '%s=' "$x"
            command -v "$x" || true
          done
          if command -v java >/dev/null; then java -version; fi
          if command -v mvn >/dev/null; then mvn -version; fi
          python3 - <<'PY'
          import sys,importlib.util,pathlib,os
          print('PYTHON_VERSION='+sys.version.split()[0])
          for name in ('pip','venv','ensurepip','pytest','jsonschema','yaml'):
              print('PYTHON_MODULE_'+name+'='+str(importlib.util.find_spec(name) is not None))
          print('HOME_WRITABLE='+str(os.access(pathlib.Path.home(),os.W_OK)))
          print('PLATFORM_EXECUTABLE='+str(os.access('/opt/1cv8/x86_64/8.3.27.2342/1cv8',os.X_OK)))
          print('LICENSE_CONTENT_NOT_READ=true')
          PY
          echo 'PROCESS_COUNTS_NAMES_ONLY'
          ps -eo comm= | sort | uniq -c | sort -nr | head -25 || true
          echo 'AUDIT_DONE_NO_INSTALLS=true'
