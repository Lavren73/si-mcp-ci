name: SI-MCP — release R-1 and EDT 2026.2 candidates (11)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: si1c-team-test-stand
  cancel-in-progress: false
jobs:
  validate:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - si1c
    timeout-minutes: 80
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      RUNNER_TOOL_CACHE: /home/runner/si1c-team-tests/toolcache
      AGENT_TOOLSDIRECTORY: /home/runner/si1c-team-tests/toolcache
    steps:
    - name: Create private release validation run; no infobase or GUI
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        BASE="$HOME/si1c-team-tests"
        test -d "$BASE" && test ! -L "$BASE" && test -O "$BASE"
        test "$(cat "$BASE/OWNER.txt")" = 'SI-MCP team test stand; provisioned by agent 11'
        RUN="$BASE/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        test ! -e "$RUN"
        mkdir -m 700 "$RUN"
        mkdir "$RUN/reports" "$RUN/home"
        printf 'TEAM_BASE=%s\nTEAM_RUN=%s\n' "$BASE" "$RUN" >> "$GITHUB_ENV"
        test "$(df -Pk "$BASE" | awk 'NR==2 {print $4}')" -gt 20971520
    - name: Prepare setup-python in isolated team toolcache
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare setup-node in isolated team toolcache
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Prepare setup-java in isolated team toolcache
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Use existing private SSH client; no system installation
      shell: bash
      run: |
        set -euo pipefail
        if command -v ssh >/dev/null; then exit 0; fi
        SSH_DIR="$TEAM_BASE/tools/openssh/usr/bin"
        test -x "$SSH_DIR/ssh"
        "$SSH_DIR/ssh" -V
        echo "$SSH_DIR" >> "$GITHUB_PATH"
    - name: Checkout exact r1 candidate without retained credentials
      uses: actions/checkout@v4
      with:
        repository: Lavren73/SI-MCP
        ref: bd8ea875023cf313b253e085a440abb055a3ce07
        ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        persist-credentials: false
        fetch-depth: 0
        path: release-r1-${{ github.run_id }}
    - name: Checkout exact target candidate without retained credentials
      uses: actions/checkout@v4
      with:
        repository: Lavren73/SI-MCP
        ref: 61c97cb99f8c08478b50bc28a4da34818987d721
        ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        persist-credentials: false
        fetch-depth: 0
        path: release-target-${{ github.run_id }}
    - name: Sequential R-1 controls, full client suite and active 2026.2 verify under shared lock
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        exec 9>"$TEAM_BASE/locks/live-tests.lock"
        flock -w 600 9
        export HOME="$TEAM_RUN/home"
        export XDG_CONFIG_HOME="$HOME/.config" XDG_CACHE_HOME="$HOME/.cache" XDG_DATA_HOME="$HOME/.local/share"
        export PATH="$TEAM_BASE/tools/python-tests/bin:$TEAM_BASE/tools/apache-maven-3.9.9/bin:$TEAM_BASE/tools/powershell-7.4.13:$PATH"
        export NODE_PATH="$TEAM_BASE/tools/node-tests/node_modules"
        export PYTHONDONTWRITEBYTECODE=1
        python - <<'PY'
        import os,pathlib,json
        busy=[]
        for p in pathlib.Path('/proc').iterdir():
            if not p.name.isdecimal():continue
            try:
                name=(p/'comm').read_text().strip()
                if name in ('java','javaw','1cedt','1cedtcli','1cv8','1cv8c','rphost','ragent','rmngr','ras'):busy.append({'pid':int(p.name),'name':name})
            except OSError:pass
        mem={x.split(':')[0]:int(x.split()[1])*1024 for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith(('MemTotal:','MemAvailable:'))}
        out={'kernel':os.uname().release,'memory':mem,'visible_sessions':busy,'scope':'Runner container PID namespace only; not all host sessions','loadavg':pathlib.Path('/proc/loadavg').read_text().strip()}
        pathlib.Path(os.environ['TEAM_RUN'],'reports','preflight.json').write_text(json.dumps(out,indent=2));print(json.dumps(out))
        if busy:raise SystemExit('Other visible sessions: refuse without kill')
        if out['kernel']!='5.15.0-203-generic':raise SystemExit('Diagnostic kernel changed; do not continue blindly')
        if mem.get('MemAvailable',0)<6*1024**3:raise SystemExit('Insufficient available memory')
        for root,cur,lim in [('/sys/fs/cgroup','memory.current','memory.max'),('/sys/fs/cgroup/memory','memory.usage_in_bytes','memory.limit_in_bytes')]:
            c=pathlib.Path(root)/cur;l=pathlib.Path(root)/lim
            if c.exists() and l.exists():
                v=l.read_text().strip()
                if v!='max' and int(v)-int(c.read_text())<5*1024**3:raise SystemExit('Insufficient cgroup memory headroom')
                break
        PY
        for pair in 'r1 bd8ea875023cf313b253e085a440abb055a3ce07' 'target 61c97cb99f8c08478b50bc28a4da34818987d721'; do
          read -r LABEL SHA <<< "$pair"
          CHECKOUT="$GITHUB_WORKSPACE/release-$LABEL-$GITHUB_RUN_ID"
          test "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$SHA"
          git clone --no-hardlinks "$CHECKOUT" "$TEAM_RUN/$LABEL"
          git -C "$TEAM_RUN/$LABEL" remote set-url origin https://github.com/Lavren73/SI-MCP.git
          test "$(git -C "$TEAM_RUN/$LABEL" rev-parse HEAD)" = "$SHA"
          printf '%s\n' "$SHA" > "$TEAM_RUN/reports/$LABEL-sha.txt"
        done
        git -C "$TEAM_RUN/r1" worktree add --detach "$TEAM_RUN/baseline" d45db3b99ab10e7022beeabdbb024527cb79ec0a
        # Clone baseline tests separately: new regression cases run against unmodified baseline code.
        cp "$TEAM_RUN/r1/client/tests/test_rollback_snapshot_cut.py" "$TEAM_RUN/baseline/client/tests/test_rollback_snapshot_cut.py"
        java -version > "$TEAM_RUN/reports/java-version.log" 2>&1
        python --version > "$TEAM_RUN/reports/python-version.log"
        export MAVEN_OPTS="-Xmx3g -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8 -Duser.home=$HOME"
        export JAVA_TOOL_OPTIONS="-XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8"
        # Single-command execution with bounded duration and visible heartbeat. No concurrent test jobs.
        run_logged() {
          local LABEL="$1" LIMIT="$2"; shift 2
          set +e
          nice -n 10 ionice -c2 -n7 timeout --signal=TERM --kill-after=30s "$LIMIT" "$@" > "$TEAM_RUN/reports/$LABEL.log" 2>&1 &
          local PID=$!
          while kill -0 "$PID" 2>/dev/null; do
            printf '[%s] %s running; ' "$(date -u +%T)" "$LABEL"
            awk '/MemAvailable:/ {printf "MemAvailable=%s KiB; ",$2}' /proc/meminfo
            tail -1 "$TEAM_RUN/reports/$LABEL.log"
            sleep 15
          done
          wait "$PID"; local CODE=$?
          set -e
          printf '%s\n' "$CODE" > "$TEAM_RUN/reports/$LABEL.exit"
          echo "RESULT $LABEL exit=$CODE"
          tail -30 "$TEAM_RUN/reports/$LABEL.log"
        }
        cd "$TEAM_RUN/baseline"
        run_logged r1-baseline-independent 120s python tools/проверка-Р-1-№16.py client
        cd "$TEAM_RUN/baseline/client"
        run_logged r1-baseline-regressions 180s python -m pytest -q tests/test_rollback_snapshot_cut.py --junitxml="$TEAM_RUN/reports/r1-baseline-regressions.xml"
        cd "$TEAM_RUN/r1"
        run_logged r1-independent 120s python tools/проверка-Р-1-№16.py client
        cd "$TEAM_RUN/r1/client"
        run_logged r1-focused 240s python -m pytest -q tests/test_rollback.py tests/test_rollback_snapshot_cut.py tests/test_diagnostics_failclosed.py --junitxml="$TEAM_RUN/reports/r1-focused.xml"
        run_logged client-full 1200s python прогнать-тесты.py
        cd "$TEAM_RUN/target/server"
        # Capture inherited resolver requirements without running tests with altered settings.
        run_logged effective-pom 300s mvn -B -ntp -Pedt-2026.2 -Dmaven.repo.local="$TEAM_BASE/cache/m2" -f bom/pom.xml help:effective-pom -Doutput="$TEAM_RUN/effective-pom.xml"
        run_logged target2026-verify 2400s xvfb-run -a mvn -B -fae -ntp -Pedt-2026.2 -Dstyle.color=never -Dmaven.repo.local="$TEAM_BASE/cache/m2" verify
        python - <<'PY'
        import os,pathlib,json,xml.etree.ElementTree as ET,zipfile,struct,collections,re
        run=pathlib.Path(os.environ['TEAM_RUN']);report=run/'reports';src=run/'target'
        xmls=list(src.glob('server/**/surefire-reports/TEST-*.xml'))
        total={k:0 for k in ('tests','failures','errors','skipped')};failed=[]
        for p in xmls:
            root=ET.parse(p).getroot()
            for k in total:total[k]+=int(root.get(k,'0'))
            for case in root.findall('.//testcase'):
                if case.find('failure') is not None or case.find('error') is not None:failed.append(case.get('classname','')+'#'+case.get('name',''))
        classes=[]
        for module in ('si.edt.mcp.server','si.edt.mcp.oform'):
            for p in (src/'server/bundles'/module/'target').glob('*.jar'):
                if p.name.endswith(('-sources.jar','-javadoc.jar')):continue
                majors=collections.Counter()
                with zipfile.ZipFile(p) as z:
                    for n in z.namelist():
                        if n.endswith('.class'):
                            b=z.read(n)
                            if b[:4]==b'\xca\xfe\xba\xbe':majors[struct.unpack('>H',b[6:8])[0]]+=1
                    manifest=z.read('META-INF/MANIFEST.MF').decode(errors='replace')
                classes.append({'jar':p.name,'module':module,'class_major_counts':dict(majors),'all_class_major_61':bool(majors) and set(majors)=={61},'manifest_java_lines':[x for x in manifest.splitlines() if any(k in x for k in ('Build-Jdk','Bundle-RequiredExecutionEnvironment','Require-Capability','osgi.ee'))]})
        pom=run/'effective-pom.xml';required={}
        if pom.exists():
            root=ET.parse(pom).getroot();ns={'m':'http://maven.apache.org/POM/4.0.0'}
            for p in root.findall('./m:build/m:plugins/m:plugin',ns):
                if p.findtext('m:artifactId',namespaces=ns)=='target-platform-configuration':
                    c=p.find('m:configuration',ns)
                    required={'executionEnvironment':c.findtext('m:executionEnvironment',namespaces=ns),'extraRequirements':[x.findtext('m:id',namespaces=ns) for x in c.findall('m:dependency-resolution/m:extraRequirements/m:requirement',ns)]}
        exits={p.stem:int(p.read_text()) for p in report.glob('*.exit')}
        summary={'source_r1':'bd8ea875023cf313b253e085a440abb055a3ce07','source_target':'61c97cb99f8c08478b50bc28a4da34818987d721','base':'d45db3b99ab10e7022beeabdbb024527cb79ec0a','exits':exits,'maven_reports':len(xmls),'maven':total,'failed_tests':failed,'plugin_bytecode':classes,'effective_resolver':required,'kernel':os.uname().release,'limitations':['No infobase or GUI smoke in this job','Linux-only, not Windows runtime','Candidate SHAs are not one merged release SHA','Short test is not proof of host kernel stability']}
        expected_negative=exits.get('r1-baseline-independent')==1 and exits.get('r1-baseline-regressions')==1
        required_positive=['r1-independent','r1-focused','client-full','effective-pom','target2026-verify']
        passed=expected_negative and all(exits.get(k)==0 for k in required_positive) and total['tests']>0 and total['failures']==0 and total['errors']==0 and len(classes)>=2 and all(c['all_class_major_61'] for c in classes) and required.get('executionEnvironment')=='JavaSE-25' and {'org.apache.felix.scr','org.apache.aries.spifly.dynamic.bundle','org.eclipse.swt.svg'}.issubset(set(required.get('extraRequirements',[])))
        summary['negative_controls_expected_failure']=expected_negative;summary['outcome']='success' if passed else 'failure'
        # Only explicit report files; no workspace/prefs/license/keyring. Scrub common incidental secret assignments.
        for p in report.glob('*.log'):
            text=p.read_text(errors='replace')
            text=re.sub(r'(?i)(password|pwd|token|secret)(\s*[=:]\s*)[^\s;]+',r'\1\2<redacted>',text)
            p.write_text(text)
        (report/'release-validation-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary,ensure_ascii=False))
        raise SystemExit(0 if passed else 1)
        PY
      id: validate
    - name: Upload allowlisted sanitized validation reports
      if: always() && env.TEAM_RUN != ''
      uses: actions/upload-artifact@v4
      with:
        name: release-validation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.TEAM_RUN }}/reports/
        retention-days: 7
