# №16: проверка учебной платформы только на disposable GitHub runner.
# Это не проверка совместимости с EDT 2026.2.2; никакие реальные ИБ не используются.
name: №16 — учебная 1С 8.3.27.1508
on:
  push:
    branches: [agent/16-training-1c-1508-probe]
permissions:
  contents: read
jobs:
  training:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Проверить защищённый источник учебной 1С
        env:
          FILE_ID: ${{ secrets.SI_1C_TRAINING_FILE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FILE_ID" ]; then echo '::error::Нет Actions secret SI_1C_TRAINING_FILE_ID'; exit 1; fi
      - name: Подготовить изолированный runner
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 libwebkit2gtk-4.0-37 libglu1-mesa unzip > /dev/null
          mkdir -p "$RUNNER_TEMP/si16-training/dist"
      - name: Скачать и проверить учебную платформу
        env:
          FILE_ID: ${{ secrets.SI_1C_TRAINING_FILE_ID }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 1200 \
            "https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t" \
            -o "$RUNNER_TEMP/si16-training/training.tar.gz"
          printf '%s  %s\n' '71400098eff51a39736fe8ec6077c9818cfbb682548346ccb1d58364e3b9b403' "$RUNNER_TEMP/si16-training/training.tar.gz" | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'si16-training'
          with tarfile.open(root/'training.tar.gz','r:gz') as t:
              members=t.getmembers()
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not (m.isfile() or m.isdir()):
                      raise SystemExit('Unsafe archive member')
              if sum(m.size for m in members)>5_000_000_000:
                  raise SystemExit('Archive expansion exceeds bound')
              t.extractall(root/'dist',members=members)
          PY
      - name: Установить учебную платформу 8.3.27.1508
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/si16-training/dist"
          SETUP=$(find "$DIST" -type f -name 'setup-training-8.3.27.1508-x86_64.run' -print -quit)
          test -n "$SETUP"
          chmod +x "$SETUP"
          sudo "$SETUP" --mode unattended --unattendedmodeui none --installer-language en --enable-components client_full,ws,ru --prefix /opt/si16-training
          BIN=$(sudo find /opt/si16-training -type f -name 1cv8t -print -quit)
          test -n "$BIN" && test -x "$BIN"
          echo "TRAINING_BIN=$BIN" >> "$GITHUB_ENV"
          echo 'Учебная платформа 8.3.27.1508 установлена в disposable runner.'
      - name: Учесть ограничение библиотеки учебной платформы на Ubuntu 22.04
        run: |
          set -euo pipefail
          # В прежнем изолированном прогоне №13 библиотека комплекта мешала запуску.
          # Меняем только файлы этой установки на одноразовом runner, не системные библиотеки.
          while IFS= read -r -d '' f; do sudo mv "$f" "$f.si16-disabled"; done < <(find /opt/si16-training -type f -name 'libstdc++.so.6*' -print0)
          echo 'Missing libraries, if any:'
          ldd "$TRAINING_BIN" | grep 'not found' || true
      - name: Создать пустую тестовую ИБ
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/si16-training/empty-ib"
          mkdir -p "$BASE"
          timeout -s KILL 180s xvfb-run -a "$TRAINING_BIN" CREATEINFOBASE "File=$BASE" > "$RUNNER_TEMP/si16-training/create.log" 2>&1 || { cat "$RUNNER_TEMP/si16-training/create.log"; exit 1; }
          cat "$RUNNER_TEMP/si16-training/create.log"
          test -s "$BASE/1Cv8.1CD"
          stat -c 'Empty database bytes: %s' "$BASE/1Cv8.1CD"
      - name: Проверить конфигуратор учебной платформы
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/si16-training/empty-ib"
          LOG="$RUNNER_TEMP/si16-training/designer.log"
          OUT="$RUNNER_TEMP/si16-training/empty.cf"
          set +e
          timeout -s KILL 150s xvfb-run -a "$TRAINING_BIN" DESIGNER "/F$BASE" /DumpCfg "$OUT" /DisableStartupDialogs /Out "$LOG"
          code=$?
          set -e
          echo "DESIGNER exit: $code"
          if [ -f "$LOG" ]; then cat "$LOG"; fi
          test "$code" -eq 0 && test -s "$OUT"
          echo 'Отдельный конфигуратор учебной платформы работает с пустой ИБ.'
          echo 'EDT 2026.2.2 не проверена вместе с этой учебной платформой; 8.3.27.1508 ниже указанного 1С минимума 8.3.27.2202.'
