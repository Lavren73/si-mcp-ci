# №16: проверка данного владельцем архива в отдельном disposable runner.
# Архив 1С не записывается в git, артефакты Actions или общий workspace.
name: №16 — архив владельца и наличие настоящей EDT
on:
  push:
    branches: [agent/16-edt-archive-audit-20261109]
permissions:
  contents: read
jobs:
  inspect-edt:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          java-package: jdk+fx
      - name: Скачать и проверить хеш архива
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, urllib.request
          # Берём идентификатор из ранее запущенного публичного workflow №13 на
          # зафиксированном SHA, не копируя ссылку в новый workflow или логи.
          src = ('https://raw.githubusercontent.com/Lavren73/si-mcp-ci/'
                 'c62504882b39f40ac0b10cb86760b451bdfb70a2/'
                 '.github/workflows/edt-ustanovka.yml')
          text = urllib.request.urlopen(src, timeout=30).read().decode('utf-8')
          ids = re.findall(r'^\s+EDT_ID:\s*([A-Za-z0-9_-]+)\s*$', text, re.M)
          if len(ids) != 1: raise SystemExit('EDT archive reference unavailable')
          url = 'https://drive.usercontent.google.com/download?id=' + ids[0] + '&export=download&confirm=t'
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'owner-edt-archive.tar.gz'
          h = hashlib.sha256(); size = 0
          with urllib.request.urlopen(url, timeout=120) as r, target.open('wb') as out:
              while True:
                  part = r.read(1024 * 1024)
                  if not part: break
                  size += len(part)
                  if size > 300_000_000: raise SystemExit('archive unexpectedly large')
                  h.update(part); out.write(part)
          print('Archive bytes:', size, 'SHA-256:', h.hexdigest())
          if size != 90334407 or h.hexdigest() != '47c3efdb545ffcc40b2ce94124a0f69484fa9328f0c20f299658f952df457bb9':
              raise SystemExit('Archive does not match owner-provided file')
          PY
      - name: Проверить состав и изолированно распаковать
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, tarfile, zipfile, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'edt-input'; root.mkdir()
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'owner-edt-archive.tar.gz'
          with tarfile.open(archive, 'r:gz') as t:
              members = t.getmembers()
              for m in members:
                  p = pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or not (m.isfile() or m.isdir()):
                      raise SystemExit('Unsafe archive member')
              if sum(m.size for m in members) > 300_000_000: raise SystemExit('archive exceeds extraction bound')
              t.extractall(root, members=members)
          products = list(root.glob('*.e1c.par'))
          if len(products) != 1: raise SystemExit('Expected exactly one product manifest')
          with zipfile.ZipFile(products[0]) as z:
              x = ET.fromstring(z.read('product-manifest.xml'))
          ns = {'p':'http://1c.ru/installer/product-manifest'}
          print('Product:', x.findtext('p:id', namespaces=ns), 'version:', x.findtext('p:version', namespaces=ns))
          print('Components:', ', '.join(c.get('id') for c in x.findall('p:components/p:component', ns)))
          print('Files in input:', len(members))
          PY
      - name: Установить компоненты архива в disposable runner
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/edt-input"
          test -x ./1ce-installer-cli
          sudo ./1ce-installer-cli install all --products-home "$RUNNER_TEMP/edt-installed" --ignore-hardware-checks 2>&1 | tail -30
          sudo ./1ce-installer-cli query installed 2>&1 | tail -25
      - name: Зависимости графической проверки EDT Start
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils xdotool scrot tesseract-ocr tesseract-ocr-rus libgtk-3-0 libwebkit2gtk-4.0-37 libglu1-mesa > /dev/null
      - name: Запустить Start и исследовать возможность онлайн-установки
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/edt-installed"
          START=$(sudo find "$BASE" -type f -name '1cedtstart' -print -quit)
          test -n "$START" && test -x "$START"
          mkdir -p "$RUNNER_TEMP/edt-user" "$RUNNER_TEMP/edt-ui"
          export HOME="$RUNNER_TEMP/edt-user" DISPLAY=:98
          Xvfb :98 -screen 0 1440x900x24 > "$RUNNER_TEMP/edt-ui/xvfb.log" 2>&1 & xpid=$!
          trap 'if [ -n "${epid:-}" ]; then kill "$epid" 2>/dev/null || true; fi; kill "$xpid" 2>/dev/null || true' EXIT
          sleep 3
          "$START" -vm "$JAVA_HOME/bin/java" -nosplash > "$RUNNER_TEMP/edt-ui/start.log" 2>&1 & epid=$!
          sleep 30
          echo '=== Видимые окна ==='
          xwininfo -root -tree | tail -45 || true
          echo '=== Снимок экрана и текст ==='
          scrot "$RUNNER_TEMP/edt-ui/screen.png" || true
          if test -s "$RUNNER_TEMP/edt-ui/screen.png"; then
            tesseract "$RUNNER_TEMP/edt-ui/screen.png" stdout -l rus+eng 2>/dev/null || true
          fi
          echo '=== Вывод стартера ==='
          tail -100 "$RUNNER_TEMP/edt-ui/start.log" || true
          if kill -0 "$epid" 2>/dev/null; then echo 'Start process: running'; else echo 'Start process: stopped'; fi
          echo 'Диагностика без автоподтверждения лицензий и без ввода учётных данных.'
      - name: Проверить настоящую EDT, а не только EDT Start
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/edt-installed"
          mapfile -t binaries < <(sudo find "$BASE" -type f \( -name '1cedt' -o -name '1cedtcli' \) -print 2>/dev/null)
          printf 'Real EDT binaries found: %s\n' "${#binaries[@]}"
          if [ "${#binaries[@]}" -eq 0 ]; then
            echo '::error::В предоставленном комплекте установлена EDT Start; настоящая EDT не найдена. Проверка плагина невозможна.'
            exit 1
          fi
          printf '%s\n' "${binaries[@]}"
          echo 'Binary presence alone does not prove SI-MCP plugin or workbench works.'
      - name: Сохранить снимок изолированного окна Start
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edt-start-ui-diagnostic
          path: ${{ runner.temp }}/edt-ui/screen.png
          if-no-files-found: ignore
          retention-days: 3
