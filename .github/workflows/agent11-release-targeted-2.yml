    - name: Checkout pinned pr175 without retained credentials
      uses: actions/checkout@v4
      with:
        repository: Lavren73/SI-MCP
        ref: f043239424ff2b91351c9eb280a0595a95674110
        ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        persist-credentials: false
