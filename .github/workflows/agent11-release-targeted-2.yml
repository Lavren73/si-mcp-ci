                    subprocess.run(['git','-C',str(fresh),'remote','set-url','origin','https://github.com/Lavren73/SI-MCP.git'],check=True)
                    MANIFEST[label]=MANIFEST['pr169']
                    assert subprocess.check_output(['git','-C',str(fresh),'rev-parse','HEAD'],text=True).strip()==MANIFEST['pr169']
                    package=fresh/'server/tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/settings'
                    java=('package si.edt.mcp.server.settings;\n'
                          'import org.junit.runner.RunWith;\nimport org.junit.runner.Runner;\n'
                          'import org.junit.runner.notification.RunNotifier;\nimport org.junit.runners.Suite;\n'
                          'import org.junit.runners.model.InitializationError;\n'
                          '@RunWith('+suite+'.Ordered.class)\npublic class '+suite+' {\n'
                          ' public static class Ordered extends Suite {\n'
                          '  public Ordered(Class<?> klass) throws InitializationError { super(klass, new Class<?>[]{'+','.join(x+'.class' for x in order)+'}); }\n'
                          '  @Override protected void runChild(Runner runner, RunNotifier notifier) {\n'
                          '   System.out.println("AGENT11_EXECUTING_CLASS="+runner.getDescription().getClassName());\n'
                          '   super.runChild(runner, notifier);\n  }\n }\n}\n')
                    f=package/(suite+'.java');assert not f.exists();f.write_text(java);(REPORT/(suite+'.java')).write_text(java)
                    name='pr169-ui-order-'+('AB' if order[0]==A else 'BA')
                    mvn(label,name,[suite],limit=1200,evidence_tests=order)
                    log=(REPORT/(name+'.log')).read_text(errors='replace')
                    actual=[x.rsplit('.',1)[-1] for x in re.findall(r'AGENT11_EXECUTING_CLASS=([A-Za-z0-9_.$]+)',log)]
                    evidence(name+'-observed-order',actual==order,actual=actual,expected=order,scope='generated test-only suite; not an unmodified candidate')
                try:
                    ab=json.loads((REPORT/'pr169-ui-order-AB-xml-summary.json').read_text());ba=json.loads((REPORT/'pr169-ui-order-BA-xml-summary.json').read_text())
                    RESULTS.append({'name':'pr169-ui-two-order-comparison','status':'OBSERVATION','same_failed_case_set':set(ab['failed_tests'])==set(ba['failed_tests']),'AB_failures':ab['failed_tests'],'BA_failures':ba['failed_tests'],'scope':'only two selected classes; generated JUnit suites; not a general isolation PASS'});store()
                except Exception as exc:evidence('pr169-ui-two-order-comparison',False,reason=type(exc).__name__)
            mvn('pr153','pr153-redaction-osgi',['InfobaseParametersRedaction16Test','RegisteredInfobasesReaderTest'],limit=1800)
            mvn('pr156','pr156-binding-osgi',['RegisteredInfobasesReaderTest'],limit=1800)
        else:raise SystemExit('Unknown phase')
        store();print('PHASE_FINISHED',PHASE,collections.Counter(x['status'] for x in RESULTS),flush=True)
        raise SystemExit(1 if any(x['status']=='FAIL' for x in RESULTS) else 0)

        PYDRIVER
      continue-on-error: true
      id: ui
    - name: Sanitize allowlisted ui reports before upload
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import pathlib,os,re,json
        root=pathlib.Path(os.environ['TEAM_RUN'])/'reports';hits=[]
        for p in root.rglob('*'):
            if not p.is_file() or p.is_symlink():continue
            text=p.read_text(errors='replace');original=text
            text=re.sub(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----.*?-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----','<redacted-private-key>',text,flags=re.S)
            text=re.sub(r'\bgh[pousr]_[A-Za-z0-9]{20,}|\bgithub_pat_[A-Za-z0-9_]{30,}','<redacted-token>',text)
            text=re.sub(r'(?i)(Authorization:\s*Bearer\s+)[A-Za-z0-9._-]{20,}',r'\1<redacted>',text)
            if text!=original:p.write_text(text);hits.append(p.name)
        (root/'artifact-sanitization.json').write_text(json.dumps({'heuristic_not_full_audit':True,'files_redacted':hits},indent=2));print('REDACTED_FILES',len(hits))
        PY
      if: always() && env.TEAM_RUN != ''
    - name: Upload allowlisted ui reports only
      if: always() && env.TEAM_RUN != ''
      uses: actions/upload-artifact@v4
      with:
        name: targeted11-ui-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.TEAM_RUN }}/reports/
        retention-days: 7
    - name: Final honest targeted summary
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,json,collections
        r=pathlib.Path(os.environ['TEAM_RUN'])/'reports';rows=[];missing=[]
        for phase in ('fast','ui'):
            p=r/(phase+'-results.json')
            if p.exists():rows+=json.loads(p.read_text())['results']
            else:missing.append(phase)
        counts=dict(collections.Counter(x['status'] for x in rows))
        summary={'counts':counts,'missing_phases':missing,'results':rows,'integration_SHA':None,'release_ready':False,'note':'Rows are commands/evidence, not test counts; synthetic overlays are not integration commits.'}
        (r/'targeted11-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary,ensure_ascii=False))
        pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('# Exact candidates: targeted runner checks\n\n'+str(counts)+'\n\nNo integration SHA or release claim.\n')
        raise SystemExit(1 if missing or counts.get('FAIL',0) else 0)
        PY
      if: always() && env.TEAM_RUN != ''
    - name: Upload final targeted summary
      if: always() && env.TEAM_RUN != ''
      uses: actions/upload-artifact@v4
      with:
        name: targeted11-summary-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.TEAM_RUN }}/reports/targeted11-summary.json
        retention-days: 7
