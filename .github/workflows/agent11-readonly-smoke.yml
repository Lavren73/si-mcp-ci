name: SI-MCP — GUI and authenticated read-only MCP smoke (11)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: si1c-team-test-stand
  cancel-in-progress: false
jobs:
  smoke:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - si1c
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
    - name: Check manual sessions, hold team lock, launch only isolated EDT and read-only MCP
      shell: bash
      run: "set -euo pipefail\numask 077\nBASE=\"$HOME/si1c-team-tests\"\ntest -d \"$BASE\" && test ! -L \"$BASE\" && test\
        \ -O \"$BASE\"\ntest \"$(cat \"$BASE/OWNER.txt\")\" = 'SI-MCP team test stand; provisioned by agent 11'\nexec 9>\"\
        $BASE/locks/live-tests.lock\"\necho 'Waiting for exclusive team live lock; never cancelling others.'\nflock -w 600\
        \ 9\nRUN=\"$BASE/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT\"\ntest ! -e \"$RUN\"\nmkdir -m 700 \"$RUN\"\nmkdir \"$RUN/reports\"\
        \ \"$RUN/home\" \"$RUN/workspace\"\necho \"SMOKE_RUN=$RUN\" >> \"$GITHUB_ENV\"\nexport SMOKE_RUN=\"$RUN\"\npython3\
        \ - <<'PY'\n\"\"\"Runner-only read-only GUI/MCP smoke. No infobase or mutating tool calls.\"\"\"\nimport os,pathlib,json,time,secrets,subprocess,signal,socket,re,hashlib,urllib.request,urllib.error,sys,ipaddress\n\
        BASE=pathlib.Path('/home/runner/si1c-team-tests')\nPREPARED=BASE/'runs/43070810460-1'\nRUN=pathlib.Path(os.environ['SMOKE_RUN'])\n\
        WS=RUN/'workspace';HOME=RUN/'home';REPORTS=RUN/'reports'\nSUMMARY={'source':'b029b9e0566310aea3b02242bb23a568b71771f1','build_target':'2026.1','runtime_expected':'2026.2.2.21','scope':'Empty\
        \ private workspace; no infobase opened, no mutating tool or model call','checks':{},'outcome':'failure'}\nTOKEN=secrets.token_urlsafe(40);SID=None;PROC=None;LOG=None\n\
        CHECKS=SUMMARY['checks'];ERROR=None\n\ndef check(name,condition,detail=None):\n    CHECKS[name]={'passed':bool(condition)}\n\
        \    if detail is not None:CHECKS[name]['detail']=detail\n    print('CHECK '+name+'='+('PASS' if condition else 'FAIL'),flush=True)\n\
        \    if not condition:raise RuntimeError(name)\n\ndef safe_path(p,parent):\n    check('safe_path_'+p.name,p.is_dir()\
        \ and not p.is_symlink() and p.resolve().is_relative_to(parent.resolve()))\n\ndef other_sessions():\n    busy=[]\n\
        \    for p in pathlib.Path('/proc').iterdir():\n        if not p.name.isdecimal():continue\n        try:\n       \
        \     name=(p/'comm').read_text().strip()\n            if name in ('java','javaw','1cedt','1cedtcli','1cv8','1cv8c','rphost','ragent','rmngr','ras'):\n\
        \                busy.append({'pid':int(p.name),'name':name})\n        except (OSError,ValueError):pass\n    return\
        \ busy\n\ndef listeners(port):\n    out=[]\n    for filename in ('/proc/net/tcp','/proc/net/tcp6'):\n        for line\
        \ in pathlib.Path(filename).read_text().splitlines()[1:]:\n            a=line.split()\n            if len(a)<10 or\
        \ a[3]!='0A':continue\n            ip,p=a[1].split(':')\n            if int(p,16)==port:\n                raw=bytes.fromhex(ip)\n\
        \                packed=raw[::-1] if filename.endswith('/tcp') else b''.join(raw[i:i+4][::-1] for i in range(0,16,4))\n\
        \                address=ipaddress.ip_address(packed)\n                address=getattr(address,'ipv4_mapped',None)\
        \ or address\n                out.append((str(address),a[9]))\n    return out\n\ndef owned_socket_inodes():\n    owned=set()\n\
        \    if PROC is None:return owned\n    for p in pathlib.Path('/proc').iterdir():\n        if not p.name.isdecimal():continue\n\
        \        try:\n            if os.getpgid(int(p.name))!=PROC.pid:continue\n            for f in (p/'fd').iterdir():\n\
        \                try:\n                    target=os.readlink(f)\n                    m=re.fullmatch(r'socket:\\[(\\\
        d+)\\]',target)\n                    if m:owned.add(m.group(1))\n                except OSError:pass\n        except\
        \ (OSError,ValueError):pass\n    return owned\n\ndef own_workspace_processes():\n    found=[]\n    for p in pathlib.Path('/proc').iterdir():\n\
        \        if not p.name.isdecimal():continue\n        try:\n            if p.stat().st_uid!=os.getuid():continue\n\
        \            name=(p/'comm').read_text().strip()\n            if name not in ('java','javaw','1cedt','1cedtcli'):continue\n\
        \            args=(p/'cmdline').read_bytes().split(b'\\0')\n            if str(WS).encode() not in args:continue\n\
        \            if not any(x.startswith(str(PREPARED/'edt').encode()+b'/') for x in args):continue\n            start=(p/'stat').read_text().rsplit(')',1)[1].split()[19]\n\
        \            found.append((int(p.name),start))\n        except (OSError,ValueError,IndexError):pass\n    return found\n\
        \ndef stop_exact_own_processes():\n    targets=own_workspace_processes()\n    SUMMARY['cleanup_exact_own_processes_found']=len(targets)\n\
        \    for sig,wait in ((signal.SIGTERM,15),(signal.SIGKILL,5)):\n        for pid,start in targets:\n            if\
        \ (pid,start) in own_workspace_processes():\n                try:os.kill(pid,sig)\n                except ProcessLookupError:pass\n\
        \        deadline=time.monotonic()+wait\n        while time.monotonic()<deadline and own_workspace_processes():time.sleep(.5)\n\
        \        if not own_workspace_processes():break\n    SUMMARY['cleanup_remaining_exact_own_processes']=len(own_workspace_processes())\n\
        \ndef http(path,payload=None,auth=None,sid=None,method=None,timeout=45):\n    h={'Accept':'application/json, text/event-stream','User-Agent':'SI-MCP-Agent11-ReadOnly-Smoke'}\n\
        \    if payload is not None:h['Content-Type']='application/json'\n    if auth:h['Authorization']='Bearer '+auth\n\
        \    if sid:h['Mcp-Session-Id']=sid\n    req=urllib.request.Request('http://127.0.0.1:'+str(PORT)+path,data=None if\
        \ payload is None else json.dumps(payload).encode(),headers=h,method=method)\n    try:\n        with urllib.request.urlopen(req,timeout=timeout)\
        \ as r:return r.status,r.headers,r.read(8000000).decode('utf-8','replace')\n    except urllib.error.HTTPError as e:return\
        \ e.code,e.headers,e.read(8000000).decode('utf-8','replace')\n\ndef rpc_parse(body,ident):\n    if body.lstrip().startswith('{'):values=[json.loads(body)]\n\
        \    else:\n        values=[]\n        for block in re.split(r'\\r?\\n\\r?\\n',body):\n            data='\\n'.join(x[5:].lstrip()\
        \ for x in block.splitlines() if x.startswith('data:'))\n            if data and data!='[DONE]':values.append(json.loads(data))\n\
        \    matches=[x for x in values if isinstance(x,dict) and x.get('id')==ident]\n    if len(matches)!=1:raise RuntimeError('RPC\
        \ identity missing or duplicated')\n    x=matches[0]\n    if x.get('jsonrpc')!='2.0' or 'error' in x or not isinstance(x.get('result'),dict):raise\
        \ RuntimeError('RPC error or invalid result')\n    return x['result']\n\ndef call(ident,method,params):\n    code,headers,body=http('/mcp',{'jsonrpc':'2.0','id':ident,'method':method,'params':params},TOKEN,SID)\n\
        \    check(method.replace('/','_')+'_http_'+str(ident),code==200,{'http_status':code})\n    return rpc_parse(body,ident)\n\
        \ntry:\n    SUMMARY['kernel']=os.uname().release\n    check('diagnostic_kernel_5_15',SUMMARY['kernel']=='5.15.0-203-generic')\n\
        \    mem={x.split(':')[0]:int(x.split()[1])*1024 for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if\
        \ x.startswith(('MemTotal:','MemAvailable:'))}\n    SUMMARY['memory_before']=mem\n    check('memory_available_at_least_5GiB',mem.get('MemAvailable',0)>=5*1024**3)\n\
        \    for root,current,limit in [('/sys/fs/cgroup','memory.current','memory.max'),('/sys/fs/cgroup/memory','memory.usage_in_bytes','memory.limit_in_bytes')]:\n\
        \        c=pathlib.Path(root)/current;l=pathlib.Path(root)/limit\n        if c.exists() and l.exists():\n        \
        \    v=l.read_text().strip();used=int(c.read_text().strip())\n            SUMMARY['cgroup_memory']={'limit':v,'used':used}\n\
        \            check('cgroup_memory_headroom',v=='max' or int(v)-used>=4*1024**3)\n            break\n    for p,parent\
        \ in [(RUN,BASE/'runs'),(PREPARED,BASE/'runs'),(WS,RUN),(HOME,RUN),(REPORTS,RUN)]:safe_path(p,parent)\n    check('prepared_ready_marker',(PREPARED/'READY-FOR-READONLY-SMOKE').is_file())\n\
        \    sha=subprocess.check_output(['git','-C',str(PREPARED/'source'),'rev-parse','HEAD'],text=True).strip()\n    check('exact_source',sha==SUMMARY['source'])\n\
        \    roots=[p.parent for p in (PREPARED/'edt').rglob('1cedt') if p.is_file()]\n    check('one_prepared_launcher',len(roots)==1)\n\
        \    EDT=roots[0]\n    java=[p for p in (PREPARED/'edt').rglob('java') if p.is_file() and p.parent.name=='bin' and\
        \ os.access(p,os.X_OK)]\n    check('one_embedded_java',len(java)==1)\n    expected={'si.edt.mcp.server_1.0.0.202611111717.jar':'aa9c059a7b0f287f6ca14916bf56a428146c6f46a71c457b86f684a237194de2','si.edt.mcp.oform_1.0.0.202611111717.jar':'aa10906ad88d6f009ee94d2becc07d80db8e5b796019dd109e1caa9660990267'}\n\
        \    for n,digest in expected.items():\n        p=EDT/'plugins'/n\n        check('plugin_hash_'+n,p.is_file() and\
        \ not p.is_symlink() and hashlib.sha256(p.read_bytes()).hexdigest()==digest)\n    busy=other_sessions();SUMMARY['preflight_visible_sessions']=busy\n\
        \    check('no_other_visible_edt_java_1c_sessions',not busy,{'count':len(busy),'scope':'processes visible inside runner\
        \ container only; no host-wide claim'})\n    check('fresh_workspace',not (WS/'.metadata').exists() and not list(WS.iterdir()))\n\
        \    with socket.socket() as s:s.bind(('127.0.0.1',0));PORT=s.getsockname()[1]\n    SUMMARY['loopback_port']=PORT\n\
        \    prefs=WS/'.metadata/.plugins/org.eclipse.core.runtime/.settings/si.edt.mcp.server.prefs';prefs.parent.mkdir(parents=True)\n\
        \    prefs.write_text('eclipse.preferences.version=1\\nmcpServerAutoStart=true\\nmcpServerPort='+str(PORT)+'\\nmcpServerPortSpan=1\\\
        nmcpAuthEnabled=true\\nmcpAuthToken='+TOKEN+'\\nmcpBindAllInterfaces=false\\nmcpAllowNullOrigin=false\\nmcpToolPreset=READ_ONLY\\\
        nmcpToolAccessLevel=readOnly\\nmcpToolsetsGranted=false\\nmcpAgentRightsMode=none\\nmcpNaparnikBridgeEnabled=false\\\
        nmcpNaparnikAllToolsEnabled=false\\nmcpUpkeepEnabled=false\\nmcpHistoryFileEnabled=false\\nmcpHistoryDiskEnabled=false\\\
        nmcpDebugLogEnabled=false\\n',encoding='utf-8')\n    prefs.chmod(0o600)\n    env=os.environ.copy();env.update({'HOME':str(HOME),'XDG_CONFIG_HOME':str(HOME/'.config'),'XDG_CACHE_HOME':str(HOME/'.cache'),'XDG_DATA_HOME':str(HOME/'.local/share')})\n\
        \    LOG=(RUN/'edt-private.log').open('wb')\n    cmd=['nice','-n','10','ionice','-c2','-n7','xvfb-run','-a',str(EDT/'1cedt'),'-vm',str(java[0]),'-nosplash','-data',str(WS),'-consoleLog','--launcher.appendVmargs','-vmargs','-Xmx3g','-Duser.home='+str(HOME),'-Dfile.encoding=UTF-8']\n\
        \    PROC=subprocess.Popen(cmd,stdout=LOG,stderr=subprocess.STDOUT,start_new_session=True,env=env,cwd=str(RUN))\n\
        \    SUMMARY['gui_process_launched']=True\n    deadline=time.monotonic()+300;last=0\n    while time.monotonic()<deadline:\n\
        \        if PROC.poll() is not None:raise RuntimeError('EDT exited before listener readiness')\n        active=listeners(PORT)\n\
        \        if active:\n            check('listener_loopback_only',all(ipaddress.ip_address(ip).is_loopback for ip,inode\
        \ in active),{'listeners':[{'address':ip,'inode':inode} for ip,inode in active]})\n            own=owned_socket_inodes()\n\
        \            check('listener_owned_by_our_process_group',all(inode in own for ip,inode in active))\n            break\n\
        \        if time.monotonic()-last>10:print('Waiting for own EDT/MCP listener...',flush=True);last=time.monotonic()\n\
        \        time.sleep(2)\n    else:raise RuntimeError('MCP listener timeout after 300 seconds')\n    health_deadline=time.monotonic()+90\n\
        \    while True:\n        code,h,body=http('/health',auth=TOKEN)\n        if code!=200:raise RuntimeError('Health\
        \ HTTP status '+str(code))\n        health=json.loads(body)\n        if health.get('blockedByDialog') is True:raise\
        \ RuntimeError('Workbench blocked by dialog; no automatic answering')\n        if health.get('phase')=='ready' and\
        \ health.get('uiResponding') is True:break\n        if time.monotonic()>=health_deadline:raise RuntimeError('Workbench\
        \ readiness was not confirmed')\n        print('Waiting for health phase=ready and uiResponding=true...',flush=True);time.sleep(3)\n\
        \    check('health_http',code==200,{'http_status':code})\n    SUMMARY['health']={k:health.get(k) for k in ('status','edt_version','phase','uiResponding','blockedByDialog','ordinaryFormsRegistered')}\n\
        \    check('health_status',health.get('status')=='ok')\n    check('workbench_ready',health.get('phase')=='ready' and\
        \ health.get('uiResponding') is True)\n    check('health_runtime_version',health.get('edt_version')=='2026.2.2.21')\n\
        \    check('empty_health_projects',health.get('projects')==[])\n    if health.get('blockedByDialog') is True:raise\
        \ RuntimeError('Workbench blocked by dialog; no automatic answer/restart')\n    init={'jsonrpc':'2.0','id':1,'method':'initialize','params':{'protocolVersion':'2025-11-25','capabilities':{},'clientInfo':{'name':'agent11-readonly-smoke','version':'1'}}}\n\
        \    code,_,_=http('/mcp',init)\n    check('unauthenticated_401',code==401,{'http_status':code})\n    code,_,_=http('/mcp',init,auth='deliberately-invalid-agent11-token')\n\
        \    check('wrong_token_401',code==401,{'http_status':code})\n    code,h,body=http('/mcp',init,TOKEN)\n    check('initialize_http',code==200,{'http_status':code})\n\
        \    initialized=rpc_parse(body,1)\n    check('initialize_contract',isinstance(initialized.get('serverInfo'),dict)\
        \ and isinstance(initialized.get('capabilities'),dict) and isinstance(initialized.get('protocolVersion'),str))\n \
        \   SID=h.get('Mcp-Session-Id')\n    check('session_id_present',bool(SID))\n    code,_,_=http('/mcp',{'jsonrpc':'2.0','method':'notifications/initialized'},TOKEN,SID)\n\
        \    check('initialized_notification',code in (200,202,204),{'http_status':code})\n    ping=call(2,'ping',{});check('ping_empty_result',ping=={})\n\
        \    tools=call(3,'tools/list',{})\n    rows=tools.get('tools');check('nonempty_tool_catalog',isinstance(rows,list)\
        \ and len(rows)>0)\n    check('tool_schema_objects',all(isinstance(x,dict) and isinstance(x.get('name'),str) and isinstance(x.get('inputSchema'),dict)\
        \ for x in rows))\n    SUMMARY['advertised_tool_count_first_page']=len(rows)\n    check('project_admin_advertised',any(x['name']=='project_admin'\
        \ for x in rows))\n    result=call(4,'tools/call',{'name':'project_admin','arguments':{'operation':'list_projects'}})\n\
        \    check('read_only_tool_not_error',result.get('isError') is not True)\n    content=result.get('content');check('tool_content_list',isinstance(content,list))\n\
        \    texts=[x['text'] for x in content if isinstance(x,dict) and x.get('type')=='text' and isinstance(x.get('text'),str)]\n\
        \    text='\\n'.join(texts)\n    check('empty_workspace_project_count',bool(re.search(r'\\*\\*Project count:\\*\\\
        *\\s*0\\s+projects',text)))\n    check('no_project_files_created',not any(WS.glob('*/.project')))\n    SUMMARY['mcp_read_only_smoke_passed']=True\n\
        \    code,_,_=http('/mcp',auth=TOKEN,sid=SID,method='DELETE')\n    SUMMARY['session_delete_http']=code\n    SUMMARY['outcome']='success'\n\
        except Exception as e:\n    ERROR=type(e).__name__+': '+str(e)\n    for secret in (TOKEN,SID):\n        if secret:ERROR=ERROR.replace(secret,'<redacted>')\n\
        \    SUMMARY['failure']=ERROR[:800]\n    print('SMOKE_FAILURE='+SUMMARY['failure'],flush=True)\nfinally:\n    if PROC\
        \ is not None:\n        try:os.killpg(PROC.pid,signal.SIGTERM)\n        except ProcessLookupError:pass\n        try:PROC.wait(timeout=20)\n\
        \        except subprocess.TimeoutExpired:\n            try:os.killpg(PROC.pid,signal.SIGKILL)\n            except\
        \ ProcessLookupError:pass\n            PROC.wait(timeout=10)\n        SUMMARY['own_launcher_stopped']=PROC.poll()\
        \ is not None\n    if PROC is not None:\n        stop_exact_own_processes()\n        # xvfb-run may have exited before\
        \ all children; close our surviving group too.\n        try:os.killpg(PROC.pid,signal.SIGTERM)\n        except ProcessLookupError:pass\n\
        \    if 'PORT' in globals():\n        until=time.monotonic()+10\n        while listeners(PORT) and time.monotonic()<until:time.sleep(.5)\n\
        \    if LOG:LOG.close()\n    sources=[RUN/'edt-private.log',WS/'.metadata/.log']\n    exception_types=[]\n    for\
        \ i,p in enumerate(sources):\n        if not p.is_file() or p.is_symlink():continue\n        text=p.read_text(encoding='utf-8',errors='replace')\n\
        \        for secret in (TOKEN,SID):\n            if secret:text=text.replace(secret,'<redacted>')\n        text=re.sub(r'(?i)(password|pwd|token|secret)(\\\
        s*[=:]\\s*)[^\\s;]+',r'\\1\\2<redacted>',text)\n        (REPORTS/('edt-sanitized-'+str(i)+'.log')).write_text(text,encoding='utf-8')\n\
        \        exception_types+=re.findall(r'\\b((?:[a-zA-Z_]\\w*\\.)+(?:[A-Z]\\w*(?:Exception|Error)))\\b',text)\n    SUMMARY['exception_types']=sorted(set(exception_types))\n\
        \    if 'PORT' in globals():SUMMARY['own_port_closed']=not listeners(PORT)\n    if SUMMARY.get('outcome')=='success'\
        \ and (not SUMMARY.get('own_port_closed') or SUMMARY.get('cleanup_remaining_exact_own_processes',0)):\n        SUMMARY['outcome']='failure';SUMMARY['failure']='Own\
        \ listener still present after process cleanup'\n    # The now-inactive random token is not retained in the workspace\
        \ preferences.\n    p=WS/'.metadata/.plugins/org.eclipse.core.runtime/.settings/si.edt.mcp.server.prefs'\n    if p.is_file()\
        \ and not p.is_symlink():\n        text=p.read_text(encoding='utf-8',errors='replace')\n        p.write_text('\\n'.join(x\
        \ for x in text.splitlines() if not x.startswith('mcpAuthToken='))+'\\n',encoding='utf-8')\n        p.chmod(0o600)\n\
        \    (REPORTS/'smoke-summary.json').write_text(json.dumps(SUMMARY,ensure_ascii=False,indent=2),encoding='utf-8')\n\
        \    print('SMOKE_OUTCOME='+SUMMARY['outcome'],flush=True)\nsys.exit(0 if SUMMARY['outcome']=='success' else 1)\n\n\
        PY\n"
    - name: Upload sanitized smoke evidence only
      if: always() && env.SMOKE_RUN != ''
      uses: actions/upload-artifact@v4
      with:
        name: readonly-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.SMOKE_RUN }}/reports/
        retention-days: 7
    - name: Show retained result path and disk space
      if: always()
      shell: bash
      run: "if [ -n \"${SMOKE_RUN:-}\" ]; then\n  echo \"RETAINED=$SMOKE_RUN\"\n  df -h \"$SMOKE_RUN\"\nfi\n"
