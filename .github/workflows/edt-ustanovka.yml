# №13: установка ровно тех двух архивов, что владелец дал ссылками (09.11.2026),
# и проверка, что они работают вместе. Раннер ubuntu-22.04 выбран осознанно:
# на Debian 13, где я пробовал локально, нет libwebkit2gtk-4.0 и libsoup2.4 —
# платформа 8.3.27 их требует, и склейка библиотек разных выпусков даёт ABI-кашу.
# Здесь эти библиотеки родные.
name: Установка EDT и платформы (проверка пары)
on:
  workflow_dispatch:
  push:
    branches: [agent/13-edt-install-check]
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      EDT_ID: 1VoNAre0c3r7jRUtVlP4jUpXbNgur3GkI
      PLATFORM_ID: 18b_5EnQYlkPg-SW4cXK20s9MeHzEZBGJ
      PREFIX: /opt/1cv8
    steps:
      - name: Железо раннера (для протокола)
        run: |
          echo "CPU: $(nproc)"; free -h; df -h / | tail -1; . /etc/os-release; echo "$PRETTY_NAME"

      - name: Зависимости
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11-utils libglu1-mesa libwebkit2gtk-4.0-37 \
              libgtk-3-0 libcups2 libnss3 libasound2 scrot tesseract-ocr tesseract-ocr-rus > /dev/null
          echo "пакеты поставлены"

      - name: Скачать архивы владельца с Google Drive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/si"
          get() {
            id="$1"; out="$2"
            curl -sL -c /tmp/ck -b /tmp/ck "https://drive.google.com/uc?export=download&id=$id" -o /tmp/w.html
            uuid=$(grep -oE 'name="uuid" value="[^"]*"' /tmp/w.html | sed 's/.*value="//;s/"//')
            curl -fsSL --retry 3 --connect-timeout 20 -b /tmp/ck \
              "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t&uuid=$uuid" \
              -o "$out"
            echo "== $out: $(stat -c%s "$out") байт"
            gzip -t "$out" && echo "   gzip ok"
          }
          get "$EDT_ID" "$RUNNER_TEMP/si/edt.tar.gz"
          get "$PLATFORM_ID" "$RUNNER_TEMP/si/platform.tar.gz"
          sha256sum "$RUNNER_TEMP/si/"*.tar.gz

      - name: Распаковать
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/si/edt" "$RUNNER_TEMP/si/platform"
          tar -xzf "$RUNNER_TEMP/si/edt.tar.gz" -C "$RUNNER_TEMP/si/edt"
          tar -xzf "$RUNNER_TEMP/si/platform.tar.gz" -C "$RUNNER_TEMP/si/platform"
          echo "== содержимое архива EDT:"; ls "$RUNNER_TEMP/si/edt"
          echo "== содержимое архива платформы:"; ls "$RUNNER_TEMP/si/platform"

      - name: Что предлагает установщик (каталог продуктов)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/si/edt"
          sudo ./1ce-installer-cli query 2>/dev/null | tee "$RUNNER_TEMP/si/edt-catalog.txt"

      - name: Установить EDT 2024.2.6 целиком
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/si/edt"
          sudo ./1ce-installer-cli install all --products-home /opt/1C --ignore-hardware-checks 2>&1 | tail -20
          echo "== что установлено:"
          sudo ./1ce-installer-cli query installed 2>/dev/null | tee "$RUNNER_TEMP/si/edt-installed.txt"
          echo "== каталоги установки:"
          sudo find /opt/1C -maxdepth 3 -mindepth 1 -type d -printf '%p\n' | head -20
          sudo du -sh /opt/1C/* 2>/dev/null | sort -h | tail -6

      - name: Найти настоящую среду EDT (не загрузчик) и её версию
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "== исполняемые файлы 1cedt*:"
          sudo find /opt/1C -maxdepth 5 -name '1cedt*' -type f 2>/dev/null | head -10
          BIN=$(sudo find /opt/1C -maxdepth 5 -name '1cedt' -type f | head -1)
          echo "== среда: $BIN"
          if [ -n "$BIN" ]; then
            ROOT=$(dirname "$BIN"); echo "== каталог: $ROOT"
            sudo ls "$ROOT" | head -15
            echo "== .eclipseproduct:"; sudo cat "$ROOT/.eclipseproduct" 2>/dev/null || echo "нет"
            echo "== 1cedt.ini (первые строки):"; sudo head -12 "$ROOT/1cedt.ini" 2>/dev/null || echo "нет"
            echo "== признак облачного запуска/OAuth (должно быть пусто):"
            sudo grep -riE 'cloud.launcher|useOAuth' "$ROOT/1cedt.ini" 2>/dev/null || echo "признаков нет"
            echo "== плагины платформы 1С в этой среде:"; sudo ls "$ROOT/plugins" 2>/dev/null | grep -i 'v8.dt' | head -6
          fi

      - name: Разведка CLI — какие команды есть у 2024.2.6
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -uo pipefail
          CLI=$(sudo find /opt/1C -maxdepth 5 -name '1cedtcli' -type f | head -1)
          echo "== CLI: $CLI"
          [ -z "$CLI" ] && { echo "CLI не найден"; exit 0; }
          echo "== -version:"; sudo timeout -s KILL 180 "$CLI" -version 2>&1 | head -15
          echo; echo "== -help:"; sudo timeout -s KILL 180 "$CLI" -help 2>&1 | head -50

      - name: Какую версию платформы 1С знает эта среда
        continue-on-error: true
        run: |
          set -uo pipefail
          ROOT=$(dirname "$(sudo find /opt/1C -maxdepth 5 -name '1cedt' -type f | head -1)")
          echo "== каталог среды: $ROOT"
          echo "== минимальные сборки 8.3.2x, найденные в плагинах:"
          sudo grep -rao '8\.3\.2[0-9]\.[0-9]\{3,4\}' "$ROOT/plugins" 2>/dev/null | sort -u | head -20 || true

      - name: Установить платформу 8.3.27.1508 (учебная)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/si/platform"
          chmod +x ./*.run
          sudo ./*.run --mode unattended --unattendedmodeui none --installer-language en \
            --enable-components client_full,ws,ru --prefix "$PREFIX" 2>&1 | tail -15
          echo "== каталоги платформы:"; sudo ls "$PREFIX" || true
          sudo find "$PREFIX" -maxdepth 4 -name '1cv8*' -type f 2>/dev/null | head -10

      - name: Починка библиотек — убрать встроенный libstdc++ (он старше системного)
        shell: bash
        run: |
          set -uo pipefail
          echo "== копии libstdc++ внутри платформы:"
          sudo find /opt/1cv8 -name 'libstdc++.so.6*' -printf '%p\n' | tee /tmp/liblist.txt
          # Переименовываем ВСЕ копии: в прогоне 42627198997 переименовалась только первая,
          # а загружалась та, что лежит рядом с бинарником, и ошибка осталась.
          while read -r f; do
            case "$f" in *.from-1c) continue;; esac
            sudo mv "$f" "$f.from-1c" && echo "переименован: $f"
          done < /tmp/liblist.txt
          echo "== системная библиотека:"
          ls -l /lib/x86_64-linux-gnu/libstdc++.so.6
          strings /lib/x86_64-linux-gnu/libstdc++.so.6 | grep -c 'GLIBCXX_3.4.30' || true

      - name: Запуск платформы и пустая информационная база
        shell: bash
        timeout-minutes: 10
        run: |
          set -uo pipefail
          BIN=$(sudo find /opt/1cv8 -maxdepth 5 -name '1cv8t' -type f -perm -u+x | head -1)
          echo "бинарник: $BIN"
          echo "версия (из пути установки): $(echo "$BIN" | grep -oE '8\.[0-9.]+' | head -1)"
          echo "== чего не хватает:"
          ldd "$BIN" 2>/dev/null | grep 'not found' || echo "все библиотеки на месте"
          Xvfb :92 -screen 0 1280x900x24 > /tmp/xvfb-1c.log 2>&1 &
          sleep 3
          export DISPLAY=:92
          BASE="$RUNNER_TEMP/si/ib"; mkdir -p "$BASE"
          echo "== создание пустой ИБ (жёсткий таймаут: клиент игнорирует SIGTERM, проверено прогоном 42627864149):"
          timeout -s KILL 240 sudo -E "$BIN" CREATEINFOBASE "File=$BASE" > /tmp/ib.log 2>&1
          code=$?
          echo "CREATEINFOBASE код: $code"
          sudo pkill -9 -f 1cv8 2>/dev/null || true
          tail -10 /tmp/ib.log || true
          sudo find "$BASE" -maxdepth 1 -type f -printf '%f %s байт\n' | head
          if sudo test -s "$BASE/1Cv8.1CD"; then
            echo "ИТОГ: платформа работает, информационная база создана"
          else
            echo "ИТОГ: база не создана"
          fi
          sudo pkill -9 -f Xvfb 2>/dev/null || true

      - name: Что на самом деле поставилось — размеры и поиск среды по всей машине
        run: |
          set -uo pipefail
          echo "== архив EDT: $(stat -c%s "$RUNNER_TEMP/si/edt.tar.gz") байт"
          echo "== полный дистрибутив EDT весит гигабайты; 90 МБ — это загрузчик"
          echo "== установлено под /opt/1C:"
          sudo du -sh /opt/1C/components/* /opt/1C/products/* 2>/dev/null | sort -h
          echo "== ищем саму среду (1cedt) по всей машине, не только в /opt/1C:"
          sudo find / -xdev -maxdepth 8 -name '1cedt' -type f 2>/dev/null | head -5 || true
          sudo find / -xdev -maxdepth 8 -name '1cedtcli' -type f 2>/dev/null | head -5 || true
          echo "== что есть из исполняемого:"
          sudo find /opt/1C -maxdepth 5 -type f -perm -u+x -name '1ce*' 2>/dev/null | head -10
          echo "== Ring CLI (это установщик p2, ему нужен репозиторий в сети):"
          RING=$(sudo find /opt/1C -maxdepth 6 -name 'ring' -type f -perm -u+x | head -1)
          echo "ring: $RING"
          [ -n "$RING" ] && sudo timeout -s KILL 60 "$RING" --help 2>&1 | head -15 || echo "ring не найден"

      - name: Сводка
        if: always()
        run: |
          echo "== EDT (полный дистрибутив):"
          sudo cat /opt/1C/edt/.eclipseproduct 2>/dev/null || echo "нет .eclipseproduct"
          sudo du -sh /opt/1C/edt 2>/dev/null || true
          echo "== вывод:"
          if sudo test -x /opt/1C/edt/1cedt; then echo "   среда EDT найдена"; else echo "   среды EDT в установке НЕТ — это загрузчик 1C:EDT Start"; fi
          echo "== платформа:"
          echo "== вывод:"
          if sudo test -x /opt/1C/edt/1cedt; then echo "   среда EDT найдена"; else echo "   среды EDT в установке НЕТ — это загрузчик 1C:EDT Start"; fi
          echo "== платформа:"; sudo find "$PREFIX" -maxdepth 3 -type d 2>/dev/null | head -10 || echo "нет данных"
