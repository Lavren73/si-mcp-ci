# А1-0392/0393 · hosted-проверка окружения прогоном scripts/check-env.sh из SI-MCP.
#
# Зачем дому отдельный workflow: SI-MCP приватный, и его hosted-минуты исчерпаны,
# а проверить «есть ли на машине node, python и gh» надо именно на чистом
# GitHub-hosted раннере — там эталонный набор инструментов. Сам чинк живёт в
# репозитории проекта (scripts/check-env.sh), чтобы он не мог разошиться с тем,
# что требует CI; домик только одалживает раннер.
#
# Откуда берётся скрипт: клон SI-MCP по deploy key — тот же проверенный шаблон,
# что в agent13-client-tests.yml (прогон 45899490256, success).
#
# А1-0393 (этот коммит):
#  - on.push.branches на ветку PR — без него домик исполняет workflow только с
#    default branch, то есть чинк нельзя было проверить до мержа #15;
#  - цель (TARGET_SHA) разрешается, а не подставляется в checkout: sha домика не
#    существует в SI-MCP, отсюда «exit code 8» в прогоне 46035735830; теперь цель —
#    ref головы ветки SI-MCP (push-прогон) или точный sha из входа (dispatch);
#  - шаг 0 пишет в job-сводку событие, раннера, длину секрета (значение не
#    печатается) и наличие git/node/python3/gh;
#  - отказы шага 1 диагностируются явно (клон, ls-remote, checkout, mismatch),
#    rc снимается до следующей команды;
#  - шаг 2 дублирует вывод чинка аннотацией: её читает публичный
#    GET /repos/<домик>/check-runs/<job>/annotations, тогда как логи шагов
#    интеграции недоступны (401 на /actions/jobs/<id>/logs).
#  - A1-0494: hosted-прогон дополнительно вызывает check-env-selftest.sh (P-4).
# Кто: №13. Когда: 28.11.2026. Что: selftest добавлен в этот workflow после реального check-env.
# Почему: локально фиксируются П-1/П-2, теперь те же сценарии исполняются на hosted; #659.
# Было: домик прогонял только check-env.sh, самотест не запускался автоматически.
# Основание: handoff №12 к №13, комментарий #7240227362, пункт П-4.
#
# Честность вывода: чинк возвращает 1, если хотя бы один инструмент отсутствует
# или не отвечает, и workflow честно краснеет. Пропуск не превращается в успех.
name: №11 — check-env на hosted (node, python, gh из SI-MCP scripts/)
on:
  push:
    branches:
      - agent/11-a1-0392-check-env-20261127
  workflow_dispatch:
    inputs:
      sha:
        description: 'Цель в SI-MCP: полный sha или ref с чинком (пусто = голова ветки SI-MCP)'
        required: true
        default: 'refs/heads/agent/11-a1-0392-check-env-20261127'
permissions:
  contents: read
concurrency:
  group: agent11-check-env
  cancel-in-progress: false
jobs:
  env:
    name: bash scripts/check-env.sh (hosted ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: ${{ github.event.inputs.sha || 'refs/heads/agent/11-a1-0392-check-env-20261127' }}
    steps:
      - name: 0. Предпроверка (событие, ключ, инструменты раннера)
        env:
          DEPLOY_KEY: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          {
            echo "### check-env · предпроверка · $(uname -srm)"
            echo
            echo "- событие \`$GITHUB_EVENT_NAME\` · раннер \`${RUNNER_NAME:-?}\` (id ${RUNNER_ID:-?})"
            echo "- цель SI-MCP: \`${TARGET_SHA:-ПУСТО}\`"
            if [ -n "${DEPLOY_KEY}" ]; then
              echo "- секрет \`SI_MCP_DEPLOY_KEY\`: не пустой, ${#DEPLOY_KEY} байт, начинается с \`$(printf '%s' "${DEPLOY_KEY}" | head -c 5)\`"
            else
              echo "- секрет \`SI_MCP_DEPLOY_KEY\`: **пустой** на событии \`$GITHUB_EVENT_NAME\`"
            fi
            for x in git node python3 gh; do printf -- '- %-8s %s\n' "$x" "$(command -v $x || echo НЕТ)"; done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "event=$GITHUB_EVENT_NAME | target=${TARGET_SHA:-EMPTY} | key_bytes=${#DEPLOY_KEY}"

      - name: 1. Приватный SI-MCP — клон по deploy key и переход на цель
        env:
          DEPLOY_KEY: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        run: |
          set -uo pipefail
          say() {
            printf '%s\n' "$1"
            printf -- '- %s\n' "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          annotate() { printf '::%s::%s\n' "$1" "$2"; }
          trap 'annotate notice "ШАГ 1 ПРЕРВАН НА НЕОЖИДАННОЙ КОМАНДЕ (код $?) — см. строки clone и ls-remote выше"' ERR
          if [ -z "${TARGET_SHA}" ]; then
            say "ЦЕЛЬ ПУСТА: workflow вызван без sha — переходить некуда"
            exit 1
          fi
          if [ -z "${DEPLOY_KEY}" ]; then
            say "СЕКРЕТ ПУСТОЙ: SI_MCP_DEPLOY_KEY не долетел до прогона на событии $GITHUB_EVENT_NAME — приватник не открыть"
            exit 1
          fi
          if ! printf '%s' "${DEPLOY_KEY}" | grep -q 'BEGIN [A-Z ]*PRIVATE KEY'; then
            say "СЕКРЕТ НЕ ПОХОЖ НА deploy-ключ: нет строки BEGIN ... PRIVATE KEY (${#DEPLOY_KEY} байт)"
            exit 4
          fi
          mkdir -p "$RUNNER_TEMP/.ssh"
          chmod 700 "$RUNNER_TEMP/.ssh"
          rm -rf "$RUNNER_TEMP/src"
          printf '%s\n' "${DEPLOY_KEY}" > "$RUNNER_TEMP/.ssh/id_deploy"
          chmod 600 "$RUNNER_TEMP/.ssh/id_deploy"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "$RUNNER_TEMP/.ssh/known_hosts" 2>/dev/null || true
          say "ключ принят: приватный PEM, ${#DEPLOY_KEY} байт"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/.ssh/id_deploy -o UserKnownHostsFile=$RUNNER_TEMP/.ssh/known_hosts -o IdentitiesOnly=yes" \
            git clone --no-checkout git@github.com:Lavren73/SI-MCP.git "$RUNNER_TEMP/src" > "$RUNNER_TEMP/clone.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            tail -n 3 "$RUNNER_TEMP/clone.log" || true
            say "КЛОН НЕ УДАЛСЯ (код $rc): $(tail -n 1 "$RUNNER_TEMP/clone.log" | tr -d '\r' | cut -c1-160)"
            exit "$rc"
          fi
          say "клон по ssh состоялся"
          cd "$RUNNER_TEMP/src" || { say "СИСТЕМА: каталог клона не появился"; exit 7; }
          RESOLVED=""
          case "$TARGET_SHA" in
            *[!0-9a-fA-F]*|"") : ;;
            *) if [ "${#TARGET_SHA}" -eq 40 ]; then RESOLVED="$TARGET_SHA"; fi ;;
          esac
          if [ -z "$RESOLVED" ]; then
            annotate notice "РАЗРЕШАЮ ЦЕЛЬ ЧЕРЕЗ ls-remote: $TARGET_SHA"
            RESOLVED="$(git ls-remote origin "$TARGET_SHA" 2>/dev/null | head -1 | cut -f1 || true)"
            if [ -z "$RESOLVED" ]; then
              RESOLVED="$(git ls-remote origin "refs/heads/$TARGET_SHA" 2>/dev/null | head -1 | cut -f1 || true)"
            fi
            if [ -n "$RESOLVED" ]; then
              say "ls-remote «$TARGET_SHA» → $RESOLVED"
            else
              # Прямой ls-remote из клона ключом не авторизуется (прогон 46036317881: код 9).
              # Пробуем тот же ref аутентифицированным fetch'ом и берём FETCH_HEAD.
              say "ls-remote молчит — пробую fetch $TARGET_SHA с тем же ключом"
              if GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/.ssh/id_deploy -o UserKnownHostsFile=$RUNNER_TEMP/.ssh/known_hosts -o IdentitiesOnly=yes"                    git fetch -q origin "$TARGET_SHA" > "$RUNNER_TEMP/fetch.log" 2>&1; then
                RESOLVED="$(git rev-parse FETCH_HEAD 2>/dev/null || true)"
                say "fetch состоялся → $RESOLVED"
              else
                rc=$?
                say "FETCH НЕ УДАЛСЯ (код $rc): $(tail -n 1 "$RUNNER_TEMP/fetch.log" | tr -d '\r' | cut -c1-140)"
                say "remote: $(git remote get-url origin | sed -E 's#//[^@]*@#//<СКРЫТО>@#')"
                say "ls-remote без фильтра вернул $(git ls-remote origin 2>&1 | wc -l) строк (первая: $(git ls-remote origin 2>/dev/null | head -1 | cut -c1-60))"
                exit 9
              fi
            fi
          fi
          if [ -z "$RESOLVED" ]; then say "ЦЕЛЬ НЕ РАЗРЕШЕНА: ни ls-remote, ни fetch не дали объекта"; exit 9; fi
          annotate notice "РЕЗОЛВ: $TARGET_SHA → $RESOLVED"
          if ! git cat-file -e "$RESOLVED^{commit}" 2>/dev/null; then
            git fetch -q origin "$RESOLVED" 2>/dev/null || true
          fi
          git checkout -q --detach "$RESOLVED" || { say "CHECKOUT НЕ УДАЛСЯ (код $?): $RESOLVED"; exit 8; }
          HEAD_SHA="$(git rev-parse HEAD)"
          say "head: $HEAD_SHA | $(git log -1 --format=%s | cut -c1-64)"
          if [ "$HEAD_SHA" != "$RESOLVED" ]; then
            say "HEAD MISMATCH: получили $HEAD_SHA, хотели $RESOLVED"
            exit 5
          fi
          if [ ! -f scripts/check-env.sh ]; then
            say "НА ЭТОМ КОММИТЕ файла scripts/check-env.sh нет — чинк приехал не тем коммитом"
            exit 6
          fi
          rm -f "$RUNNER_TEMP/.ssh/id_deploy"
          say "ключ удалён из $RUNNER_TEMP/.ssh, чинк на месте ($(wc -c < scripts/check-env.sh) байт)"

      - name: 2. Прогнать чинк окружения из проверяемого дерева
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/src"
          echo "== раннер: ${RUNNER_NAME:-?} | id ${RUNNER_ID:-?} | образ ${ImageOS:-?} =="
          bash scripts/check-env.sh 2>&1 | tee "$RUNNER_TEMP/check-env.log"
          rc=${PIPESTATUS[0]}
          echo "CHECK_ENV_EXIT=$rc" >> "$GITHUB_ENV"
          oneline="$(tr '\n' '|' < "$RUNNER_TEMP/check-env.log" | tr -d '`%()' | cut -c1-460)"
          printf '::%s::check-env rc=%s · %s\n' "$([ "$rc" -eq 0 ] && echo notice || echo warning)" "$rc" "$oneline"
          {
            echo
            echo '```'
            cat "$RUNNER_TEMP/check-env.log"
            echo '```'
            echo
            if [ "$rc" -eq 0 ]; then
              echo "**Как читать:** \`ИТОГО: 3 из 3 проверено, сломанных 0\` и код 0 — node, python и gh на месте, \`--version\` отработал."
            else
              echo "**Как читать:** код $rc — строка \`НЕ ХВАТАЕТ\` означает отсутствие в PATH, \`НЕ ОТВЕЧАЕТ\` — бинарник есть, но \`--version\` вернул ненулевой код. Пропуск инструмента зелёным не считается."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: 3. Самотест на ложных окружениях (П-1/П-2)
        run: |
          set +e
          cd "$RUNNER_TEMP/src"
          bash scripts/check-env-selftest.sh > "$RUNNER_TEMP/check-env-selftest.log" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/check-env-selftest.log"
          echo "CHECK_ENV_SELFTEST_EXIT=$rc"
          {
            echo
            echo '### check-env selftest (из точной головы SI-MCP)'
            echo '```'
            cat "$RUNNER_TEMP/check-env-selftest.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
