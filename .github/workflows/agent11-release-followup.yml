name: SI-MCP — corrected OSGi pilot and release candidate follow-up (11)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: si1c-team-test-stand
  cancel-in-progress: false
jobs:
  batch:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - si1c
    timeout-minutes: 240
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      RUNNER_TOOL_CACHE: /home/runner/si1c-team-tests/toolcache
      AGENT_TOOLSDIRECTORY: /home/runner/si1c-team-tests/toolcache
      CANDIDATE_MANIFEST: '{"common":"3ef5771154e888ca32ce8d7479569afb4e95e723","pr157":"163023ad5b2f44a6fc5bff0f884f3baece3144a2","pr158":"ed4285c86d1ddd088c709bc8ec59bcf12ab1d391","pr161":"34ac284a3f90ecb2f8674e70935e62e64b57d9d2","pr162":"63b1dfa6d9009517b5e7d1313dcd1b4dc4286aa3","pr165":"dce803d0a3525dd5cf0cc2a7aac834eccc06429b","pr167":"52354dfbc0ec43e27855bb829cc7175d44337b05","pr168":"981024460e13be7664510a68ca26e2dcc9ff36c0","pr169":"8e0e756dc973a46265f028a334ff303e8232b904","pr170":"a9a96e04ffadc4837fd9ff3038c4c607e307a77f","pr172":"e4f6959d859122d7f305a00e12a0a2206a06d507","pr173":"19e3231b0287ecd8fb473b709a8d0dbeff9a5a24","pr118":"8c34121396636454afe383003370f159053cc579","probes":"da263accc413d24be2bbf3057324bebf7f9ff3f3","old157":"19654d668a13e38f93d6900ed933505709e2dde1","old162":"0c2af8808950264e9534f93c5c8aecd4f9b26d49","old172":"324780dd13ce1e23ed16f1570544fd0b975eb2ff"}'
      PR169_CHANGED_TESTS: '["ANoOpSaysWhyAndAHandChangedBoardIsNotOverwrittenTest", "AStaleAgreementDoesNotWidenTest", "AWideningLevelIsRefusedInAListedModeTest",
        "ReadOnlyClosesTheDoorAndKeepsTheChoiceTest", "TheTwoListsOnThePageAreTwoRecordsTest", "TheWriteGateIsAnsweredByThePolicyNotTheLabelTest",
        "ToolAccessLevelTest", "ToolTicksTest", "ReadOnlyPresetDisablesExportInfobaseObjectsTest", "TheRoadRefusesWhatTheGateRefusesTest",
        "EditMetadataToolTest", "ExtensionWorkshopToolTest", "SelfUpkeepToolTest", "UpdateBorrowedPresetGateTest", "ADisabledToolAnswersAsARefusalTest",
        "AToolsListIsTheSameBetweenCallsTest"]'
    steps:
    - name: Create owned isolated batch; no infobase or original EDT changes
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        BASE="$HOME/si1c-team-tests"
        test -d "$BASE" && test ! -L "$BASE" && test -O "$BASE"
        test "$(cat "$BASE/OWNER.txt")" = 'SI-MCP team test stand; provisioned by agent 11'
        RUN="$BASE/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        test ! -e "$RUN"
        mkdir -m 700 "$RUN"
        mkdir "$RUN/reports" "$RUN/sources"
        echo "TEAM_BASE=$BASE" >> "$GITHUB_ENV"
        echo "TEAM_RUN=$RUN" >> "$GITHUB_ENV"
        test "$(df -Pk "$BASE" | awk 'NR==2 {print $4}')" -gt 15728640
    - name: Prepare setup-python@v5 in team toolcache
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare setup-node@v4 in team toolcache
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Prepare setup-java@v4 in team toolcache
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Remember JDK17 without changing system alternatives
      shell: bash
      run: |
        echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
    - name: Prepare JDK25 for active target2026.2
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
    - name: Remember JDK25 and use existing private SSH client
      shell: bash
      run: |
        set -euo pipefail
        echo "JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
        if ! command -v ssh >/dev/null; then
          test -x "$TEAM_BASE/tools/openssh/usr/bin/ssh"
          "$TEAM_BASE/tools/openssh/usr/bin/ssh" -V
          echo "$TEAM_BASE/tools/openssh/usr/bin" >> "$GITHUB_PATH"
        fi
        test -x "$TEAM_BASE/tools/python-tests/bin/python"
        test -x "$TEAM_BASE/tools/apache-maven-3.9.9/bin/mvn"
        test -x "$TEAM_BASE/tools/powershell-7.4.13/pwsh"
        command -v xvfb-run
