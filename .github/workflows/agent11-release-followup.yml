        ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        persist-credentials: false
        fetch-depth: 1
        path: acc-old172-${{ github.run_id }}
    - name: 'Corrected reactor pilot: actual AtomicFileReplace OSGi 077/022 and red control'
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        exec 9>"$TEAM_BASE/locks/live-tests.lock"
        echo 'Waiting for shared test lock; never cancel others'
        flock -w 600 9
        python3 - pilot <<'PYDRIVER'
        """Pinned independent candidates, sequential runner-only tests; no merge/EDT installation."""
        import os,sys,json,time,pathlib,subprocess,signal,shutil,xml.etree.ElementTree as ET,zipfile,struct,collections,re,importlib.util,hashlib
        P=pathlib.Path
        BASE=P(os.environ['TEAM_BASE']);RUN=P(os.environ['TEAM_RUN']);REPORT=RUN/'reports';SOURCES=RUN/'sources'
        MANIFEST=json.loads(os.environ['CANDIDATE_MANIFEST']);PHASE=sys.argv[1];RESULTS=[]
        VENV=BASE/'tools/python-tests/bin';PY=str(VENV/'python');MAVEN=str(BASE/'tools/apache-maven-3.9.9/bin/mvn')

        def safety():
            busy=[]
            for p in P('/proc').iterdir():
                if not p.name.isdecimal():continue
                try:
                    n=(p/'comm').read_text().strip()
                    if n in ('java','javaw','1cedt','1cedtcli','1cv8','1cv8c','rphost','ragent','rmngr','ras'):busy.append({'pid':int(p.name),'name':n})
                except OSError:pass
            mem={x.split(':')[0]:int(x.split()[1])*1024 for x in P('/proc/meminfo').read_text().splitlines() if x.startswith(('MemAvailable:','MemTotal:'))}
            report={'phase':PHASE,'visible_sessions':busy,'memory':mem,'kernel':os.uname().release,'scope':'Container PID namespace only; no host-wide session claim'}
            (REPORT/(PHASE+'-preflight.json')).write_text(json.dumps(report,indent=2))
            if busy:raise RuntimeError('Visible EDT/Java/1C session: stop without killing')
            if mem.get('MemAvailable',0)<6*1024**3:raise RuntimeError('Below 6GiB available memory')
            if os.uname().release!='5.15.0-203-generic':raise RuntimeError('Kernel changed; inspect before proceeding')
            for root,used,limit in [('/sys/fs/cgroup','memory.current','memory.max'),('/sys/fs/cgroup/memory','memory.usage_in_bytes','memory.limit_in_bytes')]:
                a=P(root)/used;b=P(root)/limit
                if a.exists() and b.exists():
                    v=b.read_text().strip()
                    if v!='max' and int(v)-int(a.read_text())<5*1024**3:raise RuntimeError('Below 5GiB cgroup headroom')
                    break
            if shutil.disk_usage(RUN).free<10*1024**3:raise RuntimeError('Below 10GiB free disk')

        def source(label):return SOURCES/label

        def env_for(label,jdk='17'):
            e=os.environ.copy();home=RUN/('home-'+label);tmp=RUN/('tmp-'+label)
            home.mkdir(exist_ok=True,mode=0o700);tmp.mkdir(exist_ok=True,mode=0o700)
            java=e['JAVA'+jdk+'_HOME']
            e.update({'HOME':str(home),'XDG_CONFIG_HOME':str(home/'.config'),'XDG_CACHE_HOME':str(home/'.cache'),'XDG_DATA_HOME':str(home/'.local/share'),'TMPDIR':str(tmp),'TMP':str(tmp),'TEMP':str(tmp),'JAVA_HOME':java,'PATH':str(VENV)+':'+java+'/bin:'+str(BASE/'tools/apache-maven-3.9.9/bin')+':'+str(BASE/'tools/powershell-7.4.13')+':'+e['PATH'],'NODE_PATH':str(BASE/'tools/node-tests/node_modules'),'PYTHONDONTWRITEBYTECODE':'1','MAVEN_OPTS':'-Xmx3g -XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8 -Duser.home='+str(home),'JAVA_TOOL_OPTIONS':'-XX:ActiveProcessorCount=4 -Dfile.encoding=UTF-8'})
            return e

        def store():
            (REPORT/(PHASE+'-results.json')).write_text(json.dumps({'phase':PHASE,'sources':MANIFEST,'results':RESULTS,'limitations':['Independent exact candidates, not integration RC','Linux-only: no real Windows/COM/ACL','No live infobase, no model API or privileged host access','Baseline unchanged; expected red controls are not product PASS']},ensure_ascii=False,indent=2))

        def notrun(name,reason):
            RESULTS.append({'name':name,'status':'NOT_RUN','reason':reason});print('NOT_RUN',name,reason,flush=True);store()

        def run(name,args,cwd,label,limit=300,expected=(0,),jdk='17',mask=0o077,extra=None):
            safety();env=env_for(label,jdk)
            if extra:env.update(extra)
            t=time.monotonic();out=REPORT/(name+'.log');code=125
            with out.open('w') as f:
                cmd=['timeout','--signal=TERM','--kill-after=30s',str(limit)+'s','nice','-n','10','ionice','-c2','-n7']+list(map(str,args))
                p=subprocess.Popen(cmd,cwd=cwd,env=env,stdout=f,stderr=subprocess.STDOUT,start_new_session=True,umask=mask)
                try:
                    while True:
                        try:code=p.wait(timeout=20);break
                        except subprocess.TimeoutExpired:
                            avail=next((x.split()[1] for x in P('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')),'?')
                            print('HEARTBEAT',name,'elapsed',round(time.monotonic()-t),'s MemAvailableKiB',avail,flush=True)
                finally:
                    if p.poll() is None:
                        os.killpg(p.pid,signal.SIGTERM)
                        try:p.wait(timeout=30)
                        except subprocess.TimeoutExpired:os.killpg(p.pid,signal.SIGKILL);p.wait()
                    # Close only this process group if a test left a child behind.
                    try:os.killpg(p.pid,signal.SIGTERM)
                    except ProcessLookupError:pass
            row={'name':name,'source_label':label,'source_sha':MANIFEST.get(label),'command':list(map(str,args)),'exit':code,'expected_exits':list(expected),'seconds':round(time.monotonic()-t,2),'status':('PASS' if code==0 else 'EXPECTED_RED') if code in expected else 'FAIL'}
            RESULTS.append(row);(REPORT/(name+'.exit')).write_text(str(code)+'\n');store()
            print('RESULT',json.dumps(row,ensure_ascii=False),flush=True)
            print(out.read_text(errors='replace')[-4500:],flush=True)
            return code

        def summarize_maven(label,name):
            root=source(label);files=list(root.glob('server/**/surefire-reports/TEST-*.xml'));tot={k:0 for k in ('tests','failures','errors','skipped')};bad=[];malformed=[];classes=collections.Counter()
            for file in files:
                try:
                    x=ET.parse(file).getroot()
                    for k in tot:tot[k]+=int(x.get(k,'0'))
                    for c in x.findall('testcase'):
                        if c.find('skipped') is None:classes[c.get('classname','').rsplit('.',1)[-1]]+=1
                        if c.find('failure') is not None or c.find('error') is not None:bad.append(c.get('classname','')+'#'+c.get('name',''))
                except Exception:malformed.append(str(file.relative_to(root)))
            o={'source':MANIFEST[label],'report_files':len(files),'totals':tot,'failed_tests':bad,'malformed':malformed,'classes_executed':dict(classes)}
            (REPORT/(name+'-xml-summary.json')).write_text(json.dumps(o,ensure_ascii=False,indent=2));print('XML',name,json.dumps(o,ensure_ascii=False),flush=True)
            if not files or tot['tests']-tot['skipped']<=0 or malformed:
                RESULTS.append({'name':name+'-test-evidence','status':'FAIL','reason':'No non-skipped tests in valid XML reports'});store()

        def mvn(label,name,tests=None,profile=None,mask=0o077,limit=1800,goal='verify',expected=(0,)):
            root=source(label)
            for p in root.glob('server/**/surefire-reports/TEST-*.xml'):p.unlink()
            args=['xvfb-run','-a',MAVEN,'-B','-fae','-ntp','-Dstyle.color=never','-Dmaven.repo.local='+str(BASE/'cache/m2')]
            if profile:args+=['-P'+profile]
            if tests:args+=['-pl','targets/default,bundles/si.edt.mcp.server,bundles/si.edt.mcp.oform,tests/si.edt.mcp.server.tests','-am','-Dtest='+','.join(tests),'-DfailIfNoTests=false','-Dsurefire.failIfNoSpecifiedTests=false','-Dsurefire.runOrder=alphabetical']
            args+=[goal];code=run(name,args,root/'server',label,limit,expected,'25' if profile else '17',mask)
            summarize_maven(label,name)
            summary=json.loads((REPORT/(name+'-xml-summary.json')).read_text())
            if code==0 and (summary['totals']['failures'] or summary['totals']['errors']):
                RESULTS.append({'name':name+'-test-evidence','status':'FAIL','reason':'Zero exit contradicts XML failures/errors'});store()
            if tests:
                missing=sorted(set(tests)-set(summary['classes_executed']))
                RESULTS.append({'name':name+'-requested-class-coverage','status':'FAIL' if missing else 'PASS','missing_or_only_skipped':missing});store()
            if name=='pilot-atomic-negative-common-077':
                expected_case='si.edt.mcp.server.support.AtomicFileReplaceTest#anAtomicReplaceRetainsExistingPosixPermissions'
                proof=(code==1 and summary['failed_tests']==[expected_case] and summary['totals']['failures']==1 and summary['totals']['errors']==0)
                RESULTS.append({'name':name+'-negative-proof','status':'PASS' if proof else 'FAIL','expected_case':expected_case,'actual_failed_cases':summary['failed_tests']});store()
            return code

        def bytecode(label):
            items=[]
            for module in ['si.edt.mcp.server','si.edt.mcp.oform']:
                jars=list((source(label)/'server/bundles'/module/'target').glob(module+'-*.jar'))
                for p in jars:
                    with zipfile.ZipFile(p) as z:
                        counts=collections.Counter(struct.unpack('>H',z.read(n)[6:8])[0] for n in z.namelist() if n.endswith('.class'))
                        manifest=z.read('META-INF/MANIFEST.MF').decode(errors='replace')
                    items.append({'module':module,'jar':p.name,'class_major_counts':dict(counts),'all_major61':bool(counts) and set(counts)=={61},'manifest_ee_lines':[l for l in manifest.splitlines() if 'osgi.ee' in l or 'Build-Jdk' in l]})
            (REPORT/(label+'-bytecode.json')).write_text(json.dumps(items,indent=2))

        safety();REPORT.mkdir(exist_ok=True)
        for label,sha in MANIFEST.items():
            root=source(label)
            if not root.exists():
                checkout=P(os.environ['GITHUB_WORKSPACE'])/('acc-'+label+'-'+os.environ['GITHUB_RUN_ID'])
                assert subprocess.check_output(['git','-C',str(checkout),'rev-parse','HEAD'],text=True).strip()==sha
                subprocess.run(['git','clone','--no-hardlinks',str(checkout),str(root)],check=True,stdout=subprocess.DEVNULL)
                subprocess.run(['git','-C',str(root),'remote','set-url','origin','https://github.com/Lavren73/SI-MCP.git'],check=True)
            assert subprocess.check_output(['git','-C',str(root),'rev-parse','HEAD'],text=True).strip()==sha
            (REPORT/(label+'-sha.txt')).write_text(sha+'\n')
        C=source('common')
        for label in MANIFEST:
            subprocess.run(['git','-C',str(source(label)),'fetch',str(C),'HEAD:refs/remotes/origin/agent/obmen-20261102'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
        if PHASE=='pilot':
            mvn('pr168','pilot-pr168-umask077',['AtomicFileReplaceTest','ACommitIsReportedOnceTheBytesAreThereTest','ARefusedLockLeavesTheFileWholeTest'],mask=0o077)
            mvn('pr168','pilot-pr168-umask022',['AtomicFileReplaceTest'],mask=0o022)
            mvn('common','pilot-atomic-negative-common-077',['AtomicFileReplaceTest'],mask=0o077,expected=(1,))
        elif PHASE=='fast':
            for label in ['pr157','pr162']:
                r=source(label)
                code=run(label+'-installer',[PY,'make_installer.py'],r/'client',label)
                generated=r/'si-agent-setup.py'
                present=code==0 and generated.is_file()
                (REPORT/(label+'-installer-build.json')).write_text(json.dumps({'source_sha':MANIFEST[label],'generated':str(generated.relative_to(r)),'sha256':hashlib.sha256(generated.read_bytes()).hexdigest() if present else None,'scope':'Diagnostic build only, not a release artifact'},indent=2))
                RESULTS.append({'name':label+'-installer-artifact-evidence','status':'PASS' if present else 'FAIL'});store()
                run(label+'-client-full',[PY,'прогнать-тесты.py'],r/'client',label,1500)
            r=source('pr157')
            run('pr157-installer-focused',[PY,'-m','pytest','-q','tests/test_installer.py','tests/test_installer_safety.py','tests/test_windows_install_shortcuts_16.py','--junitxml='+str(REPORT/'pr157-installer-focused.xml')],r/'client','pr157',600)
