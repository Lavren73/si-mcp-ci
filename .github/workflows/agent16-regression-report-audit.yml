name: SI16 аудит отчётов Java регрессии
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 3
    steps:
      - name: Прочитать имена упавших synthetic и Java тестов личного прогона
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET, subprocess
          root=pathlib.Path.home()/'SI-MCP-Polygons/Agent-16/JavaRegression-43030590090'
          for p in [root.parent.parent,root.parent,root,root/'source']:
              if not p.is_dir() or p.is_symlink() or p.stat().st_uid!=os.getuid(): raise RuntimeError('unsafe personal directory')
          sha=subprocess.check_output(['git','-C',str(root/'source'),'rev-parse','HEAD'],text=True).strip()
          if sha!='99d6dd52f72f856f8b2d5471a89c4474db0b7384': raise RuntimeError('unexpected source sha')
          print('RESULT_SHA='+sha)
          files=sorted((root/'source'/'server').glob('**/target/surefire-reports/TEST-*.xml'))
          print('RESULT_REPORTS='+str(len(files)))
          for p in files:
              if p.is_symlink() or not p.is_file() or root.resolve() not in p.resolve().parents: raise RuntimeError('unsafe report')
              suite=ET.parse(p).getroot()
              fail=int(suite.get('failures','0'));err=int(suite.get('errors','0'))
              if fail or err:
                  print('RESULT_BAD_SUITE='+str(suite.get('name'))+' tests='+str(suite.get('tests'))+' failures='+str(fail)+' errors='+str(err))
                  for case in suite.findall('.//testcase'):
                      for k in ('failure','error'):
                          if case.find(k) is not None:
                              node=case.find(k)
                              print('RESULT_BAD_CASE='+str(case.get('classname'))+'#'+str(case.get('name'))+' kind='+k+' type='+str(node.get('type')))
                              for line in (node.text or '').splitlines():
                                  line=line.strip()
                                  if line.startswith('at si.edt.mcp.server.') and 'ExportInfobaseObjects' in line:
                                      print('RESULT_TEST_FRAME='+line[:300])
          print('RESULT_MESSAGES_AND_SECRET_CONTENT_NOT_READ_TO_OUTPUT=true')
          PY
