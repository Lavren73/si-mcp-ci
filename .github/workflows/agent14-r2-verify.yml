name: Agent 14 Hosted P0 R-2 Verify (667447dc)
on:
  push:
    branches:
      - agent/14-hosted-r2-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-r2-verify
  cancel-in-progress: true

jobs:
  r2_server_verify:
    name: "P0 R-2 (667447dc): exact SHA + neg-ctrls + full 0F/0E reactor"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Maven and p2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-simcp-v1
          restore-keys: |
            ${{ runner.os }}-m2-simcp-

      - name: Install Maven 3.9.9, Xvfb & pytest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          if [ ! -x /opt/apache-maven-3.9.9/bin/mvn ]; then
            curl -fsSL --retry 4 --retry-delay 2 https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://downloads.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
            sudo tar -xzf /tmp/mvn.tgz -C /opt
          fi
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          /opt/apache-maven-3.9.9/bin/mvn -version
          python3 -m pip install -q pytest pytest-subtests || true

      - name: Checkout exact SHA 667447dc44e02e9e438353eca33a7c84a68c7b44
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch agent/14-p0-r2-diagnostics-completeness --depth=40 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git checkout -q 667447dc44e02e9e438353eca33a7c84a68c7b44
          echo "EXACT_R2_SHA=$(git rev-parse HEAD)"

      - name: Standalone R-2 focused + 5 negative controls + cumulative 0F/0E reactor
        shell: bash
        run: |
          set -euo pipefail
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          def run_junit(classes):
              rep = srv / "tests/si.edt.mcp.server.tests/target/surefire-reports"
              for xp in rep.glob("TEST-*.xml"):
                  xp.unlink()
              r = subprocess.run([
                  "xvfb-run", "-a", "/opt/apache-maven-3.9.9/bin/mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                  f"-Dtest={','.join(classes)}", "verify"
              ], cwd=srv, capture_output=True, text=True)
              t = f = e = s = 0
              rows = []
              for xp in sorted(rep.glob("TEST-*.xml")):
                  root = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  ct = int(root.attrib.get("tests", 0))
                  cf = int(root.attrib.get("failures", 0))
                  ce = int(root.attrib.get("errors", 0))
                  cs = int(root.attrib.get("skipped", 0))
                  t += ct; f += cf; e += ce; s += cs
                  rows.append(f"{root.attrib.get('name')}: T={ct} F={cf} E={ce} S={cs}")
              return r.returncode, t, f, e, s, rows, r.stdout

          # 1. Exact SHA static gates
          r_txt = subprocess.run(["python3", "tools/проверка-текста.py"], cwd=src, capture_output=True, text=True)
          print(f"R2_TEXT exit={r_txt.returncode} last={(r_txt.stdout.strip().splitlines() or [''])[-1]}", flush=True)
          assert r_txt.returncode == 0
          for gate in [
              "scripts/check-operation-params.py",
              "scripts/check-declared-arguments-are-read.py",
              "scripts/check-orphan-javadoc.py",
              "scripts/check-swallowed-reflection.py",
              "scripts/test-coverage-audit.py",
          ]:
              rg = subprocess.run(["python3", gate], cwd=srv, capture_output=True, text=True)
              print(f"R2_GATE {gate} exit={rg.returncode} tail={(rg.stdout.strip().splitlines() or [''])[-1]}", flush=True)
              assert rg.returncode == 0

          # 2. Exact SHA focused 16-class suite (including isolation sentinel & all R-2 tests)
          focused = [
              "si.edt.mcp.server.support.FailureShapeTest",
              "si.edt.mcp.server.wire.jsonrpc.ToolCallResultTest",
              "si.edt.mcp.server.wire.McpRequestRouterTest",
              "si.edt.mcp.server.toolkit.ops.DiagnosticsCompletenessTest",
              "si.edt.mcp.server.wire.DiagnosticsCompletenessWireTest",
              "si.edt.mcp.server.wire.DiagnosticsCompletenessWireIsolationTest",
              "si.edt.mcp.server.TheAccessLevelMatrixFixturePreservesRuntimeStateTest",
              "si.edt.mcp.server.toolkit.ops.ProjectProblemsCapNoticeTest",
              "si.edt.mcp.server.toolkit.ops.ProjectProblemsSeverityNoticeTest",
              "si.edt.mcp.server.toolkit.ops.AReadAnswersItsMarkersAndItsRefusalTogetherTest",
              "si.edt.mcp.server.toolkit.ops.ANonArrayObjectsArgumentIsRefusedTest",
              "si.edt.mcp.server.toolkit.ops.AMarkerWithoutObjectDataDoesNotSinkTheAnswerTest",
              "si.edt.mcp.server.wire.AToolRefusalInATaskIsAResultTest",
              "si.edt.mcp.server.wire.RefusalReachesTheClientTest",
              "si.edt.mcp.server.wire.ARefusalCarriesATextBlockTest",
              "si.edt.mcp.server.toolkit.McpToolSchemaContractTest",
          ]
          rc, t, f, e, s, rows, out = run_junit(focused)
          for row in rows:
              print("  FOCUSED", row, flush=True)
          print(f"R2_EXACT_FOCUSED exit={rc} T={t} F={f} E={e} S={s}", flush=True)
          if rc != 0 or f != 0 or e != 0:
              print(out[-3000:], flush=True)
          assert rc == 0 and f == 0 and e == 0 and t >= 130

          # 3. Negative control A: disable MARKDOWN_REQUEST_FAILED in FailureShape.java
          fs = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/support/FailureShape.java"
          orig_fs = fs.read_text(encoding="utf-8")
          try:
              mut_fs = orig_fs.replace("|| head.startsWith(MARKDOWN_REQUEST_FAILED)", "/* mutated */")
              assert mut_fs != orig_fs
              fs.write_text(mut_fs, encoding="utf-8")
              nrc, nt, nf, ne, ns, _, _ = run_junit([
                  "si.edt.mcp.server.support.FailureShapeTest",
                  "si.edt.mcp.server.wire.DiagnosticsCompletenessWireTest",
              ])
              print(f"R2_NEG_CTRL_FAILURE_SHAPE exit={nrc} T={nt} F={nf} E={ne}", flush=True)
              assert nrc != 0 and (nf + ne) >= 2
          finally:
              fs.write_text(orig_fs, encoding="utf-8")

          # 4. Negative control B: swallow CoreException in collectEclipseMarkers
          ppr = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/toolkit/ops/ProjectProblemsReader.java"
          orig_ppr = ppr.read_text(encoding="utf-8")
          try:
              target = 'throw new MarkerStoreException("Could not read Eclipse markers of project \'" //$NON-NLS-1$\n                    + project.getName() + "\': " + failureText(e), e); //$NON-NLS-1$'
              assert target in orig_ppr
              ppr.write_text(orig_ppr.replace(target, "continue;"), encoding="utf-8")
              nrc, nt, nf, ne, ns, _, _ = run_junit([
                  "si.edt.mcp.server.toolkit.ops.DiagnosticsCompletenessTest",
              ])
              print(f"R2_NEG_CTRL_CORE_EXCEPTION exit={nrc} T={nt} F={nf} E={ne}", flush=True)
              assert nrc != 0 and (nf + ne) >= 1
          finally:
              ppr.write_text(orig_ppr, encoding="utf-8")

          # 5. Negative control C: swallow RuntimeException in ModuleSources.coverageEntries
          ms = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/support/modules/ModuleSources.java"
          orig_ms = ms.read_text(encoding="utf-8")
          try:
              needle = "out.add(new CoverageEntry(kind,\n                    \"Model coverage check failed for provider \" + kind //$NON-NLS-1$\n                        + \" (coverage outside the BSL index could not be verified).\", //$NON-NLS-1$\n                    true));"
              assert needle in orig_ms
              ms.write_text(orig_ms.replace(needle, "// mutated: swallowed provider failure"), encoding="utf-8")
              nrc, nt, nf, ne, ns, _, _ = run_junit([
                  "si.edt.mcp.server.toolkit.ops.DiagnosticsCompletenessTest",
              ])
              print(f"R2_NEG_CTRL_COVERAGE_FAIL exit={nrc} T={nt} F={nf} E={ne}", flush=True)
              assert nrc != 0 and (nf + ne) >= 1
          finally:
              ms.write_text(orig_ms, encoding="utf-8")

          # 6. Negative control D: drop restore of ownTools in DiagnosticsCompletenessWireTest
          wt = srv / "tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/wire/DiagnosticsCompletenessWireTest.java"
          orig_wt = wt.read_text(encoding="utf-8")
          try:
              needle = "registry.register(own);"
              assert needle in orig_wt
              wt.write_text(orig_wt.replace(needle, "// mutated: dropped own tool restore"), encoding="utf-8")
              nrc, nt, nf, ne, ns, _, _ = run_junit([
                  "si.edt.mcp.server.wire.DiagnosticsCompletenessWireIsolationTest",
              ])
              print(f"R2_NEG_CTRL_WIRE_ISOLATION exit={nrc} T={nt} F={nf} E={ne}", flush=True)
              assert nrc != 0 and (nf + ne) >= 1
          finally:
              wt.write_text(orig_wt, encoding="utf-8")

          # 7. Merge latest team base + open verified PRs (#195, #190, #192, #193, #194, #176) & run full reactor
          subprocess.run(["git", "config", "user.name", "si-mcp-agent-sim"], cwd=src, check=True)
          subprocess.run(["git", "config", "user.email", "si-mcp-agent@local.invalid"], cwd=src, check=True)
          subprocess.run([
              "git", "fetch", "-q", "origin",
              "agent/obmen-20261102:refs/heads/obmen-latest",
              "refs/pull/195/head:refs/heads/pr-195",
              "refs/pull/190/head:refs/heads/pr-190",
              "refs/pull/192/head:refs/heads/pr-192",
              "refs/pull/193/head:refs/heads/pr-193",
              "refs/pull/194/head:refs/heads/pr-194",
              "refs/pull/176/head:refs/heads/pr-176",
          ], cwd=src, check=True)
          for branch in ("obmen-latest", "pr-195", "pr-190", "pr-192", "pr-193", "pr-194", "pr-176"):
              r_m = subprocess.run(["git", "merge", "--no-edit", branch, "-m", f"sim merge {branch}"],
                                   cwd=src, capture_output=True, text=True)
              if r_m.returncode != 0:
                  st = subprocess.run(["git", "-c", "core.quotepath=false", "diff", "--name-only", "--diff-filter=U"],
                                      cwd=src, capture_output=True, text=True, check=True).stdout.strip().splitlines()
                  print(f"Merge conflict {branch}: {st}", flush=True)
                  assert st == ["server/docs-сервера/test-coverage.md"], f"Unexpected conflicts: {st}"
                  subprocess.run(["git", "checkout", "--ours", "server/docs-сервера/test-coverage.md"], cwd=src, check=True)
                  subprocess.run(["git", "add", "server/docs-сервера/test-coverage.md"], cwd=src, check=True)
                  subprocess.run(["git", "commit", "--no-edit"], cwd=src, check=True)
          subprocess.run(["python3", "scripts/test-coverage-audit.py", "--write"], cwd=srv, check=True, stdout=subprocess.DEVNULL)
          print("CUMULATIVE_HEAD=" + subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=src, text=True).strip(), flush=True)

          r_gates = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"R2_CUMULATIVE_PREBUILD_GATES exit={r_gates.returncode}", flush=True)
          print(r_gates.stdout.strip(), flush=True)
          assert r_gates.returncode == 0

          for xp in srv.rglob("TEST-*.xml"):
              xp.unlink()
          r_mvn = subprocess.run([
              "xvfb-run", "-a", "/opt/apache-maven-3.9.9/bin/mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-fae", "verify"
          ], cwd=srv, capture_output=True, text=True)
          print(f"R2_CUMULATIVE_MVN_EXIT={r_mvn.returncode}", flush=True)
          if r_mvn.returncode != 0:
              print(r_mvn.stdout[-3000:], flush=True)

          for bundle in ("si.edt.mcp.server.tests", "si.edt.mcp.oform.tests"):
              bdir = srv / "tests" / bundle / "target/surefire-reports"
              xmls = sorted(bdir.glob("TEST-*.xml")) if bdir.exists() else []
              tot = [0, 0, 0, 0]
              fails = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
                  for tc in r.findall("testcase"):
                      bad = tc.find("failure")
                      if bad is None:
                          bad = tc.find("error")
                      if bad is not None:
                          fails.append(f"{r.attrib.get('name')}#{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:180]}")
              print(f"R2_CUMULATIVE_JUNIT {bundle} xmls={len(xmls)} T={tot[0]} F={tot[1]} E={tot[2]} S={tot[3]}", flush=True)
              for f in fails:
                  print("  FAIL:", f, flush=True)
              assert tot[1] == 0 and tot[2] == 0

          r_gates2 = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"R2_CUMULATIVE_POSTBUILD_GATES exit={r_gates2.returncode}", flush=True)
          print(r_gates2.stdout.strip(), flush=True)
          assert r_gates2.returncode == 0
          assert r_mvn.returncode == 0
          print("R2_ALL_VERIFIED_0F_0E=1", flush=True)
          PY_INNER
