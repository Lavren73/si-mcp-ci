name: Agent 14 Hosted P0 R-2 Verify (d6d25e21)
on:
  push:
    branches:
      - agent/14-hosted-r2-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-r2-verify
  cancel-in-progress: true

jobs:
  r2_server_verify:
    name: "P0 R-2 (d6d25e21) + PRs #195/#194/#193/#176/#190/#192: full 0F/0E reactor + neg-ctrl"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Maven and p2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-simcp-v1
          restore-keys: |
            ${{ runner.os }}-m2-simcp-

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          if [ ! -x /opt/apache-maven-3.9.9/bin/mvn ]; then
            curl -fsSL --retry 4 --retry-delay 2 https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz               || curl -fsSL --retry 4 --retry-delay 2 https://downloads.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz               || curl -fsSL --retry 4 --retry-delay 2 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
            sudo tar -xzf /tmp/mvn.tgz -C /opt
          fi
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          /opt/apache-maven-3.9.9/bin/mvn -version

      - name: Checkout exact SHA d6d25e21eb085845f551efd4a785410e5a472d28 and inspect cumulative integration with open fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch agent/14-p0-r2-diagnostics-completeness --depth=40 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git config user.name "si-mcp-agent-sim"
          git config user.email "si-mcp-agent@local.invalid"
          git checkout -q d6d25e21eb085845f551efd4a785410e5a472d28
          echo "EXACT_R2_SHA=$(git rev-parse HEAD)"

          # First verify exact standalone R-2 focused suite + static gates on d6d25e21eb085845f551efd4a785410e5a472d28 cleanly
          python3 tools/проверка-текста.py
          python3 server/scripts/check-operation-params.py
          python3 server/scripts/check-declared-arguments-are-read.py
          python3 server/scripts/check-orphan-javadoc.py
          (cd server && python3 scripts/check-swallowed-reflection.py)
          (cd server && python3 scripts/test-coverage-audit.py --check)

          # Now also build integration tree with open green fixes (#195, #190, #192, #193, #194, #176) to verify full 0F/0E reactor
          git fetch -q origin             59ec19fe24f1f8aa4f13eb71a9cf2f31932ebcf5             88511e3ca5fa407d4fb53826e97b3418bc094ed0             1475821c8aafe6ce20d45f1ef7d860e35d2abdab             829e25bcef79276603a7681e0db5174f1a596561             647f322e1e5b89a18eda1f59124ed27f18efedf0             40028bee69f84c085eb4837b324519d774673f9b
          for pair in             "195:59ec19fe24f1f8aa4f13eb71a9cf2f31932ebcf5"             "190:88511e3ca5fa407d4fb53826e97b3418bc094ed0"             "192:1475821c8aafe6ce20d45f1ef7d860e35d2abdab"             "193:829e25bcef79276603a7681e0db5174f1a596561"             "194:647f322e1e5b89a18eda1f59124ed27f18efedf0"             "176:40028bee69f84c085eb4837b324519d774673f9b"; do
            pr="${pair%%:*}"
            sha="${pair#*:}"
            git merge --no-edit "$sha" -m "sim merge PR #$pr"
          done
          echo "CUMULATIVE_HEAD=$(git rev-parse HEAD)"

      - name: Full reactor verify + EDT API + run-gates + negative control
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          r_gates = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"R2_PREBUILD_GATES exit={r_gates.returncode}", flush=True)
          print(r_gates.stdout.strip(), flush=True)
          assert r_gates.returncode == 0

          for xp in srv.rglob("TEST-*.xml"):
              xp.unlink()

          r_mvn = subprocess.run([
              "xvfb-run", "-a", "/opt/apache-maven-3.9.9/bin/mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-fae", "verify"
          ], cwd=srv, capture_output=True, text=True)
          print(f"R2_FULL_MVN_EXIT={r_mvn.returncode}", flush=True)
          if r_mvn.returncode != 0:
              print(r_mvn.stdout[-3000:], flush=True)

          for bundle in ("si.edt.mcp.server.tests", "si.edt.mcp.oform.tests"):
              bdir = srv / "tests" / bundle / "target/surefire-reports"
              xmls = sorted(bdir.glob("TEST-*.xml")) if bdir.exists() else []
              tot = [0, 0, 0, 0]
              fails = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
                  for tc in r.findall("testcase"):
                      bad = tc.find("failure")
                      if bad is None:
                          bad = tc.find("error")
                      if bad is not None:
                          fails.append(f"{r.attrib.get('name')}#{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:180]}")
              print(f"R2_FULL_JUNIT {bundle} xmls={len(xmls)} T={tot[0]} F={tot[1]} E={tot[2]} S={tot[3]}", flush=True)
              for f in fails:
                  print("  FAIL:", f, flush=True)
              assert tot[1] == 0 and tot[2] == 0

          r_gates2 = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"R2_POSTBUILD_GATES exit={r_gates2.returncode}", flush=True)
          print(r_gates2.stdout.strip(), flush=True)
          assert r_gates2.returncode == 0
          assert r_mvn.returncode == 0

          # Negative control: break FailureShape MARKDOWN_REQUEST_FAILED check and verify focused tests catch it
          fs = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/support/FailureShape.java"
          orig_fs = fs.read_text(encoding="utf-8")
          try:
              mut_fs = orig_fs.replace("|| head.startsWith(MARKDOWN_REQUEST_FAILED)", "/* mutated */")
              assert mut_fs != orig_fs
              fs.write_text(mut_fs, encoding="utf-8")
              rep = srv / "tests/si.edt.mcp.server.tests/target/surefire-reports"
              for xp in rep.glob("TEST-*.xml"):
                  xp.unlink()
              r_neg = subprocess.run([
                  "xvfb-run", "-a", "/opt/apache-maven-3.9.9/bin/mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                  "-Dtest=si.edt.mcp.server.support.FailureShapeTest,si.edt.mcp.server.wire.DiagnosticsCompletenessWireTest",
                  "verify"
              ], cwd=srv, capture_output=True, text=True)
              nf = [0, 0]
              for xp in sorted(rep.glob("TEST-*.xml")):
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  nf[0] += int(r.attrib.get("failures", 0)) + int(r.attrib.get("errors", 0))
                  nf[1] += int(r.attrib.get("tests", 0))
              print(f"R2_NEG_CTRL_FAILURE_SHAPE exit={r_neg.returncode} T={nf[1]} F+E={nf[0]}", flush=True)
              assert r_neg.returncode != 0 and nf[0] >= 2
          finally:
              fs.write_text(orig_fs, encoding="utf-8")

          print("R2_CUMULATIVE_0F_0E_AND_NEG_CTRL_GREEN=1", flush=True)
          PY_INNER
