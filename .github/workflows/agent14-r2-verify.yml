name: Agent 14 Hosted P0 R-2 Verify (d6d25e21)
on:
  push:
    branches:
      - agent/14-hosted-r2-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-r2-verify
  cancel-in-progress: true

jobs:
  r2_server_verify:
    name: "P0 R-2 (d6d25e21): focused + full server reactor + EDT API + gates"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Maven and p2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-simcp-v1
          restore-keys: |
            ${{ runner.os }}-m2-simcp-

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          if [ ! -x /opt/apache-maven-3.9.9/bin/mvn ]; then
            curl -fsSL --retry 4 --retry-delay 2 https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz               || curl -fsSL --retry 4 --retry-delay 2 https://downloads.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz               || curl -fsSL --retry 4 --retry-delay 2 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
            sudo tar -xzf /tmp/mvn.tgz -C /opt
          fi
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          /opt/apache-maven-3.9.9/bin/mvn -version

      - name: Checkout exact SHA d6d25e21eb085845f551efd4a785410e5a472d28
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch agent/14-p0-r2-diagnostics-completeness --depth=30 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git checkout -q d6d25e21eb085845f551efd4a785410e5a472d28
          echo "VERIFIED_SHA=$(git rev-parse HEAD)"

      - name: Focused tests, full Maven reactor verify, and static/EDT-API gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          r_txt = subprocess.run(["python3", "tools/проверка-текста.py"], cwd=src, capture_output=True, text=True)
          print(f"R2_TEXT exit={r_txt.returncode} last={(r_txt.stdout.strip().splitlines() or [''])[-1]}", flush=True)
          assert r_txt.returncode == 0

          for gate in [
              "scripts/check-operation-params.py",
              "scripts/check-declared-arguments-are-read.py",
              "scripts/check-orphan-javadoc.py",
              "scripts/check-swallowed-reflection.py",
              "scripts/test-coverage-audit.py",
          ]:
              rg = subprocess.run(["python3", gate], cwd=srv, capture_output=True, text=True)
              print(f"R2_GATE {gate} exit={rg.returncode} tail={(rg.stdout.strip().splitlines() or [''])[-1]}", flush=True)
              if rg.returncode != 0:
                  print(rg.stdout, flush=True)
                  print(rg.stderr, flush=True)
              assert rg.returncode == 0

          # 1. Focused diagnostics + router + refusal suite
          focused = ",".join([
              "si.edt.mcp.server.support.FailureShapeTest",
              "si.edt.mcp.server.wire.jsonrpc.ToolCallResultTest",
              "si.edt.mcp.server.wire.McpRequestRouterTest",
              "si.edt.mcp.server.toolkit.ops.DiagnosticsCompletenessTest",
              "si.edt.mcp.server.wire.DiagnosticsCompletenessWireTest",
              "si.edt.mcp.server.toolkit.ops.ProjectProblemsCapNoticeTest",
              "si.edt.mcp.server.toolkit.ops.ProjectProblemsSeverityNoticeTest",
              "si.edt.mcp.server.toolkit.ops.AReadAnswersItsMarkersAndItsRefusalTogetherTest",
              "si.edt.mcp.server.toolkit.ops.ANonArrayObjectsArgumentIsRefusedTest",
              "si.edt.mcp.server.toolkit.ops.AMarkerWithoutObjectDataDoesNotSinkTheAnswerTest",
              "si.edt.mcp.server.wire.AToolRefusalInATaskIsAResultTest",
              "si.edt.mcp.server.wire.RefusalReachesTheClientTest",
              "si.edt.mcp.server.wire.ARefusalCarriesATextBlockTest",
              "si.edt.mcp.server.toolkit.McpToolSchemaContractTest",
          ])
          r_f = subprocess.run([
              "xvfb-run", "-a", "/opt/apache-maven-3.9.9/bin/mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              f"-Dtest={focused}", "verify"
          ], cwd=srv, capture_output=True, text=True)
          print(f"R2_FOCUSED_EXIT={r_f.returncode}", flush=True)
          if r_f.returncode != 0:
              print(r_f.stdout[-4000:], flush=True)
              print(r_f.stderr[-1500:], flush=True)
          rep = srv / "tests/si.edt.mcp.server.tests/target/surefire-reports"
          ftot = [0, 0, 0, 0]
          for xp in sorted(rep.glob("TEST-*.xml")):
              root = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
              ftot[0] += int(root.attrib.get("tests", 0))
              ftot[1] += int(root.attrib.get("failures", 0))
              ftot[2] += int(root.attrib.get("errors", 0))
              ftot[3] += int(root.attrib.get("skipped", 0))
              print(f"  FOCUSED {root.attrib.get('name')}: T={root.attrib.get('tests')} F={root.attrib.get('failures')} E={root.attrib.get('errors')} S={root.attrib.get('skipped')}", flush=True)
              for tc in root.findall("testcase"):
                  bad = tc.find("failure") or tc.find("error")
                  if bad is not None:
                      print(f"    BAD {tc.attrib.get('name')}: {(bad.text or bad.attrib.get('message',''))[:500]}", flush=True)
          print(f"R2_FOCUSED_TOTAL T={ftot[0]} F={ftot[1]} E={ftot[2]} S={ftot[3]}", flush=True)
          assert r_f.returncode == 0 and ftot[1] == 0 and ftot[2] == 0

          # 2. Full reactor verify
          for xp in srv.rglob("TEST-*.xml"):
              xp.unlink()
          r_mvn = subprocess.run([
              "xvfb-run", "-a", "/opt/apache-maven-3.9.9/bin/mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-fae", "verify"
          ], cwd=srv, capture_output=True, text=True)
          print(f"R2_FULL_MVN_EXIT={r_mvn.returncode}", flush=True)
          if r_mvn.returncode != 0:
              print(r_mvn.stdout[-4000:], flush=True)
          for bundle in ("si.edt.mcp.server.tests", "si.edt.mcp.oform.tests"):
              bdir = srv / "tests" / bundle / "target/surefire-reports"
              xmls = sorted(bdir.glob("TEST-*.xml")) if bdir.exists() else []
              tot = [0, 0, 0, 0]
              fails = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
                  for tc in r.findall("testcase"):
                      bad = tc.find("failure") or tc.find("error")
                      if bad is not None:
                          fails.append(f"{r.attrib.get('name')}#{tc.attrib.get('name')}: {(bad.attrib.get('message') or '')[:180]}")
              print(f"R2_FULL_JUNIT {bundle} xmls={len(xmls)} T={tot[0]} F={tot[1]} E={tot[2]} S={tot[3]}", flush=True)
              for f in fails:
                  print("  FAIL:", f, flush=True)
          r_edt = subprocess.run(["python3", "scripts/check-edt-api.py"], cwd=srv, capture_output=True, text=True)
          print(f"R2_EDT_API exit={r_edt.returncode} tail={(r_edt.stdout.strip().splitlines() or [''])[-1]}", flush=True)
          if r_edt.returncode != 0:
              print(r_edt.stdout, flush=True)
          assert r_mvn.returncode == 0 and r_edt.returncode == 0
          print("R2_ALL_GREEN=1", flush=True)
          PY_INNER
