name: 'Agent 13 independent diagnostics review'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: 4f1090b3c5ec304a33cdf3fd7effdf73203dbda2
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project
          fetch-depth: 3
      - name: Run synthetic behavioral checks
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = 4f1090b3c5ec304a33cdf3fd7effdf73203dbda2 ]
          [ "$(git rev-parse HEAD^)" = 65e089aad0e5dc5ee88a4bfad5e87e26116bf10a ]
          [ "$(git diff --name-only HEAD^ HEAD)" = tools/agent13_review196.py ]
          set +e
          python3 tools/agent13_review196.py
          probe_exit=$?
          python3 - <<'PY'
          import io,sys,unittest
          sys.path.insert(0,'client/tests')
          suite=unittest.defaultTestLoader.loadTestsFromName('test_partial_diagnostics_agent11')
          result=unittest.TextTestRunner(stream=io.StringIO(),verbosity=0).run(suite)
          print('AUTHOR_TESTS=%d FAILURES=%d ERRORS=%d SKIPS=%d' % (result.testsRun,len(result.failures),len(result.errors),len(result.skipped)))
          sys.exit(0 if result.wasSuccessful() and result.testsRun==8 else 1)
          PY
          author_exit=$?
          set -e
          echo "PROBE_EXIT=$probe_exit AUTHOR_EXIT=$author_exit ARTIFACTS_UPLOADED=0"
          [ "$probe_exit" -eq 0 ] && [ "$author_exit" -eq 0 ]
