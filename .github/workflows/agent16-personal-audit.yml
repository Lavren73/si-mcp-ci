name: SI16 аудит своего постоянного стенда
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Только чтение личного стенда после таймаута
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,re
          home=pathlib.Path.home();parent=home/'SI-MCP-Polygons';agent=parent/'Agent-16';root=agent/'Stand-42971555122'
          for p in (parent,agent,root):
              if p.is_symlink() or not p.is_dir():raise RuntimeError('Unsafe or missing stand path')
          if root.resolve().parent!=agent.resolve() or agent.resolve().parent!=parent.resolve():raise RuntimeError('Unexpected stand identity')
          owner=agent/'OWNER-Agent-16.txt'
          if owner.is_symlink() or not owner.is_file():raise RuntimeError('Owner marker missing')
          marker=root/'PENDING_MUTATION_DO_NOT_CLEAN'
          ib=root/'ib'/'1Cv8.1CD';project=root/'workspace'/'SI16Check42971555122'/'.project'
          print('RESULT_PERSONAL_STAND_PRESENT=true')
          print('RESULT_PENDING_MARKER_PRESENT='+str(marker.is_file() and not marker.is_symlink()).lower())
          print('RESULT_IB_FILE_NONEMPTY='+str(ib.is_file() and not ib.is_symlink() and ib.stat().st_size>0).lower())
          print('RESULT_PROJECT_FILE_PRESENT='+str(project.is_file() and not project.is_symlink()).lower())
          count=0
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdecimal() or int(p.name)==os.getpid():continue
              try:
                  cmd=(p/'cmdline').read_bytes()
                  if str(root).encode() in cmd:count+=1
              except OSError:pass
          print('RESULT_PROCESS_COMMANDLINES_CONTAINING_STAND='+str(count))
          # Process argument scanning and .launch-file existence cannot prove association outcome.
          for p in (root/'edt.log',root/'workspace/.metadata/.log'):
              if not p.is_file() or p.is_symlink():continue
              text=p.read_text(encoding='utf8',errors='replace')
              for k,pat in {'AUTH_FAIL':r'auth fail|authenticationexception|jschexception', 'LICENSE_NOT_FOUND':r'license not found|лицензия не найдена','CONFIG_LOCK':r'configuration.{0,40}(?:locked|lock)|конфигурац.{0,40}блокир'}.items():
                  print('RESULT_LOG_'+k+'='+str(bool(re.search(pat,text,re.I))).lower())
          print('RESULT_READ_ONLY=true')
          print('RESULT_BINDING_OUTCOME=unknown')
          PY
