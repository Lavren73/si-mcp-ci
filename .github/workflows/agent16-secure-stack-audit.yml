name: SI16 диагностика стека запуска keyring
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Прочитать имена кадров стека в собственных журналах
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re
          home=pathlib.Path.home();agent=home/'SI-MCP-Polygons/Agent-16'
          for p in (home/'SI-MCP-Polygons',agent):
              if not p.is_dir() or p.is_symlink() or p.stat().st_uid!=os.getuid():raise RuntimeError('Unsafe agent root')
          for n in ('ReadyProbe-42995543775','CliSecureProbe-42996249678'):
              root=agent/n
              if not root.is_dir() or root.is_symlink() or root.stat().st_uid!=os.getuid():raise RuntimeError('Unsafe stand')
              log=root/'workspace/.metadata/.log'
              text=log.read_text(encoding='utf8',errors='replace')
              lines=text.splitlines();print('RESULT_STAND='+n)
              indexes=[i for i,x in enumerate(lines) if x.strip()=='java.lang.UnsupportedOperationException']
              print('RESULT_EXCEPTION_COUNT='+str(len(indexes)))
              if indexes:
                  for line in lines[indexes[-1]+1:indexes[-1]+35]:
                      m=re.search(r'\bat\s+([\w.$]+)\(([\w.$-]+:\d+)\)',line)
                      if not m:break
                      print('RESULT_STACK_FRAME='+m.group(1)+'('+m.group(2)+')')
          print('RESULT_NO_EDT_OR_INFOBASE_OPERATION=true')
          PY
