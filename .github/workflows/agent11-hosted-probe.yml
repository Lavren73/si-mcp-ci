name: '№13 — watcher local origin control'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: 9f4927c7b4790fd6f2c21a816db1549ae24d21ae
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project
          fetch-depth: 1
      - name: Probe swapped origin without network
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = 9f4927c7b4790fd6f2c21a816db1549ae24d21ae ] || exit 1
          python3 - <<'PY'
          import contextlib,importlib.util,io,pathlib,subprocess,tempfile
          p=pathlib.Path('server/scripts/tests/test_watcher_repo.py')
          spec=importlib.util.spec_from_file_location('watcher_fixture',p)
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          c=m.Наблюдатель
          try:
              c.setUpClass()
              before=c.н.проверить_клон(str(c.клон),c.ветка) is None
              with tempfile.TemporaryDirectory(prefix='si13-other-origin-') as d:
                  foreign=pathlib.Path(d)/'other.git'
                  subprocess.run(['git','-c','init.templateDir=','init','--bare','-q',str(foreign)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  subprocess.run(['git','-C',str(c.клон),'remote','set-url','origin',str(foreign)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  swapped=c.н.проверить_клон(str(c.клон),c.ветка) is None
                  missing_ref=subprocess.run(['git','-C',str(foreign),'show-ref','--verify','--quiet','refs/heads/'+c.ветка]).returncode != 0
                  local_ref=subprocess.run(['git','-C',str(c.клон),'show-ref','--verify','--quiet','refs/remotes/origin/'+c.ветка]).returncode == 0
                  old=subprocess.check_output(['git','-C',str(c.клон),'rev-parse','refs/remotes/origin/'+c.ветка],text=True).strip()
                  buf=io.StringIO()
                  with contextlib.redirect_stdout(buf):
                      after,rc=c.н.один_проход(str(c.клон),c.ветка,old)
                  unchanged_success=(after==old and rc==0 and 'no new commits' in buf.getvalue())
                  print('EMPTY_FOREIGN_FETCH_REPORTS_NO_NEW_COMMITS='+str(int(unchanged_success)))
                  print('ORIGINAL_ACCEPTED='+str(int(before)))
                  print('FOREIGN_EMPTY_REMOTE_WITH_STALE_REF_ACCEPTED='+str(int(swapped)))
                  print('FOREIGN_REF_ABSENT='+str(int(missing_ref)))
                  print('LOCAL_TRACKING_REF_PRESENT='+str(int(local_ref)))
                  print('ARTIFACTS_UPLOADED=0')
                  if not (before and swapped and missing_ref and local_ref and unchanged_success): raise SystemExit(1)
          finally:
              c.doClassCleanups()
          PY
