name: 'Agent 13 independent P0 retry and registry'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, setup_failure, interrupt_negative]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Checkout isolated test scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: harness
      - name: Checkout exact server candidate
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: e1051751fd0e1afe9d89ea40e38ffe54e12e5e36
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project
          fetch-depth: 1
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install hosted dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/setup.log" 2>&1
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >> "$RUNNER_TEMP/setup.log" 2>&1
          curl --retry 3 -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o "$RUNNER_TEMP/maven.tar.gz"
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo 'SETUP_OK=1'
      - name: Exact source, synthetic exception injection or negative control, focused OSGi
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          [ "$(git -C project rev-parse HEAD)" = e1051751fd0e1afe9d89ea40e38ffe54e12e5e36 ]
          echo SOURCE_SHA=e1051751fd0e1afe9d89ea40e38ffe54e12e5e36
          cp harness/agent13-review/Agent13Pr197IsolationSentinelTest.java project/server/tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/wire/
          cp harness/agent13-review/Agent13InterruptedBaselineTest.java project/server/tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/toolkit/ops/
          python3 harness/agent13-review/mutate_interrupt.py "$MODE"
          prop=false; if [ "$MODE" = setup_failure ]; then prop=true; fi
          set +e
          (cd project/server && xvfb-run -a "$RUNNER_TEMP/apache-maven-3.9.9/bin/mvn" -B -fae -ntp -pl targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests -am '-Dtest=DiagnosticsCompletenessTest,Agent13Pr197IsolationSentinelTest,TheEmptyFirstReadIsRetriedTest,Agent13InterruptedBaselineTest' "-Dagent13.setupFailure=$prop" verify > "$RUNNER_TEMP/private-maven.log" 2>&1)
          rc=$?
          set -e
          python3 harness/agent13-review/check_interrupt.py "$MODE" "$rc"
