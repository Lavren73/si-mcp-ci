name: Agent 14 Hosted Integration & Z02 Verify
on:
  push:
    branches:
      - agent/14-hosted-full-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-verify
  cancel-in-progress: true

jobs:
  int_9ae7f9ca_full_fae:
    name: "INT: Exact 9ae7f9ca -fae (13 modules + jar SnakeYAML + gates)"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Fetch exact integration SHA 9ae7f9ca375744c3fb5717cfd563594853c3043d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q src
          git -C src remote add origin git@github.com:Lavren73/SI-MCP.git
          git -C src fetch -q --depth=1 origin 9ae7f9ca375744c3fb5717cfd563594853c3043d
          git -C src checkout -q FETCH_HEAD
          echo "INT_SHA=$(git -C src rev-parse HEAD)"

      - name: Setup JDK 17 & Python
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Maven 3.9.9, Xvfb & pytest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          python3 -m pip install -q pytest

      - name: Run full -fae verify, jar SnakeYAML test, and gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          r_txt = subprocess.run(["python3", "tools/проверка-текста.py"], cwd=src, capture_output=True, text=True)
          print(f"INT_TEXT_GATE exit={r_txt.returncode}", flush=True)

          r_gates = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"INT_SERVER_GATES exit={r_gates.returncode}", flush=True)
          print(r_gates.stdout.strip(), flush=True)
          if r_gates.stderr.strip():
              print(r_gates.stderr.strip(), flush=True)

          r_mvn = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never", "-fae", "verify"
          ], cwd=srv, capture_output=True, text=True)
          print(f"INT_MVN_FAE exit={r_mvn.returncode}", flush=True)
          for ln in (r_mvn.stdout + "\n" + r_mvn.stderr).splitlines():
              if any(k in ln for k in ("[INFO] SI-EDT", "[INFO] Building ", "[ERROR] ", "Reactor Summary", "Total time:")):
                  print("MVN:", ln, flush=True)

          for mod in ("si.edt.mcp.server.tests", "si.edt.mcp.oform.tests"):
              mdir = srv / "tests" / mod / "target/surefire-reports"
              xmls = sorted(mdir.glob("TEST-*.xml")) if mdir.is_dir() else []
              tot = [0, 0, 0, 0]
              fails = []
              for xp in xmls:
                  root = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(root.attrib.get("tests", 0))
                  tot[1] += int(root.attrib.get("failures", 0))
                  tot[2] += int(root.attrib.get("errors", 0))
                  tot[3] += int(root.attrib.get("skipped", 0))
                  for tc in root.findall("testcase"):
                      for tag in ("failure", "error"):
                          el = tc.find(tag)
                          if el is not None:
                              fails.append(f"{tc.attrib.get('classname')}.{tc.attrib.get('name')}[{tag[0].upper()}]")
              print(f"MOD {mod}: xmls={len(xmls)} tests={tot[0]} F={tot[1]} E={tot[2]} S={tot[3]}", flush=True)
              for fn in sorted(fails):
                  print(f"  RED: {fn}", flush=True)

          # Locate built bundle JAR & feature/p2 JAR
          jars = sorted([
              p for p in srv.rglob("si.edt.mcp.server_*.jar")
              if not p.name.endswith("-sources.jar") and "tests" not in p.name
          ]) + sorted([
              p for p in (srv / "bundles/si.edt.mcp.server/target").glob("si.edt.mcp.server-*.jar")
              if not p.name.endswith("-sources.jar")
          ])
          print(f"BUILT_JARS={len(jars)}", flush=True)
          for j in jars:
              print(f"  JAR: {j}", flush=True)
              rj = subprocess.run(["python3", "tools/проверка-snakeyaml.py", str(j)], cwd=src, capture_output=True, text=True)
              print(f"  SNAKEYAML_TOOL({j.name}) exit={rj.returncode}: {rj.stdout.strip()}", flush=True)
              assert rj.returncode == 0
              env = dict(**__import__("os").environ, SI_EDT_PLUGIN_JAR=str(j.resolve()))
              rp = subprocess.run(["python3", "-m", "pytest", "-v", "tests/test_snakeyaml_v_feature.py"], cwd=src / "client", env=env, capture_output=True, text=True)
              print(f"  PYTEST_SNAKEYAML({j.name}) exit={rp.returncode}\n{rp.stdout.strip()}", flush=True)
              assert rp.returncode == 0

          assert len(jars) >= 1
          print("INT_SUMMARY=DONE ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER

  z02_be50766_verify:
    name: "Z02: Rebased be507661 OSGi (matrix + Z02 settings group + mutation)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Fetch exact Z02 SHA be507661db35990ec40ab0f105bd045f0ff08d02
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q src
          git -C src remote add origin git@github.com:Lavren73/SI-MCP.git
          git -C src fetch -q --depth=1 origin be507661db35990ec40ab0f105bd045f0ff08d02
          git -C src checkout -q FETCH_HEAD
          echo "Z02_SHA=$(git -C src rev-parse HEAD)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Run Python matrix gate, focused JUnit, Z02 settings group, and mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          def parse_xmls(root):
              xmls = sorted(root.rglob("TEST-*.xml"))
              tot = [0, 0, 0, 0]
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
              return len(xmls), tot

          def clean_xmls(root):
              for xp in root.rglob("TEST-*.xml"):
                  xp.unlink()

          r_mat = subprocess.run(["python3", "tools/проверить-матрицу-прав.py"], cwd=src, capture_output=True, text=True)
          print(f"Z02_PY_MATRIX exit={r_mat.returncode}\n{r_mat.stdout.strip()}", flush=True)
          assert r_mat.returncode == 0
          r_txt = subprocess.run(["python3", "tools/проверка-текста.py"], cwd=src, capture_output=True, text=True)
          print(f"Z02_PY_TEXT exit={r_txt.returncode}", flush=True)
          assert r_txt.returncode == 0

          clean_xmls(srv)
          r_foc = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              "-Dtest=TheAccessLevelMatrixMatchesTheCatalogueTest", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xf, tf = parse_xmls(srv)
          print(f"Z02_FOCUSED exit={r_foc.returncode} xmls={xf} tests={tf[0]} F={tf[1]} E={tf[2]} S={tf[3]}", flush=True)
          assert r_foc.returncode == 0 and tf[0] == 2 and tf[1:] == [0, 0, 0]

          clean_xmls(srv)
          group = ",".join([
              "TheAccessLevelMatrixMatchesTheCatalogueTest",
              "ToolAccessLevelTest",
              "ToolCategoryTest",
              "ToolProfileTest",
              "ToolSettingsStoreTest",
              "K12AccessLevelRegressionTest",
              "K13LegacyPresetRegressionTest",
              "TheCatalogueSaysWhatAToolMayChangeTest",
              "ReadOnlyClosesTheDoorAndKeepsTheChoiceTest",
              "TheWriteGateIsAnsweredByThePolicyNotTheLabelTest",
          ])
          r_grp = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              f"-Dtest={group}", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xg, tg = parse_xmls(srv)
          print(f"Z02_GROUP exit={r_grp.returncode} xmls={xg} tests={tg[0]} F={tg[1]} E={tg[2]} S={tg[3]}", flush=True)
          assert r_grp.returncode == 0 and tg[0] > 20 and tg[1:] == [0, 0, 0]

          tsv = srv / "tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/access-level-matrix.tsv"
          orig = tsv.read_text(encoding="utf-8")
          old_row = "read_module_source\tCODE\topen\topen\topen\tlisted\ttrue\ttrue\tfalse\t-"
          new_row = "read_module_source\tCODE\topen\topen\topen\tlisted\tfalse\ttrue\tfalse\t-"
          assert old_row in orig
          tsv.write_text(orig.replace(old_row, new_row, 1), encoding="utf-8")
          try:
              clean_xmls(srv)
              r_mut = subprocess.run([
                  "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                  "-Dtest=TheAccessLevelMatrixMatchesTheCatalogueTest", "verify"
              ], cwd=srv, capture_output=True, text=True)
              xm, tm = parse_xmls(srv)
              print(f"Z02_MUTATION exit={r_mut.returncode} xmls={xm} tests={tm[0]} F={tm[1]} E={tm[2]} S={tm[3]}", flush=True)
              assert r_mut.returncode != 0 and (tm[1] + tm[2]) >= 1
          finally:
              tsv.write_text(orig, encoding="utf-8")

          print("Z02_SUMMARY=ALL_GREEN_AND_MUTATION_KILLED ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER
