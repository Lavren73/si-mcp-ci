name: Agent 14 Hosted Verify PR193 + Z03
on:
  push:
    branches:
      - agent/14-hosted-full-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-verify
  cancel-in-progress: true

jobs:
  pr193_verify:
    name: "PR193: Causal contrast (a4e93e6f vs 829e25bc) + DCS suite + mutation"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Fetch SI-MCP base a4e93e6f02 & PR193 829e25bcef
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q src
          git -C src remote add origin git@github.com:Lavren73/SI-MCP.git
          git -C src fetch -q --depth=1 origin a4e93e6f027e04b8067ace1ec85d31e5df1a3e2e 829e25bcef79276603a7681e0db5174f1a596561

      - name: Run causal contrast, PR193 DCS suite, and DcsWorkshopTool mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          def parse_xmls(root):
              xmls = sorted(root.rglob("TEST-*.xml"))
              tot = [0, 0, 0, 0]
              details = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  t = int(r.attrib.get("tests", 0))
                  f = int(r.attrib.get("failures", 0))
                  e = int(r.attrib.get("errors", 0))
                  s = int(r.attrib.get("skipped", 0))
                  tot[0] += t; tot[1] += f; tot[2] += e; tot[3] += s
                  for tc in r.findall("testcase"):
                      bad = tc.find("failure") or tc.find("error")
                      if bad is not None:
                          details.append(f"{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:140]}")
              return len(xmls), tot, details

          def clean_xmls(root):
              for xp in root.rglob("TEST-*.xml"):
                  xp.unlink()

          # 1. Base a4e93e6f02 causal contrast
          subprocess.run(["git", "checkout", "-q", "-f", "a4e93e6f027e04b8067ace1ec85d31e5df1a3e2e"], cwd=src, check=True)
          clean_xmls(srv)
          r_base = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              "-Dtest=ASchemaHoldsSchemasInsideItTest", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xb, tb, db = parse_xmls(srv)
          print(f"PR193_BASE_CONTRAST exit={r_base.returncode} xmls={xb} tests={tb[0]} F={tb[1]} E={tb[2]} S={tb[3]}", flush=True)
          for line in db:
              print("  BASE_FAIL:", line, flush=True)
          assert r_base.returncode != 0 and (tb[1] + tb[2]) == 3, f"expected 3 causal failures on base, got {tb}"

          # 2. Head 829e25bcef ASchemaHoldsSchemasInsideItTest + full DCS/schema group
          subprocess.run(["git", "checkout", "-q", "-f", "829e25bcef79276603a7681e0db5174f1a596561"], cwd=src, check=True)
          dcs_group = ",".join([
              "ADcsSearchReadsTheWholeSchemaTest",
              "ASchemaHoldsSchemasInsideItTest",
              "ASchemaNamesItsTemplatesTest",
              "ASchemaParameterIsTypedWithItsQualifiersTest",
              "ASchemaParameterTakesItsOptionalFieldsTest",
              "ASchemaTemplateIsNotMadeEmptyTest",
              "DcsSettingsImpactTest",
              "SettingsTableTakesTheSchemaResourcesTest",
          ])
          clean_xmls(srv)
          r_head = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              f"-Dtest={dcs_group}", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xh, th, dh = parse_xmls(srv)
          print(f"PR193_HEAD_DCS_GROUP exit={r_head.returncode} xmls={xh} tests={th[0]} F={th[1]} E={th[2]} S={th[3]}", flush=True)
          for line in dh:
              print("  HEAD_FAIL:", line, flush=True)
          assert r_head.returncode == 0 and xh == 8 and th[1:] == [0, 0, 0]

          # Check exact test count of ASchemaHoldsSchemasInsideItTest
          schema_xml = list(srv.rglob("TEST-*ASchemaHoldsSchemasInsideItTest.xml"))
          assert len(schema_xml) == 1
          sr = ET.fromstring(schema_xml[0].read_text(encoding="utf-8", errors="replace"))
          print(f"PR193_SCHEMA_TEST_ONLY tests={sr.attrib.get('tests')} F={sr.attrib.get('failures')} E={sr.attrib.get('errors')} S={sr.attrib.get('skipped')}", flush=True)
          assert int(sr.attrib.get("tests", 0)) >= 33

          # 3. Mutation: remove dataset dot guard in DcsWorkshopTool.doAddDataSet
          dcs_tool = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/toolkit/ops/DcsWorkshopTool.java"
          orig = dcs_tool.read_text(encoding="utf-8")
          needle = 'mustNotLookLikeAPath(name, "dataset"); //$NON-NLS-1$'
          assert needle in orig
          dcs_tool.write_text(orig.replace(needle, "// MUTATED: " + needle, 1), encoding="utf-8")
          try:
              clean_xmls(srv)
              r_mut = subprocess.run([
                  "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                  "-Dtest=ASchemaHoldsSchemasInsideItTest", "verify"
              ], cwd=srv, capture_output=True, text=True)
              xm, tm, dm = parse_xmls(srv)
              print(f"PR193_MUTATION exit={r_mut.returncode} xmls={xm} tests={tm[0]} F={tm[1]} E={tm[2]} S={tm[3]}", flush=True)
              for line in dm:
                  print("  MUT_FAIL:", line, flush=True)
              assert r_mut.returncode != 0 and (tm[1] + tm[2]) >= 1
          finally:
              dcs_tool.write_text(orig, encoding="utf-8")

          print("PR193_SUMMARY=CAUSAL_3_RED_ON_BASE_HEAD_GREEN_MUTATION_KILLED ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER

  z03_verify:
    name: "Z03: Exact 371ce1ce OSGi (54 settings tests + legacy preservation + mutations)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Fetch exact Z03 SHA 371ce1ce1d77c13949b9b19b858da990cf0fe97e
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q src
          git -C src remote add origin git@github.com:Lavren73/SI-MCP.git
          git -C src fetch -q --depth=1 origin 371ce1ce1d77c13949b9b19b858da990cf0fe97e
          git -C src checkout -q FETCH_HEAD
          echo "Z03_SHA=$(git -C src rev-parse HEAD)"

      - name: Run gates, full 54-class settings OSGi suite, and ToolsPrefTab mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          def parse_xmls(root):
              xmls = sorted(root.rglob("TEST-*.xml"))
              tot = [0, 0, 0, 0]
              details = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
                  for tc in r.findall("testcase"):
                      bad = tc.find("failure") or tc.find("error")
                      if bad is not None:
                          details.append(f"{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:140]}")
              return len(xmls), tot, details

          def clean_xmls(root):
              for xp in root.rglob("TEST-*.xml"):
                  xp.unlink()

          r_txt = subprocess.run(["python3", "tools/проверка-текста.py"], cwd=src, capture_output=True, text=True)
          print(f"Z03_PY_TEXT exit={r_txt.returncode}", flush=True)
          assert r_txt.returncode == 0

          r_gates = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"Z03_SERVER_GATES exit={r_gates.returncode}\n{r_gates.stdout.strip()}", flush=True)
          assert r_gates.returncode == 0

          # Run all *Test classes in si.edt.mcp.server.settings
          settings_dir = srv / "tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/settings"
          all_classes = sorted(p.stem for p in settings_dir.glob("*Test.java"))
          print(f"Z03_SETTINGS_CLASS_COUNT={len(all_classes)}", flush=True)

          clean_xmls(srv)
          r_all = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              f"-Dtest={','.join(all_classes)}", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xa, ta, da = parse_xmls(srv)
          print(f"Z03_SETTINGS_FULL exit={r_all.returncode} xmls={xa} tests={ta[0]} F={ta[1]} E={ta[2]} S={ta[3]}", flush=True)
          for line in da:
              print("  FULL_FAIL:", line, flush=True)
          if r_all.returncode != 0:
              print("=== MVN TAIL ===")
              print("\n".join(r_all.stdout.splitlines()[-80:]))
          assert r_all.returncode == 0 and xa == len(all_classes) and ta[1:] == [0, 0, 0]

          # Mutation 1: strip unlisted mark suffix in ToolsPrefTab
          tab_file = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/settings/ToolsPrefTab.java"
          orig = tab_file.read_text(encoding="utf-8")
          needle_mark = 'return " — скрыт из списка, но вызывается";'
          assert needle_mark in orig
          tab_file.write_text(orig.replace(needle_mark, 'return ""; // MUTATED', 1), encoding="utf-8")
          try:
              clean_xmls(srv)
              r_m1 = subprocess.run([
                  "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                  "-Dtest=APresetChangeRepaintsTheHiddenMarksTest,RestoringToolDefaultsGivesTheShippedPresetTest",
                  "verify"
              ], cwd=srv, capture_output=True, text=True)
              xm1, tm1, dm1 = parse_xmls(srv)
              print(f"Z03_MUTATION_UNLISTED_MARK exit={r_m1.returncode} xmls={xm1} tests={tm1[0]} F={tm1[1]} E={tm1[2]} S={tm1[3]}", flush=True)
              for line in dm1:
                  print("  M1_FAIL:", line, flush=True)
              assert r_m1.returncode != 0 and (tm1[1] + tm1[2]) >= 2
          finally:
              tab_file.write_text(orig, encoding="utf-8")

          # Mutation 2: drop reconcileDoor in applyKeptSet
          needle_door = "AgentRightsMode.reconcileDoor(disabledTools, rightsMode);"
          assert orig.count(needle_door) >= 2
          tab_file.write_text(orig.replace(needle_door, "// MUTATED: " + needle_door), encoding="utf-8")
          try:
              clean_xmls(srv)
              r_m2 = subprocess.run([
                  "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                  "-Dtest=AKeptSetOutlivesThePresetChangeTest",
                  "verify"
              ], cwd=srv, capture_output=True, text=True)
              xm2, tm2, dm2 = parse_xmls(srv)
              print(f"Z03_MUTATION_KEPT_DOOR exit={r_m2.returncode} xmls={xm2} tests={tm2[0]} F={tm2[1]} E={tm2[2]} S={tm2[3]}", flush=True)
              for line in dm2:
                  print("  M2_FAIL:", line, flush=True)
              assert r_m2.returncode != 0 and (tm2[1] + tm2[2]) >= 1
          finally:
              tab_file.write_text(orig, encoding="utf-8")

          print("Z03_SUMMARY=ALL_54_SETTINGS_GREEN_AND_BOTH_MUTATIONS_KILLED ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER
