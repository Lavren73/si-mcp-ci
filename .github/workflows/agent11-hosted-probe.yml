          print('ARTIFACTS_UPLOADED=0', flush=True)
          oform_files = list((srv / 'tests/si.edt.mcp.oform.tests').glob('**/surefire-reports/TEST-*.xml'))
          oform_bad = sum(int(ET.parse(p).getroot().get('failures','0')) + int(ET.parse(p).getroot().get('errors','0')) for p in oform_files)
          if rs.returncode not in (0, 2) or not oform_files or oform_bad > 0 or fail:
