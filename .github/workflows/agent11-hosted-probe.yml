name: Agent 14 Hosted PR176 Verify
on:
  push:
    branches:
      - agent/14-hosted-full-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-verify
  cancel-in-progress: true

jobs:
  pr176_sweep_and_mutation:
    name: "PR176: Exact 40028bee OSGi (23 + 139 + guard mutation)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Fetch exact PR #176 SHA 40028bee69f84c085eb4837b324519d774673f9b
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q src
          git -C src remote add origin git@github.com:Lavren73/SI-MCP.git
          git -C src fetch -q --depth=1 origin 40028bee69f84c085eb4837b324519d774673f9b
          git -C src checkout -q FETCH_HEAD
          echo "PR176_SHA=$(git -C src rev-parse HEAD)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Run probe, 23 focused, 139 group, and guard mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          def parse_xmls(root):
              xmls = sorted(root.rglob("TEST-*.xml"))
              tot = [0, 0, 0, 0]
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
              return len(xmls), tot

          def clean_xmls(root):
              for xp in root.rglob("TEST-*.xml"):
                  xp.unlink()

          r_probe = subprocess.run(["python3", "tools/З-04-schedule-probe-13.py", "."], cwd=src, capture_output=True, text=True)
          print(f"PR176_PROBE exit={r_probe.returncode}", flush=True)
          assert r_probe.returncode == 0

          # 1. Focused 23
          clean_xmls(srv)
          r23 = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              "-Dtest=ReleaseSweepTest,ReleaseSweepFailClosedRegressionTest", "verify"
          ], cwd=srv, capture_output=True, text=True)
          x23, t23 = parse_xmls(srv)
          print(f"PR176_FOCUSED23 exit={r23.returncode} xmls={x23} tests={t23[0]} F={t23[1]} E={t23[2]} S={t23[3]}", flush=True)
          assert r23.returncode == 0 and t23[0] == 23 and t23[1:] == [0, 0, 0]

          # 2. Group 139
          clean_xmls(srv)
          r139 = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              "-Dtest=*Sweep*Test,*Upkeep*Test,*Release*Test", "verify"
          ], cwd=srv, capture_output=True, text=True)
          x139, t139 = parse_xmls(srv)
          print(f"PR176_GROUP139 exit={r139.returncode} xmls={x139} tests={t139[0]} F={t139[1]} E={t139[2]} S={t139[3]}", flush=True)
          assert r139.returncode == 0 and t139[0] >= 139 and t139[1:] == [0, 0, 0]

          # 3. Guard mutation control on ReleaseSweep.java
          rs = src / "server/bundles/si.edt.mcp.server/src/si/edt/mcp/server/upkeep/ReleaseSweep.java"
          orig = rs.read_text(encoding="utf-8")
          old = "if (store == null || !PrefKeys.UPDATES_FROM_NETWORK)"
          new = "if (store == null)"
          assert old in orig
          rs.write_text(orig.replace(old, new, 1), encoding="utf-8")
          try:
              clean_xmls(srv)
              rmut = subprocess.run([
                  "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                  "-Dtest=ReleaseSweepTest,ReleaseSweepFailClosedRegressionTest", "verify"
              ], cwd=srv, capture_output=True, text=True)
              xmut, tmut = parse_xmls(srv)
              print(f"PR176_MUTATION exit={rmut.returncode} xmls={xmut} tests={tmut[0]} F={tmut[1]} E={tmut[2]} S={tmut[3]}", flush=True)
              assert rmut.returncode != 0 and (tmut[1] + tmut[2]) >= 2
          finally:
              rs.write_text(orig, encoding="utf-8")

          print("PR176_SUMMARY=ALL_GREEN_AND_MUTATION_KILLED ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER
