name: '№14 — full default verify + oform coordinate & run-gates'
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact SI-MCP SHA to verify'
        required: true
        default: '8eebaa355da257a408fb509b87090f9a02c33f66'

permissions:
  contents: read

jobs:
  full-default-and-coords:
    name: 'Maven verify -fae (13 modules) + oform fail coords + run-gates.sh + snakeyaml --jar'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TARGET_SHA: ${{ inputs.sha }}
    steps:
      - name: Checkout SI-MCP branch without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: agent/obmen-20261102
          fetch-depth: 30
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project

      - name: Pin exact target SHA
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q --detach "$TARGET_SHA"
          ACTUAL=$(git rev-parse HEAD)
          echo "TARGET_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$ACTUAL"
          test "$ACTUAL" = "$TARGET_SHA"

      - name: Install Xvfb & GTK3
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven 3.9.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          rm -f /tmp/mvn.tgz
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Setup Python venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check 'pytest==9.0.3' 'pytest-subtests==0.14.2'

      - name: Run full mvn -fae + numeric coordinates + run-gates.sh + snakeyaml --jar
        shell: bash
        env:
          MAVEN_OPTS: -Xmx3g -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          export VENV_PY="$RUNNER_TEMP/venv/bin/python"
          "$VENV_PY" - <<'PY'
          import importlib.util, os, pathlib, subprocess, sys, xml.etree.ElementTree as ET, zipfile

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'project'
          srv = root / 'server'
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          py = os.environ['VENV_PY']

          mvn_log = tmp / 'mvn-full.log'
          with mvn_log.open('wb') as f:
              r = subprocess.run(
                  ['xvfb-run', '-a', 'mvn', '-B', '-fae', '-ntp', '-Dstyle.color=never', 'verify'],
                  cwd=srv, stdout=f, stderr=subprocess.STDOUT, timeout=2400,
              )
          print(f'MVN_FULL_EXIT={r.returncode}', flush=True)

          # Report per-module XML totals + numeric coordinates of ANY failures/errors (zero private names/messages printed!)
          for mod in ('si.edt.mcp.server.tests', 'si.edt.mcp.oform.tests'):
              test_javas = sorted((srv / 'tests' / mod / 'src').rglob('*Test.java'))
              xml_files = sorted((srv / 'tests' / mod).glob('**/surefire-reports/TEST-*.xml'))
              tot = [0, 0, 0, 0]
              coords = []
              for xidx, xp in enumerate(xml_files):
                  x = ET.parse(xp).getroot()
                  tot = [a + int(x.get(k, '0')) for a, k in zip(tot, ('tests', 'failures', 'errors', 'skipped'))]
                  cls_stem = xp.stem.replace('TEST-', '').rsplit('.', 1)[-1]
                  java_idx = next((i for i, p in enumerate(test_javas) if p.stem == cls_stem), -1)
                  for tc_idx, tc in enumerate(x.findall('testcase')):
                      bad = tc.find('failure') or tc.find('error')
                      if bad is not None:
                          text = bad.text or ''
                          line_nums = []
                          for ln in text.splitlines():
                              if cls_stem + '.java:' in ln:
                                  line_nums.append(ln.split('.java:', 1)[1].split(')', 1)[0])
                          kind = 'F' if tc.find('failure') is not None else 'E'
                          exc_short = (bad.attrib.get('type', '') or '').rsplit('.', 1)[-1]
                          coords.append(f'({xidx},{java_idx},{tc_idx},{kind},{exc_short},{line_nums[:2]})')
              print(f'MOD {mod} javas={len(test_javas)} xmls={len(xml_files)} tests={tot[0]} F={tot[1]} E={tot[2]} S={tot[3]}', flush=True)
              if coords:
                  print(f'COORDS {mod}: ' + ' ; '.join(coords), flush=True)

          # Compare server.tests log indices against эталон-красных-2026-11-07.txt (numeric indices only!)
          spec = importlib.util.spec_from_file_location('sk', srv / 'scripts/сторож-красных.py')
          sk = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(sk)
          etalon_path = root / 'docs/отчёты-проверок/эталон-красных-2026-11-07.txt'
          etalon_lines = [l.strip() for l in etalon_path.read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#')]
          etalon_keys = [l.split(' | ', 1)[0] for l in etalon_lines]
          log_items, total_runs = sk.разобрать_текст(mvn_log.read_text(encoding='utf-8', errors='replace'))
          log_keys = {it.split(' | ', 1)[0] for it in log_items}
          kept_idx = [i for i, k in enumerate(etalon_keys) if k in log_keys]
          gone_idx = [i for i, k in enumerate(etalon_keys) if k not in log_keys]
          extra_count = len(log_keys - set(etalon_keys))
          print(f'ETALON_COMPARE total_log={len(log_keys)} etalon={len(etalon_keys)} kept={len(kept_idx)} gone={len(gone_idx)} extra={extra_count} max_suite={total_runs}', flush=True)
          print(f'ETALON_KEPT_INDICES={kept_idx}', flush=True)
          print(f'ETALON_GONE_INDICES={gone_idx}', flush=True)

          # Official run-gates.sh (non-verbose)
          rg = subprocess.run(['bash', 'scripts/run-gates.sh'], cwd=srv, capture_output=True, text=True)
          print(f'RUN_GATES_SH_EXIT={rg.returncode}', flush=True)
          for ln in rg.stdout.splitlines():
              if 'проверок по существу:' in ln:
                  print('  RUN_GATES_SUMMARY:', ln.strip(), flush=True)

          # SnakeYAML --jar on repository jar
          repo_jars = list((srv / 'repositories/si.edt.mcp.server.repository/target/repository/plugins').glob('si.edt.mcp.server_*.jar'))
          if repo_jars:
              jp = repo_jars[0]
              sy = subprocess.run([py, 'tools/проверка-snakeyaml.py', '--jar', str(jp)], cwd=root, capture_output=True, text=True)
              print(f'SNAKEYAML_JAR_EXIT={sy.returncode}', flush=True)

          print('ARTIFACTS_UPLOADED=0', flush=True)
          PY
