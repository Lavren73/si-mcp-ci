name: '№14 — full hosted verification (fast + default 13-mod + edt-2026.2 13-mod)'
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact SI-MCP SHA to verify'
        required: true
        default: '8eebaa355da257a408fb509b87090f9a02c33f66'

permissions:
  contents: read

jobs:
  fast-client-scripts:
    name: 'Fast gates, client, benchmarks, delivery, PowerShell & server scripts'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: '1'
      TARGET_SHA: ${{ inputs.sha }}
    steps:
      - name: Checkout SI-MCP branch without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: agent/obmen-20261102
          fetch-depth: 30
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project

      - name: Pin exact target SHA
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q --detach "$TARGET_SHA"
          ACTUAL=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          echo "TARGET_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$ACTUAL"
          echo "HEAD_TREE=$TREE"
          test "$ACTUAL" = "$TARGET_SHA"

      - name: Prepare Python 3.12 test venv
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          pwsh --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check \
            'pytest==9.0.3' 'pytest-subtests==0.14.2' 'jsonschema==4.25.1' 'PyYAML==6.0.3' \
            > "$RUNNER_TEMP/pip.log" 2>&1
          echo "PYTHON_SETUP_OK=1"

      - name: Run full offline gates, installer, delivery, benchmarks, PowerShell & server scripts (sanitized stdout)
        shell: bash
        run: |
          set -euo pipefail
          export VENV_PY="$RUNNER_TEMP/venv/bin/python"
          "$VENV_PY" - <<'PY'
          import os, pathlib, re, shutil, subprocess, sys, tempfile, xml.etree.ElementTree as ET

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'project'
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          py = os.environ['VENV_PY']
          failures = []

          def run_step(label, cmd, cwd, env=None, timeout=1200):
              log_path = tmp / f'priv-{label}.log'
              merged_env = os.environ.copy()
              if env:
                  merged_env.update(env)
              with log_path.open('wb') as f:
                  try:
                      r = subprocess.run(cmd, cwd=cwd, env=merged_env, stdout=f, stderr=subprocess.STDOUT, timeout=timeout)
                      rc = r.returncode
                  except subprocess.TimeoutExpired:
                      rc = 124
              print(f'STEP_{label.upper()}_EXIT={rc}', flush=True)
              if rc != 0:
                  failures.append(label)
              return rc, log_path

          def parse_junit(label, xml_path):
              try:
                  top = ET.parse(xml_path).getroot()
                  suites = [top] if top.tag == 'testsuite' else list(top.findall('testsuite'))
                  if not suites:
                      raise ValueError('empty')
                  totals = [0, 0, 0, 0]
                  for s in suites:
                      vals = [int(s.attrib[k]) for k in ('tests', 'failures', 'errors', 'skipped')]
                      totals = [a + b for a, b in zip(totals, vals)]
                  print(f'{label.upper()}_XML tests={totals[0]} failures={totals[1]} errors={totals[2]} skipped={totals[3]}', flush=True)
                  if totals[0] <= 0 or totals[1] > 0 or totals[2] > 0:
                      failures.append(f'{label}_xml')
                  return totals
              except Exception:
                  print(f'{label.upper()}_XML_INVALID=1', flush=True)
                  failures.append(f'{label}_xml_invalid')
                  return None

          # 1. Text & static gates
          run_step('text_gate', [py, 'tools/проверка-текста.py'], root)
          run_step('false_green', [py, 'tools/искать-ложнозелёные.py'], root)
          run_step('r1_gate', [py, 'tools/проверка-Р-1-№16.py', 'client'], root)
          run_step('snakeyaml_self', [py, 'tools/проверка-snakeyaml.py', '--самопроверка'], root)
          run_step('no_file_journals', [py, 'scripts/check-no-file-journals.py'], root / 'server')
          run_step('swallowed_reflection', [py, 'scripts/check-swallowed-reflection.py'], root / 'server')

          # 2. Build installer + full benchmarks (includes full client pytest, bsl indexer/corpus, evals, catalog check, mock thought_process)
          run_step('build_installer', [py, 'make_installer.py'], root / 'client')
          rc_b, log_b = run_step('client_benchmarks', [py, 'прогнать-тесты.py', '--benchmarks'], root / 'client', timeout=1500)
          btxt = log_b.read_text(encoding='utf-8', errors='replace')
          bm = re.findall(r'Итог: PASS (\d+); FAIL (\d+); SKIP (\d+)', btxt)
          if bm:
              p, fl, sk = map(int, bm[-1])
              print(f'BENCHMARKS_SUMMARY pass={p} fail={fl} skip={sk}', flush=True)
              if p == 0 or fl != 0 or sk != 0:
                  failures.append('benchmarks_summary')
          else:
              print('BENCHMARKS_SUMMARY_MISSING=1', flush=True)
              failures.append('benchmarks_missing')

          # 3. Direct client JUnit XML run (confirming 0 failures/errors & exact skip count)
          cxml = tmp / 'client.xml'
          run_step('client_junit', [py, '-m', 'pytest', 'tests', '-q', '--disable-warnings', f'--junitxml={cxml}'], root / 'client')
          parse_junit('client', cxml)

          # 4. Delivery check self-test & deployed archive check
          run_step('delivery_self', [py, 'client/проверка-поставки.py', '--самопроверка'], root)
          setup = root / 'si-agent-setup.py'
          if setup.is_file():
              with tempfile.TemporaryDirectory() as td:
                  clean_env = {'DS_API_KEY': 'synthetic-ci-key', 'PATH': os.environ['PATH'], 'HOME': td}
                  rc_inst, _ = run_step('installer_deploy', [py, str(setup), '--папка', f'{td}/inst'], root, env=clean_env)
                  if rc_inst == 0:
                      run_step('installed_delivery_check', [py, f'{td}/inst/si-agent/проверка-поставки.py'], root, env=clean_env)
          else:
              print('INSTALLER_FILE_MISSING=1', flush=True)
              failures.append('installer_missing')

          # 5. Server Python scripts tests + JUnit XML (with real git branch tracking origin/agent/obmen-20261102)
          sxml = tmp / 'scripts.xml'
          run_step('server_scripts_pytest', [py, '-m', 'pytest', 'server/scripts/tests', '-q', '--disable-warnings', f'--junitxml={sxml}'], root)
          parse_junit('scripts', sxml)

          # 6. PowerShell self-update decision tests (Linux pwsh AST-parse mode)
          run_step('pwsh_selfupdate', ['pwsh', '-NoLogo', '-NoProfile', '-File', 'server/scripts/tests/test_edt_selfupdate.ps1'], root)

          # 7. BSL corpus integrity
          if (root / 'data/bsl-corpus/check_corpus.py').is_file():
              run_step('bsl_corpus_integrity', [py, 'check_corpus.py'], root / 'data/bsl-corpus')

          print('ARTIFACTS_UPLOADED=0', flush=True)
          print(f'TOTAL_FAILURES={len(failures)}', flush=True)
          if failures:
              print('FAILED_STEPS=' + ','.join(failures), flush=True)
              sys.exit(1)
          PY

  maven-default-13mod:
    name: 'Maven verify -fae (default target, JDK 17, all 13 modules) + EDT API & SnakeYAML JAR gates'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TARGET_SHA: ${{ inputs.sha }}
    steps:
      - name: Checkout SI-MCP branch without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: agent/obmen-20261102
          fetch-depth: 30
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project

      - name: Pin exact target SHA
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q --detach "$TARGET_SHA"
          ACTUAL=$(git rev-parse HEAD)
          echo "TARGET_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$ACTUAL"
          test "$ACTUAL" = "$TARGET_SHA"

      - name: Install Xvfb & GTK3
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven 3.9.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          rm -f /tmp/mvn.tgz
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Setup Python venv for post-build gates
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check 'pytest==9.0.3' 'pytest-subtests==0.14.2'

      - name: Run full mvn -B -fae verify (default target) + post-build JAR/API/SnakeYAML gates (sanitized stdout)
        shell: bash
        env:
          MAVEN_OPTS: -Xmx3g -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          export VENV_PY="$RUNNER_TEMP/venv/bin/python"
          "$VENV_PY" - <<'PY'
          import collections, os, pathlib, re, struct, subprocess, sys, xml.etree.ElementTree as ET, zipfile

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'project'
          srv = root / 'server'
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          py = os.environ['VENV_PY']

          mvn_log = tmp / 'mvn-default.log'
          with mvn_log.open('wb') as f:
              r = subprocess.run(
                  ['xvfb-run', '-a', 'mvn', '-B', '-fae', '-ntp', '-Dstyle.color=never', 'verify'],
                  cwd=srv, stdout=f, stderr=subprocess.STDOUT, timeout=2700,
              )
          print(f'MVN_DEFAULT_EXIT={r.returncode}', flush=True)

          # 1. Per-module Surefire XML counts
          for mod in ('si.edt.mcp.server.tests', 'si.edt.mcp.oform.tests'):
              files = list((srv / 'tests' / mod).glob('**/surefire-reports/TEST-*.xml'))
              tot = [0, 0, 0, 0]
              for p in files:
                  x = ET.parse(p).getroot()
                  tot = [a + int(x.get(k, '0')) for a, k in zip(tot, ('tests', 'failures', 'errors', 'skipped'))]
              print(f'XML_{mod.upper().replace(".", "_")} files={len(files)} tests={tot[0]} failures={tot[1]} errors={tot[2]} skipped={tot[3]}', flush=True)

          # 2. Reactor summary lines (module names + status only)
          mtext = mvn_log.read_text(encoding='utf-8', errors='replace')
          for line in mtext.splitlines():
              m = re.search(r'\[INFO\]\s+(.+?)\s+\.+\s+(SUCCESS|FAILURE|SKIPPED)\s+\[', line)
              if m:
                  print(f'REACTOR {m.group(1).strip()} => {m.group(2)}', flush=True)

          # 3. Сторож красных (counts and verdict only, no stack/details)
          stozor = srv / 'scripts' / 'сторож-красных.py'
          etalon = root / 'docs' / 'отчёты-проверок' / 'эталон-красных-2026-11-07.txt'
          rs = subprocess.run([py, str(stozor), str(mvn_log), str(etalon)], capture_output=True, text=True)
          st_out = rs.stdout + rs.stderr
          verdict = 'UNKNOWN'
          for tag, pat in [('MATCH', 'Список красных совпал'), ('IMPROVED', 'Ушли из списка'), ('REGRESSED', 'НОВЫЕ падения'), ('INCOMPLETE', 'ПРОГОН НЕ ПОЛНЫЙ')]:
              if pat in st_out:
                  verdict = tag
          counts_line = [l for l in st_out.splitlines() if 'в логе падений:' in l or 'наибольший итог' in l or 'Ушли из списка' in l or 'НОВЫЕ падения' in l]
          print(f'STOROZH_EXIT={rs.returncode} VERDICT={verdict} LINES={" | ".join(counts_line)}', flush=True)

          # 4. Built JARs & bytecode major versions (Java 17 = 61)
          built_server_jars = list((srv / 'repositories/si.edt.mcp.server.repository/target/repository/plugins').glob('si.edt.mcp.server_*.jar'))
          if not built_server_jars:
              built_server_jars = list((srv / 'bundles/si.edt.mcp.server/target').glob('si.edt.mcp.server-*.jar'))
          print(f'BUILT_SERVER_JARS={len(built_server_jars)}', flush=True)
          for mod in ('si.edt.mcp.server', 'si.edt.mcp.oform'):
              for j in (srv / 'bundles' / mod / 'target').glob(f'{mod}-*.jar'):
                  with zipfile.ZipFile(j) as z:
                      majors = dict(collections.Counter(struct.unpack('>H', z.read(n)[6:8])[0] for n in z.namelist() if n.endswith('.class')))
                  print(f'BYTECODE {mod} major_counts={majors}', flush=True)

          # 5. Live JAR gates: check-edt-api.py + guard-empty-checks.py + проверка-snakeyaml.py + test_snakeyaml_v_feature.py
          api_r = subprocess.run([py, 'scripts/check-edt-api.py', '--check'], cwd=srv, capture_output=True, text=True)
          print(f'CHECK_EDT_API_EXIT={api_r.returncode}', flush=True)
          for l in (api_r.stdout + api_r.stderr).splitlines():
              if any(k in l for k in ('using ', 'everything we use', 'do not resolve', 'probed spellings', 'outside 1C', 'not registered')):
                  print('  EDT_API:', l.strip(), flush=True)

          gr = subprocess.run([py, 'scripts/guard-empty-checks.py'], cwd=srv, capture_output=True, text=True)
          print(f'GUARD_EMPTY_CHECKS_EXIT={gr.returncode}', flush=True)
          for l in gr.stdout.splitlines():
              if 'проверок по существу:' in l:
                  print('  GUARD:', l.strip(), flush=True)

          fail = False
          if built_server_jars:
              jar_path = str(built_server_jars[0])
              sy = subprocess.run([py, 'tools/проверка-snakeyaml.py', jar_path], cwd=root, capture_output=True, text=True)
              print(f'SNAKEYAML_JAR_EXIT={sy.returncode}', flush=True)
              env_sy = os.environ.copy()
              env_sy['SI_EDT_PLUGIN_JAR'] = jar_path
              tsy = subprocess.run([py, '-m', 'pytest', 'tests/test_snakeyaml_v_feature.py', '-q'], cwd=root / 'client', env=env_sy, capture_output=True, text=True)
              print(f'TEST_SNAKEYAML_V_FEATURE_EXIT={tsy.returncode} SUMMARY={tsy.stdout.splitlines()[-1] if tsy.stdout.splitlines() else ""}', flush=True)
              if sy.returncode != 0 or tsy.returncode != 0:
                  fail = True
          else:
              fail = True

          print('ARTIFACTS_UPLOADED=0', flush=True)
          # Fail if storozh regressed (rc not in (0,2)), oform failed, built repo missing, edt-api failed, guard failed, or snakeyaml failed
          oform_files = list((srv / 'tests/si.edt.mcp.oform.tests').glob('**/surefire-reports/TEST-*.xml'))
          oform_bad = sum(int(ET.parse(p).getroot().get('failures','0')) + int(ET.parse(p).getroot().get('errors','0')) for p in oform_files)
          if rs.returncode not in (0, 2) or not oform_files or oform_bad > 0 or api_r.returncode != 0 or gr.returncode != 0 or fail:
              sys.exit(1)
          PY

  maven-edt-2026-2-13mod:
    name: 'Maven verify -fae -Pedt-2026.2 (Eclipse 2025-12, JDK 25, all 13 modules)'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TARGET_SHA: ${{ inputs.sha }}
    steps:
      - name: Checkout SI-MCP branch without persisting credentials
        uses: actions/checkout@v4
        with:
