name: '№14 — fast oform.tests & snakeyaml --jar diagnostic'
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact SI-MCP SHA to verify'
        required: true
        default: '8eebaa355da257a408fb509b87090f9a02c33f66'

permissions:
  contents: read

jobs:
  oform-and-snakeyaml-probe:
    name: 'Maven verify -fae on oform.tests + snakeyaml --jar check'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TARGET_SHA: ${{ inputs.sha }}
    steps:
      - name: Checkout SI-MCP branch without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: agent/obmen-20261102
          fetch-depth: 30
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project

      - name: Pin exact target SHA
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q --detach "$TARGET_SHA"
          ACTUAL=$(git rev-parse HEAD)
          echo "TARGET_SHA=$TARGET_SHA"
          echo "ACTUAL_SHA=$ACTUAL"
          test "$ACTUAL" = "$TARGET_SHA"

      - name: Install Xvfb & GTK3
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null

      - name: Setup JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maven 3.9.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          rm -f /tmp/mvn.tgz
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Setup Python venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check 'pytest==9.0.3' 'pytest-subtests==0.14.2'

      - name: Run oform.tests + snakeyaml --jar (numeric/sanitized coordinates only)
        shell: bash
        env:
          MAVEN_OPTS: -Xmx3g -Dfile.encoding=UTF-8
        run: |
          set -euo pipefail
          export VENV_PY="$RUNNER_TEMP/venv/bin/python"
          "$VENV_PY" - <<'PY'
          import os, pathlib, subprocess, sys, xml.etree.ElementTree as ET, zipfile

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'project'
          srv = root / 'server'
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          py = os.environ['VENV_PY']

          mvn_log = tmp / 'mvn-oform.log'
          with mvn_log.open('wb') as f:
              r = subprocess.run(
                  ['xvfb-run', '-a', 'mvn', '-B', '-fae', '-ntp', '-Dstyle.color=never',
                   '-pl', 'tests/si.edt.mcp.oform.tests', '-am', 'verify'],
                  cwd=srv, stdout=f, stderr=subprocess.STDOUT, timeout=1200,
              )
          print(f'MVN_OFORM_EXIT={r.returncode}', flush=True)

          # Map sorted *Test.java in git to XML index without exposing names in public log
          test_javas = sorted((srv / 'tests/si.edt.mcp.oform.tests/src').rglob('*Test.java'))
          print(f'OFORM_TEST_JAVA_COUNT={len(test_javas)}', flush=True)
          xml_files = sorted((srv / 'tests/si.edt.mcp.oform.tests').glob('**/surefire-reports/TEST-*.xml'))
          print(f'OFORM_XML_COUNT={len(xml_files)}', flush=True)

          tot = [0, 0, 0, 0]
          for xidx, xp in enumerate(xml_files):
              x = ET.parse(xp).getroot()
              tot = [a + int(x.get(k, '0')) for a, k in zip(tot, ('tests', 'failures', 'errors', 'skipped'))]
              cls_stem = xp.stem.replace('TEST-', '').rsplit('.', 1)[-1]
              java_idx = next((i for i, p in enumerate(test_javas) if p.stem == cls_stem), -1)
              for tc_idx, tc in enumerate(x.findall('testcase')):
                  bad = tc.find('failure') or tc.find('error')
                  if bad is not None:
                      # Also extract just line number inside the test class if present in stacktrace
                      text = bad.text or ''
                      line_nums = []
                      for ln in text.splitlines():
                          if cls_stem + '.java:' in ln:
                              line_nums.append(ln.split('.java:', 1)[1].split(')', 1)[0])
                      kind = 'failure' if tc.find('failure') is not None else 'error'
                      exc_short = (bad.attrib.get('type', '') or '').rsplit('.', 1)[-1]
                      print(f'OFORM_BAD_COORD xml_idx={xidx} java_idx={java_idx} tc_idx={tc_idx} kind={kind} exc={exc_short} lines={line_nums[:3]}', flush=True)

          print(f'OFORM_XML_TOTALS tests={tot[0]} failures={tot[1]} errors={tot[2]} skipped={tot[3]}', flush=True)

          # Check SnakeYAML with --jar flag!
          jar = list((srv / 'bundles/si.edt.mcp.server/target').glob('si.edt.mcp.server-*.jar'))
          jar = [j for j in jar if not j.name.endswith('-sources.jar')]
          print(f'BUILT_JAR_FOUND={len(jar)}', flush=True)
          if jar:
              jp = jar[0]
              with zipfile.ZipFile(jp) as z:
                  names = z.namelist()
                  root_yaml = sum(1 for n in names if n.startswith('org/yaml/') and n.endswith('.class'))
                  emb_yaml = any(n.startswith('lib/snakeyaml') for n in names)
              print(f'JAR_INSPECT root_yaml_classes={root_yaml} embedded_snakeyaml_jar={emb_yaml}', flush=True)
              sy = subprocess.run([py, 'tools/проверка-snakeyaml.py', '--jar', str(jp)], cwd=root, capture_output=True, text=True)
              print(f'SNAKEYAML_TOOL_JAR_EXIT={sy.returncode}', flush=True)
              env_sy = os.environ.copy()
              env_sy['SI_EDT_PLUGIN_JAR'] = str(jp)
              tsy = subprocess.run([py, '-m', 'pytest', 'tests/test_snakeyaml_v_feature.py', '-q'], cwd=root / 'client', env=env_sy, capture_output=True, text=True)
              print(f'TEST_SNAKEYAML_V_FEATURE_EXIT={tsy.returncode}', flush=True)

          print('ARTIFACTS_UPLOADED=0', flush=True)
          PY
