name: Agent 14 Hosted Verify PR193 (3 mutations) + Z03 (54 settings + 4 mutations)
on:
  push:
    branches:
      - agent/14-hosted-full-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-verify
  cancel-in-progress: true

jobs:
  pr193_verify:
    name: "PR193: Causal contrast + DCS suite + 3 mutations (guard, exact-name, ambiguity)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Fetch SI-MCP base a4e93e6f02 & PR193 829e25bcef
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q src
          git -C src remote add origin git@github.com:Lavren73/SI-MCP.git
          git -C src fetch -q --depth=1 origin a4e93e6f027e04b8067ace1ec85d31e5df1a3e2e 829e25bcef79276603a7681e0db5174f1a596561

      - name: Run causal contrast, PR193 DCS suite, and 3 DcsWorkshopTool mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          def parse_xmls(root):
              xmls = sorted(root.rglob("TEST-*.xml"))
              tot = [0, 0, 0, 0]
              details = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
                  for tc in r.findall("testcase"):
                      bad = tc.find("failure") or tc.find("error")
                      if bad is not None:
                          details.append(f"{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:140]}")
              return len(xmls), tot, details

          def clean_xmls(root):
              for xp in root.rglob("TEST-*.xml"):
                  xp.unlink()

          # 1. Base a4e93e6f02 causal contrast
          subprocess.run(["git", "checkout", "-q", "-f", "a4e93e6f027e04b8067ace1ec85d31e5df1a3e2e"], cwd=src, check=True)
          clean_xmls(srv)
          r_base = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              "-Dtest=ASchemaHoldsSchemasInsideItTest", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xb, tb, db = parse_xmls(srv)
          print(f"PR193_BASE_CONTRAST exit={r_base.returncode} xmls={xb} tests={tb[0]} F={tb[1]} E={tb[2]} S={tb[3]}", flush=True)
          for line in db:
              print("  BASE_FAIL:", line, flush=True)
          assert r_base.returncode != 0 and (tb[1] + tb[2]) == 3

          # 2. Head 829e25bcef ASchemaHoldsSchemasInsideItTest + full DCS/schema group
          subprocess.run(["git", "checkout", "-q", "-f", "829e25bcef79276603a7681e0db5174f1a596561"], cwd=src, check=True)
          dcs_group = ",".join([
              "ADcsSearchReadsTheWholeSchemaTest",
              "ASchemaHoldsSchemasInsideItTest",
              "ASchemaNamesItsTemplatesTest",
              "ASchemaParameterIsTypedWithItsQualifiersTest",
              "ASchemaParameterTakesItsOptionalFieldsTest",
              "ASchemaTemplateIsNotMadeEmptyTest",
              "DcsSettingsImpactTest",
              "SettingsTableTakesTheSchemaResourcesTest",
          ])
          clean_xmls(srv)
          r_head = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              f"-Dtest={dcs_group}", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xh, th, dh = parse_xmls(srv)
          print(f"PR193_HEAD_DCS_GROUP exit={r_head.returncode} xmls={xh} tests={th[0]} F={th[1]} E={th[2]} S={th[3]}", flush=True)
          assert r_head.returncode == 0 and xh == 8 and th[1:] == [0, 0, 0]

          dcs_tool = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/toolkit/ops/DcsWorkshopTool.java"
          orig = dcs_tool.read_text(encoding="utf-8")

          mutations = [
              ("MUT_GUARD", 'mustNotLookLikeAPath(name, "dataset"); //$NON-NLS-1$', '// MUTATED: guard disabled'),
              ("MUT_EXACT_NAME", 'if (BmDcsHelper.findByNameInList(schema, "getDataSets", unionName) != null) //$NON-NLS-1$', 'if (false) // MUTATED: exact-name skipped'),
              ("MUT_AMBIGUITY", 'mustNotBeAmbiguous(schema, "getDataSets", unionName); //$NON-NLS-1$', '// MUTATED: ambiguity check disabled'),
          ]
          for label, needle, repl in mutations:
              assert needle in orig, f"missing needle for {label}"
              dcs_tool.write_text(orig.replace(needle, repl, 1), encoding="utf-8")
              try:
                  clean_xmls(srv)
                  r_m = subprocess.run([
                      "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
                      "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                      "-Dtest=ASchemaHoldsSchemasInsideItTest", "verify"
                  ], cwd=srv, capture_output=True, text=True)
                  xm, tm, dm = parse_xmls(srv)
                  print(f"PR193_{label} exit={r_m.returncode} xmls={xm} tests={tm[0]} F={tm[1]} E={tm[2]} S={tm[3]}", flush=True)
                  for line in dm:
                      print(f"  {label}_FAIL:", line, flush=True)
                  assert r_m.returncode != 0 and (tm[1] + tm[2]) >= 1
              finally:
                  dcs_tool.write_text(orig, encoding="utf-8")

          print("PR193_SUMMARY=CAUSAL_BASE3_HEAD115_ALL_3_MUTATIONS_KILLED ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER

  z03_verify:
    name: "Z03: Exact 371ce1ce OSGi (54 settings + 4 mutations)"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Maven 3.9.9 & Xvfb
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"

      - name: Fetch exact Z03 SHA 371ce1ce1d77c13949b9b19b858da990cf0fe97e
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q src
          git -C src remote add origin git@github.com:Lavren73/SI-MCP.git
          git -C src fetch -q --depth=1 origin 371ce1ce1d77c13949b9b19b858da990cf0fe97e
          git -C src checkout -q FETCH_HEAD
          echo "Z03_SHA=$(git -C src rev-parse HEAD)"

      - name: Run full 54-class settings suite, focused 6 Z03+legacy, and 4 ToolsPrefTab mutations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          def parse_xmls(root):
              xmls = sorted(root.rglob("TEST-*.xml"))
              tot = [0, 0, 0, 0]
              details = []
              skipped = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
                  for tc in r.findall("testcase"):
                      sk = tc.find("skipped")
                      if sk is not None:
                          skipped.append(f"{r.attrib.get('name')}#{tc.attrib.get('name')}: {sk.attrib.get('message','')[:100]}")
                      bad = tc.find("failure") or tc.find("error")
                      if bad is not None:
                          details.append(f"{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:140]}")
              return len(xmls), tot, details, skipped

          def clean_xmls(root):
              for xp in root.rglob("TEST-*.xml"):
                  xp.unlink()

          # 1. Focused 4 adapted classes + 2 legacy-finder neighbour classes: must be 0F/0E/0S
          z03_focus = ",".join([
              "AKeptSetOutlivesThePresetChangeTest",
              "APresetChangeRepaintsTheHiddenMarksTest",
              "AQueryBringsBackTheTicksItShowsTest",
              "RestoringToolDefaultsGivesTheShippedPresetTest",
              "TheToolsTabOnAScreenTest",
              "AGroupTickUnderAQuerySparesWhatItHidesTest",
          ])
          clean_xmls(srv)
          r_foc = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              f"-Dtest={z03_focus}", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xf, tf, df, sf = parse_xmls(srv)
          print(f"Z03_FOCUSED_6 exit={r_foc.returncode} xmls={xf} tests={tf[0]} F={tf[1]} E={tf[2]} S={tf[3]}", flush=True)
          assert r_foc.returncode == 0 and xf == 6 and tf[1:] == [0, 0, 0]

          # 2. All 54 *Test classes in settings
          settings_dir = srv / "tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/settings"
          all_classes = sorted(p.stem for p in settings_dir.glob("*Test.java"))
          clean_xmls(srv)
          r_all = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
              f"-Dtest={','.join(all_classes)}", "verify"
          ], cwd=srv, capture_output=True, text=True)
          xa, ta, da, sa = parse_xmls(srv)
          print(f"Z03_SETTINGS_FULL exit={r_all.returncode} xmls={xa} tests={ta[0]} F={ta[1]} E={ta[2]} S={ta[3]}", flush=True)
          for line in sa:
              print("  FULL_SKIP:", line, flush=True)
          assert r_all.returncode == 0 and xa == len(all_classes) and ta[1] == 0 and ta[2] == 0

          # 3. Four targeted mutations in ToolsPrefTab (one per adapted test class)
          tab_file = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/settings/ToolsPrefTab.java"
          orig = tab_file.read_text(encoding="utf-8")

          mutations = [
              (
                  "MUT_QUERY",
                  "AQueryBringsBackTheTicksItShowsTest",
                  "pane.filter.setQuery(pane.filterBox.getText());",
                  'pane.filter.setQuery("nonexistent_mutated_xyz");',
              ),
              (
                  "MUT_UNLISTED_MARK",
                  "APresetChangeRepaintsTheHiddenMarksTest",
                  'return " — скрыт из списка, но вызывается";',
                  'return ""; // MUTATED',
              ),
              (
                  "MUT_DEFAULTS_UNLISTED",
                  "RestoringToolDefaultsGivesTheShippedPresetTest",
                  "unlistedTools.addAll(ToolProfile.CANONICAL.getUnlistedTools());",
                  "// MUTATED: skipped CANONICAL unlisted restore",
              ),
              (
                  "MUT_KEPT_DOOR",
                  "AKeptSetOutlivesThePresetChangeTest",
                  "AgentRightsMode.reconcileDoor(disabledTools, rightsMode);",
                  "// MUTATED: reconcileDoor skipped",
              ),
          ]

          for label, test_cls, needle, repl in mutations:
              assert needle in orig, f"missing needle for {label}"
              tab_file.write_text(orig.replace(needle, repl), encoding="utf-8")
              try:
                  clean_xmls(srv)
                  r_m = subprocess.run([
                      "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never",
                      "-pl", "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests", "-am",
                      f"-Dtest={test_cls}", "verify"
                  ], cwd=srv, capture_output=True, text=True)
                  xm, tm, dm, _ = parse_xmls(srv)
                  print(f"Z03_{label} exit={r_m.returncode} xmls={xm} tests={tm[0]} F={tm[1]} E={tm[2]} S={tm[3]}", flush=True)
                  for line in dm:
                      print(f"  {label}_FAIL:", line, flush=True)
                  assert r_m.returncode != 0 and (tm[1] + tm[2]) >= 1
              finally:
                  tab_file.write_text(orig, encoding="utf-8")

          print("Z03_SUMMARY=FOCUSED_6_ZERO_ALL_54_ZERO_FAIL_ALL_4_MUTATIONS_KILLED ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER
