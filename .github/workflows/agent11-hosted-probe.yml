name: '№13 — watcher 192 independent controls'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: 1475821c8aafe6ce20d45f1ef7d860e35d2abdab
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project
          fetch-depth: 1
      - name: Verify regressions and synthetic rewind
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = 1475821c8aafe6ce20d45f1ef7d860e35d2abdab ] || exit 1
          python3 - <<'PY'
          import contextlib,importlib.util,io,unittest,subprocess
          p='server/scripts/tests/test_watcher_stale_remote_11.py'
          spec=importlib.util.spec_from_file_location('watcher_192_test',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          sink=io.StringIO()
          with contextlib.redirect_stdout(sink),contextlib.redirect_stderr(sink):
              r=unittest.TextTestRunner(stream=sink).run(unittest.defaultTestLoader.loadTestsFromTestCase(m.StaleRemote))
          print('REGRESSION_TESTS=%d FAILURES=%d ERRORS=%d SKIPS=%d'%(r.testsRun,len(r.failures),len(r.errors),len(r.skipped)))
          if not (r.testsRun==10 and r.wasSuccessful() and len(r.skipped)==0): raise SystemExit(1)
          test=m.StaleRemote(methodName='test_unchanged_branch')
          test.setUp()
          try:
              test.cmd('-C',str(test.seed),'-c','user.name=fixture','-c','user.email=fixture@example.invalid','commit','--allow-empty','-m','second')
              test.cmd('-C',str(test.seed),'push',str(test.origin),'HEAD:refs/heads/topic')
              current=test.cmd('-C',str(test.seed),'rev-parse','HEAD')
              buf=io.StringIO()
              with contextlib.redirect_stdout(buf): advanced,rc=m.w.один_проход(str(test.clone),'topic',test.old)
              forward=advanced==current and rc==0 and '1 new commit(s)' in buf.getvalue()
              test.cmd('-C',str(test.seed),'push','--force',str(test.origin),test.old+':refs/heads/topic')
              buf=io.StringIO()
              with contextlib.redirect_stdout(buf): new,rc=m.w.один_проход(str(test.clone),'topic',current)
              rewound=new==test.old and rc==1
              zero=('non-fast-forward' in buf.getvalue() and '0 new commit(s)' not in buf.getvalue())
              print('FORWARD_DETECTED='+str(int(forward)))
              print('FORCED_REWIND_ALERTED='+str(int(rewound)))
              print('REWIND_PROPERLY_LABELED='+str(int(zero)))
              out2=io.StringIO()
              with contextlib.redirect_stdout(out2): again,rc2=m.w.один_проход(str(test.clone),'topic',new)
              repeat=(again==new and rc2==0 and 'no new commits' in out2.getvalue())
              print('SECOND_POLL_STABLE='+str(int(repeat)))
              print('ARTIFACTS_UPLOADED=0')
              if not (forward and rewound and zero and repeat): raise SystemExit(1)
          finally:
              test.doCleanups()
          PY
