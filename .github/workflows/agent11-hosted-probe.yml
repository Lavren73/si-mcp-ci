name: Agent 14 Hosted Exact Integration Candidate 9ae7f9ca
on:
  push:
    branches:
      - agent/14-hosted-full-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-verify
  cancel-in-progress: true

jobs:
  int_9ae7f9ca_jar_gates:
    name: "INT: Exact 9ae7f9ca (SnakeYAML --jar/--site, check-edt-api, client+JAR, -fae)"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Fetch exact integration SHA 9ae7f9ca375744c3fb5717cfd563594853c3043d
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git init -q src
          git -C src remote add origin git@github.com:Lavren73/SI-MCP.git
          git -C src fetch -q --depth=1 origin 9ae7f9ca375744c3fb5717cfd563594853c3043d
          git -C src checkout -q FETCH_HEAD
          echo "INT_SHA=$(git -C src rev-parse HEAD)"

      - name: Setup JDK 17 & Python
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Maven 3.9.9, Xvfb & pytest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          python3 -m pip install -q pytest

      - name: Run full -fae, SnakeYAML --jar/--сайт, client+JAR, and server gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import os, pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src").resolve()
          srv = src / "server"

          r_mvn = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never", "-fae", "verify"
          ], cwd=srv, capture_output=True, text=True)
          print(f"INT_MVN_FAE exit={r_mvn.returncode}", flush=True)

          for mod in ("si.edt.mcp.server.tests", "si.edt.mcp.oform.tests"):
              mdir = srv / "tests" / mod / "target/surefire-reports"
              xmls = sorted(mdir.glob("TEST-*.xml")) if mdir.is_dir() else []
              tot = [0, 0, 0, 0]
              fails = []
              for xp in xmls:
                  root = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(root.attrib.get("tests", 0))
                  tot[1] += int(root.attrib.get("failures", 0))
                  tot[2] += int(root.attrib.get("errors", 0))
                  tot[3] += int(root.attrib.get("skipped", 0))
                  for tc in root.findall("testcase"):
                      for tag in ("failure", "error"):
                          if tc.find(tag) is not None:
                              fails.append(f"{tc.attrib.get('classname')}.{tc.attrib.get('name')}[{tag[0].upper()}]")
              print(f"MOD {mod}: xmls={len(xmls)} tests={tot[0]} F={tot[1]} E={tot[2]} S={tot[3]}", flush=True)
              for fn in sorted(fails):
                  print(f"  RED: {fn}", flush=True)

          # Check built plugin jars & p2 repository zip
          repo_jars = sorted((srv / "repositories/si.edt.mcp.server.repository/target/repository/plugins").glob("si.edt.mcp.server_*.jar"))
          repo_jars = [j for j in repo_jars if "-sources" not in j.name]
          bundle_jars = sorted((srv / "bundles/si.edt.mcp.server/target").glob("si.edt.mcp.server-*.jar"))
          bundle_jars = [j for j in bundle_jars if "-sources" not in j.name]
          site_zips = sorted((srv / "repositories/si.edt.mcp.server.repository/target").glob("SI-EDT-*.zip"))
          print(f"ARTIFACTS: bundle_jars={len(bundle_jars)} repo_jars={len(repo_jars)} site_zips={len(site_zips)}", flush=True)
          assert bundle_jars and repo_jars and site_zips

          for label, args in [
              ("BUNDLE_JAR", ["--jar", str(bundle_jars[0])]),
              ("REPO_JAR", ["--jar", str(repo_jars[0])]),
              ("UPDATE_SITE_ZIP", ["--сайт", str(site_zips[0])]),
          ]:
              rs = subprocess.run(["python3", "tools/проверка-snakeyaml.py", *args], cwd=src, capture_output=True, text=True)
              print(f"SNAKEYAML_{label} exit={rs.returncode}: {rs.stdout.strip()} {rs.stderr.strip()}", flush=True)
              assert rs.returncode == 0

          # Run full client pytest with SI_EDT_PLUGIN_JAR set so BuiltPluginTest executes (not skipped!)
          env = dict(os.environ, SI_EDT_PLUGIN_JAR=str(repo_jars[0]))
          rc_jar = subprocess.run(["python3", "-m", "pytest", "-v", "tests/test_snakeyaml_v_feature.py"], cwd=src / "client", env=env, capture_output=True, text=True)
          print(f"PYTEST_SNAKEYAML_V_FEATURE exit={rc_jar.returncode}", flush=True)
          print(rc_jar.stdout.strip(), flush=True)
          assert rc_jar.returncode == 0 and "SKIPPED" not in rc_jar.stdout

          rc_all = subprocess.run(["python3", "-m", "pytest", "-q", "-ra"], cwd=src / "client", env=env, capture_output=True, text=True)
          print(f"CLIENT_ALL_WITH_JAR exit={rc_all.returncode}", flush=True)
          print("\n".join(rc_all.stdout.splitlines()[-15:]), flush=True)
          assert rc_all.returncode == 0

          rc_bm = subprocess.run(["python3", "-m", "pytest", "-q", "--benchmarks", "tests/test_benchmarks.py"], cwd=src / "client", env=env, capture_output=True, text=True)
          print(f"CLIENT_BENCHMARKS exit={rc_bm.returncode}: {rc_bm.stdout.splitlines()[-1] if rc_bm.stdout else ''}", flush=True)
          assert rc_bm.returncode == 0

          rg = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"SERVER_GATES_POST_BUILD exit={rg.returncode}\n{rg.stdout.strip()}", flush=True)

          print("INT_ALL_PROBES_DONE=1 ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER
