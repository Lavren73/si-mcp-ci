name: Agent 14 Hosted Cumulative 5-PR Reactor Verify (8c61e24 + #190 #192 #193 #194 #176)
on:
  push:
    branches:
      - agent/14-hosted-full-verify
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent14-hosted-verify
  cancel-in-progress: true

jobs:
  cumulative_5pr_reactor:
    name: "5-PR Cumulative (8c61e24 + #190,#192,#193,#194,#176): full mvn -fae verify + scripts + client"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Maven 3.9.9 & Xvfb & pytest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          pip install -q pytest

      - name: Checkout 8c61e24 and cumulatively merge #190, #192, #193, #194, #176
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch agent/obmen-20261102 --depth=80 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git config user.name "si-mcp-agent-sim"
          git config user.email "si-mcp-agent@local.invalid"
          git checkout -q 8c61e2405e1887b368ca1cecbf9eb52acc44b239
          git fetch -q origin \
            88511e3ca5fa407d4fb53826e97b3418bc094ed0 \
            1475821c8aafe6ce20d45f1ef7d860e35d2abdab \
            829e25bcef79276603a7681e0db5174f1a596561 \
            371ce1ce1d77c13949b9b19b858da990cf0fe97e \
            40028bee69f84c085eb4837b324519d774673f9b
          for pair in \
            "190:88511e3ca5fa407d4fb53826e97b3418bc094ed0" \
            "192:1475821c8aafe6ce20d45f1ef7d860e35d2abdab" \
            "193:829e25bcef79276603a7681e0db5174f1a596561" \
            "194:371ce1ce1d77c13949b9b19b858da990cf0fe97e" \
            "176:40028bee69f84c085eb4837b324519d774673f9b"; do
            pr="${pair%%:*}"
            sha="${pair#*:}"
            git merge --no-edit "$sha" -m "sim merge PR #$pr"
          done
          echo "CUMULATIVE_HEAD=$(git rev-parse HEAD)"

      - name: Run text, scripts, server gates, client pytest, and full Maven reactor verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"
          cli = src / "client"

          r_txt = subprocess.run(["python3", "tools/проверка-текста.py"], cwd=src, capture_output=True, text=True)
          print(f"CUM5_PY_TEXT exit={r_txt.returncode} last={(r_txt.stdout.strip().splitlines() or [''])[-1]}", flush=True)
          assert r_txt.returncode == 0

          r_gates = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"CUM5_SERVER_GATES exit={r_gates.returncode}", flush=True)
          print(r_gates.stdout.strip(), flush=True)
          print("NOTE: pre-build gates exit=" + str(r_gates.returncode) + " (№21.md on 8c61e24 etc.)", flush=True)

          r_scr = subprocess.run(["python3", "-m", "unittest", "discover", "-s", "server/scripts/tests", "-p", "test_*.py"], cwd=src, capture_output=True, text=True)
          print(f"CUM5_SCRIPTS_UNITTEST exit={r_scr.returncode}", flush=True)
          print("\n".join(r_scr.stderr.splitlines()[-10:]), flush=True)
          print("NOTE: pre-build scripts exit=" + str(r_scr.returncode), flush=True)

          r_cli = subprocess.run(["python3", "-m", "pytest", "-q"], cwd=cli, capture_output=True, text=True)
          print(f"CUM5_CLIENT_PYTEST exit={r_cli.returncode} tail={(r_cli.stdout.strip().splitlines() or [''])[-1]}", flush=True)
          if r_cli.returncode != 0:
              print(r_cli.stdout[-2000:], flush=True)
              print(r_cli.stderr[-1000:], flush=True)

          # Full Maven reactor verify
          for xp in srv.rglob("TEST-*.xml"):
              xp.unlink()

          r_mvn = subprocess.run([
              "xvfb-run", "-a", "mvn", "-B", "-ntp", "-Dstyle.color=never", "-fae", "verify"
          ], cwd=srv, capture_output=True, text=True)
          print(f"CUM5_MVN_EXIT={r_mvn.returncode}", flush=True)

          for bundle in ("si.edt.mcp.server.tests", "si.edt.mcp.oform.tests"):
              bdir = srv / "tests" / bundle / "target/surefire-reports"
              xmls = sorted(bdir.glob("TEST-*.xml")) if bdir.exists() else []
              tot = [0, 0, 0, 0]
              fails = []
              skips = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
                  for tc in r.findall("testcase"):
                      sk = tc.find("skipped")
                      if sk is not None:
                          skips.append(f"{r.attrib.get('name')}#{tc.attrib.get('name')}: {sk.attrib.get('message','')[:90]}")
                      bad = tc.find("failure") or tc.find("error")
                      if bad is not None:
                          fails.append(f"{r.attrib.get('name')}#{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:140]}")
              print(f"CUM5_JUNIT {bundle} xmls={len(xmls)} tests={tot[0]} F={tot[1]} E={tot[2]} S={tot[3]}", flush=True)
              for f in fails:
                  print("  FAIL:", f, flush=True)
              for s in skips:
                  print("  SKIP:", s, flush=True)

          r_gates2 = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"CUM5_POSTBUILD_GATES exit={r_gates2.returncode}", flush=True)
          print(r_gates2.stdout.strip(), flush=True)

          assert r_mvn.returncode == 0 and r_cli.returncode == 0
          print("CUM5_SUMMARY=FULL_REACTOR_AND_CLIENT_AND_SCRIPTS_GREEN ARTIFACTS_UPLOADED=0", flush=True)
          PY_INNER
