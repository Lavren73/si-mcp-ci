name: 'Agent 13 PR 197 independent fixture sentinel'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: d6d25e21eb085845f551efd4a785410e5a472d28
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project
          fetch-depth: 1
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install hosted dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/setup.log" 2>&1
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >> "$RUNNER_TEMP/setup.log" 2>&1
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o "$RUNNER_TEMP/maven.tar.gz"
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo 'SETUP_OK=1'
      - name: Sentinel and baseline in isolated OSGi
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [ "$sha" = d6d25e21eb085845f551efd4a785410e5a472d28 ] || exit 1
          echo "SOURCE_SHA=$sha"
          cat > server/tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/wire/Agent13Pr197IsolationSentinelTest.java <<'JAVA'
          package si.edt.mcp.server.wire;
          import static org.junit.Assert.*;
          import java.util.List;
          import java.util.Map;
          import org.junit.Test;
          import si.edt.mcp.server.toolkit.IMcpTool;
          import si.edt.mcp.server.toolkit.McpToolCatalog;
          public class Agent13Pr197IsolationSentinelTest {
            @Test public void ordinaryRegistrationSurvivesWireFixture() {
              McpToolCatalog registry = McpToolCatalog.getInstance();
              String id = "agent13_pr197_sentinel_8c5a";
              String alias = "agent13_pr197_alias_8c5a";
              IMcpTool prior = new IMcpTool() {
                public String getName() { return id; }
                public List<String> getAliases() { return List.of(alias); }
                public String getDescription() { return "synthetic sentinel"; }
                public String getInputSchema() { return "{}"; }
                public String execute(Map<String,String> params) { return ""; }
              };
              registry.register(prior);
              assertSame("precondition id", prior, registry.getTool(id));
              assertSame("precondition alias", prior, registry.getTool(alias));
              DiagnosticsCompletenessWireTest fixture = new DiagnosticsCompletenessWireTest();
              try {
                fixture.setUp();
                fixture.tearDown();
                assertSame("ordinary identity lost by wire fixture", prior, registry.getTool(id));
                assertSame("ordinary alias lost by wire fixture", prior, registry.getTool(alias));
              } finally { registry.unregister(id); }
            }
          }
          JAVA
          cd server
          set +e
          xvfb-run -a "$RUNNER_TEMP/apache-maven-3.9.9/bin/mvn" -B -fae -ntp -pl targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests -am '-Dtest=DiagnosticsCompletenessWireTest,Agent13Pr197IsolationSentinelTest' verify > "$RUNNER_TEMP/private-maven.log" 2>&1
          rc=$?
          set -e
          echo "MAVEN_EXIT=$rc"
          python3 - "$rc" <<'PYCODE'
          import pathlib,sys,xml.etree.ElementTree as E
          want={'DiagnosticsCompletenessWireTest','Agent13Pr197IsolationSentinelTest'}
          seen={}; marker=False
          for f in pathlib.Path('.').glob('**/target/surefire-reports/TEST-*.xml'):
              try:
                  r=E.parse(f).getroot(); name=r.get('name','').rsplit('.',1)[-1]
                  if name in want:
                      if name in seen: raise ValueError('duplicate')
                      seen[name]=tuple(int(r.attrib[k]) for k in ('tests','failures','errors','skipped'))
                      if name == 'Agent13Pr197IsolationSentinelTest':
                          marker=any((x.get('message') or '').startswith('ordinary identity lost by wire fixture') for x in r.findall('.//failure'))
              except Exception:
                  print('PARSE_ERROR=1');sys.exit(2)
          for name in sorted(want): print(name+'='+str(seen.get(name)))
          print('IDENTITY_LOST_MARKER='+str(int(marker)))
          print('ARTIFACTS_UPLOADED=0')
          ok=seen.get('DiagnosticsCompletenessWireTest') == (3,0,0,0) and seen.get('Agent13Pr197IsolationSentinelTest') == (1,0,0,0) and int(sys.argv[1]) == 0
          sys.exit(0 if ok else 1)
          PYCODE
