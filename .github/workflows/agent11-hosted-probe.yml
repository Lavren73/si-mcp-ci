name: 'Agent 13 independent client schema checks'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: 332f54923fa0f39fa36057af9fa6c4dc63563f37
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project
          fetch-depth: 1
      - name: Repeat previous and exact schema fake scenarios
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git -C project rev-parse HEAD)" = 332f54923fa0f39fa36057af9fa6c4dc63563f37 ]
          echo SOURCE_SHA=332f54923fa0f39fa36057af9fa6c4dc63563f37
          cd project
          set +e
          python3 ../harness/agent13-review/probe196.py
          probe=$?
          set -e
          echo PROBE_EXIT="$probe"
          python3 ../harness/agent13-review/contract196.py
          echo 'ARTIFACTS_UPLOADED=0'
