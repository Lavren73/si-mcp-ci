name: '№13 — partial diagnostics synthetic boundary'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact private test candidate
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: 3d991b4b7e4ef2dedc5dcdc8e91b0d6cbac5f0cc
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project
          fetch-depth: 2
      - name: Run isolated fake-response probe
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = 3d991b4b7e4ef2dedc5dcdc8e91b0d6cbac5f0cc ]
          [ "$(git rev-parse HEAD^)" = 7f73b65a5547b741a7b5334812abc5b423647dc8 ]
          [ "$(git diff --name-only HEAD^ HEAD | wc -l)" -eq 1 ]
          [ "$(git diff --name-only HEAD^ HEAD)" = tools/agent13-partial-diagnostics-probe.py ]
          python3 tools/agent13-partial-diagnostics-probe.py
          printf 'ARTIFACTS_UPLOADED=0\n'
