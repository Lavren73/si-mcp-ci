name: '№13 — isolated access matrix sentinel'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx3g
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: be507661db35990ec40ab0f105bd045f0ff08d02
          token: ${{ secrets.SI_MCP_TOKEN }}
          persist-credentials: false
          path: project
          fetch-depth: 1
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install hosted dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > "$RUNNER_TEMP/setup.log" 2>&1
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >> "$RUNNER_TEMP/setup.log" 2>&1
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o "$RUNNER_TEMP/maven.tar.gz"
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo 'SETUP_OK=1'
      - name: Sentinel and baseline in isolated OSGi
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [ "$sha" = be507661db35990ec40ab0f105bd045f0ff08d02 ] || exit 1
          echo "SOURCE_SHA=$sha"
          python3 tools/проверить-матрицу-прав.py > "$RUNNER_TEMP/private-matrix.log" 2>&1 && matrix=0 || matrix=$?
          echo "MATRIX_BASE_EXIT=$matrix"
          cat > server/tests/si.edt.mcp.server.tests/src/si/edt/mcp/server/Agent13MatrixIsolationSentinelTest.java <<'JAVA'
          package si.edt.mcp.server;
          import static org.junit.Assert.*;
          import java.util.List;
          import java.util.Map;
          import org.junit.Test;
          import si.edt.mcp.server.toolkit.IMcpTool;
          import si.edt.mcp.server.toolkit.McpToolCatalog;
          public class Agent13MatrixIsolationSentinelTest {
            @Test public void ordinaryRegistrationSurvivesMatrixFixture() {
              McpToolCatalog registry = McpToolCatalog.getInstance();
              String id = "agent13_sentinel_unique_8c5a";
              String alias = "agent13_sentinel_alias_8c5a";
              IMcpTool prior = new IMcpTool() {
                public String getName() { return id; }
                public List<String> getAliases() { return List.of(alias); }
                public String getDescription() { return "sentinel"; }
                public String getInputSchema() { return "{}"; }
                public String execute(Map<String,String> params) { return ""; }
              };
              registry.register(prior);
              assertSame(prior, registry.getTool(id));
              assertSame(prior, registry.getTool(alias));
              TheAccessLevelMatrixMatchesTheCatalogueTest fixture = new TheAccessLevelMatrixMatchesTheCatalogueTest();
              try {
                fixture.setUp();
                fixture.tearDown();
                assertSame("ordinary registered identity must be restored", prior, registry.getTool(id));
                assertSame("ordinary registered alias must be restored", prior, registry.getTool(alias));
              } finally { registry.unregister(id); }
            }
          }
          JAVA
          cd server
          set +e
          xvfb-run -a "$RUNNER_TEMP/apache-maven-3.9.9/bin/mvn" -B -fae -ntp -pl targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests -am '-Dtest=TheAccessLevelMatrixMatchesTheCatalogueTest,Agent13MatrixIsolationSentinelTest' verify > "$RUNNER_TEMP/private-maven.log" 2>&1
          rc=$?
          set -e
          echo "MAVEN_EXIT=$rc"
          python3 - "$rc" "$matrix" <<'PY'
          import pathlib,sys,xml.etree.ElementTree as E
          want={'TheAccessLevelMatrixMatchesTheCatalogueTest','Agent13MatrixIsolationSentinelTest'}
          seen={}
          sentinel_marker=False
          for f in pathlib.Path('.').glob('**/target/surefire-reports/TEST-*.xml'):
              try:
                  r=E.parse(f).getroot(); name=r.get('name','').rsplit('.',1)[-1]
                  if name in want:
                      if name in seen: raise ValueError('duplicate')
                      seen[name]=tuple(int(r.attrib[k]) for k in ('tests','failures','errors','skipped'))
                      if name == 'Agent13MatrixIsolationSentinelTest':
                          failures=r.findall('.//failure')
                          sentinel_marker=any((x.get('message') or '').startswith('ordinary registered identity must be restored') for x in failures)
              except Exception:
                  print('PARSE_ERROR=1'); sys.exit(2)
          for name in sorted(want): print(name+'='+str(seen.get(name)))
          print('IDENTITY_LOST_MARKER='+str(int(sentinel_marker)))
          print('ARTIFACTS_UPLOADED=0')
          baseline=seen.get('TheAccessLevelMatrixMatchesTheCatalogueTest')
          sentinel=seen.get('Agent13MatrixIsolationSentinelTest')
          ok=sentinel_marker and baseline == (2,0,0,0) and sentinel == (1,1,0,0) and int(sys.argv[1]) != 0 and int(sys.argv[2]) == 0
          print('EXPECTED_COUNTEREXAMPLE_CONFIRMED='+str(int(ok)))
          sys.exit(0 if ok else 1)
          PY
