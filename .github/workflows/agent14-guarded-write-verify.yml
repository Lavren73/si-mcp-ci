name: Agent 14 Guarded Write Verify (8903b494)
on:
  push:
    branches:
      - agent/14-hosted-guarded-verify
permissions:
  contents: read
concurrency:
  group: agent14-hosted-guarded-verify
  cancel-in-progress: true

jobs:
  guarded_write_verify:
    name: "Guarded Write (8903b494): OSGi focused + neg-ctrls + full reactor"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      MAVEN_OPTS: -Xmx4g
    steps:
      - name: Setup JDK 17 & Python 3.13
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache Maven and p2 repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-simcp-v1
          restore-keys: |
            ${{ runner.os }}-m2-simcp-

      - name: Install Maven 3.9.9, Xvfb & pytest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          if [ ! -x /opt/apache-maven-3.9.9/bin/mvn ]; then
            curl -fsSL --retry 4 --retry-delay 2 https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://downloads.apache.org/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz \
              || curl -fsSL --retry 4 --retry-delay 2 https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
            sudo tar -xzf /tmp/mvn.tgz -C /opt
          fi
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          /opt/apache-maven-3.9.9/bin/mvn -version
          python3 -m pip install -q pytest pytest-subtests || true

      - name: Checkout exact SHA 8903b494ba95c42ba09443d056fcc55f9bf458d8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SI_MCP_DEPLOY_KEY }}" > "$HOME/.ssh/si_mcp_key"
          chmod 600 "$HOME/.ssh/si_mcp_key"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/si_mcp_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --branch agent/14-guarded-write-draft --depth=20 git@github.com:Lavren73/SI-MCP.git src
          cd src
          git checkout -q 8903b494ba95c42ba09443d056fcc55f9bf458d8
          echo "EXACT_GUARD_SHA=$(git rev-parse HEAD)"

      - name: Run static gates, focused OSGi tests, negative controls & full reactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INNER'
          import pathlib, subprocess, xml.etree.ElementTree as ET

          src = pathlib.Path("src")
          srv = src / "server"

          def run_junit(modules_pl, test_bundle, classes):
              rep = srv / "tests" / test_bundle / "target/surefire-reports"
              if rep.exists():
                  for xp in rep.glob("TEST-*.xml"):
                      xp.unlink()
              r = subprocess.run([
                  "xvfb-run", "-a", "/opt/apache-maven-3.9.9/bin/mvn", "-B", "-ntp", "-Dstyle.color=never",
                  "-pl", modules_pl, "-am", f"-Dtest={','.join(classes)}", "verify"
              ], cwd=srv, capture_output=True, text=True)
              t = f = e = s = 0
              rows = []
              fails = []
              if rep.exists():
                  for xp in sorted(rep.glob("TEST-*.xml")):
                      root = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                      ct = int(root.attrib.get("tests", 0))
                      cf = int(root.attrib.get("failures", 0))
                      ce = int(root.attrib.get("errors", 0))
                      cs = int(root.attrib.get("skipped", 0))
                      t += ct; f += cf; e += ce; s += cs
                      rows.append(f"{root.attrib.get('name')}: T={ct} F={cf} E={ce} S={cs}")
                      for tc in root.findall("testcase"):
                          bad = tc.find("failure")
                          if bad is None:
                              bad = tc.find("error")
                          if bad is not None:
                              fails.append(f"{root.attrib.get('name')}#{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:260]}")
              return r.returncode, t, f, e, s, rows, fails, r.stdout

          # 1. Pre-build static gates + Python tests
          r_txt = subprocess.run(["python3", "tools/проверка-текста.py"], cwd=src, capture_output=True, text=True)
          print(f"GW_TEXT exit={r_txt.returncode} last={(r_txt.stdout.strip().splitlines() or [''])[-1]}", flush=True)
          assert r_txt.returncode == 0

          r_gates = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"GW_PREBUILD_GATES exit={r_gates.returncode}", flush=True)
          print(r_gates.stdout.strip(), flush=True)
          assert r_gates.returncode == 0

          r_py = subprocess.run(["python3", "-m", "pytest", "server/scripts/tests", "client/tests", "-q"],
                                cwd=src, capture_output=True, text=True)
          print(f"GW_PYTEST exit={r_py.returncode} last={(r_py.stdout.strip().splitlines() or [''])[-1]}", flush=True)
          if r_py.returncode != 0:
              print(r_py.stdout[-2000:] + "\n" + r_py.stderr[-2000:], flush=True)
          assert r_py.returncode == 0

          # 2. Focused OSGi server tests (schema, budgets, contracts, guarded write)
          srv_focused = [
              "si.edt.mcp.server.toolkit.ops.ModuleSourceGuardedWriteTest",
              "si.edt.mcp.server.toolkit.ops.ModuleSourceWriterTest",
              "si.edt.mcp.server.TheSchemaShapeIsFrozenTest",
              "si.edt.mcp.server.TheToolListHasAWeightBudgetTest",
              "si.edt.mcp.server.TheProseOfParameterDescriptionsIsWeighedTest",
              "si.edt.mcp.server.DeclaredShapeIsWhatToolsAnswerTest",
              "si.edt.mcp.server.support.ErrorTagsContractTest",
              "si.edt.mcp.server.wire.ARefusalCarriesATextBlockTest",
          ]
          rc1, t1, f1, e1, s1, rows1, fails1, out1 = run_junit(
              "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests",
              "si.edt.mcp.server.tests",
              srv_focused
          )
          for row in rows1:
              print("  SRV_FOCUSED", row, flush=True)
          for fl in fails1:
              print("  SRV_FAIL", fl, flush=True)
          print(f"GW_SRV_FOCUSED exit={rc1} T={t1} F={f1} E={e1} S={s1}", flush=True)
          if rc1 != 0 or f1 != 0 or e1 != 0:
              print(out1[-4000:], flush=True)
          assert rc1 == 0 and f1 == 0 and e1 == 0

          # 3. Focused OSGi oform tests
          oform_focused = [
              "si.edt.mcp.oform.OrdinaryFormModuleGuardedWriteTest",
              "si.edt.mcp.oform.ADirtyEditorRefusesTheContainerWriteTest",
              "si.edt.mcp.oform.AnOrdinaryFormModuleAnswersByItsAddressTest",
              "si.edt.mcp.oform.TwoPublicWritesRaceOneContainerTest",
          ]
          rc2, t2, f2, e2, s2, rows2, fails2, out2 = run_junit(
              "targets/default,bundles/si.edt.mcp.server,bundles/si.edt.mcp.oform,tests/si.edt.mcp.oform.tests",
              "si.edt.mcp.oform.tests",
              oform_focused
          )
          for row in rows2:
              print("  OFORM_FOCUSED", row, flush=True)
          for fl in fails2:
              print("  OFORM_FAIL", fl, flush=True)
          print(f"GW_OFORM_FOCUSED exit={rc2} T={t2} F={f2} E={e2} S={s2}", flush=True)
          if rc2 != 0 or f2 != 0 or e2 != 0:
              print(out2[-4000:], flush=True)
          assert rc2 == 0 and f2 == 0 and e2 == 0

          # 4. Negative control A: disable expectedRevision mismatch check in ModuleSourceWriter
          msw = srv / "bundles/si.edt.mcp.server/src/si/edt/mcp/server/toolkit/ops/ModuleSourceWriter.java"
          orig_msw = msw.read_text(encoding="utf-8")
          try:
              needle = "if (!Objects.equals(expectedRevision, beforeToken))"
              assert needle in orig_msw
              msw.write_text(orig_msw.replace(needle, "if (false)"), encoding="utf-8")
              nrc, nt, nf, ne, ns, _, _, _ = run_junit(
                  "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests",
                  "si.edt.mcp.server.tests",
                  ["si.edt.mcp.server.toolkit.ops.ModuleSourceGuardedWriteTest"]
              )
              print(f"GW_NEG_CTRL_STALE_REV exit={nrc} T={nt} F={nf} E={ne}", flush=True)
              assert nrc != 0 and (nf + ne) >= 2
          finally:
              msw.write_text(orig_msw, encoding="utf-8")

          # 5. Negative control B: ignore unsynchronized buffer barrier in ModuleSourceWriter
          try:
              needle2 = "if (liveExists && bufState.attached && !bufState.synchronizedWithDisk)"
              assert needle2 in orig_msw
              msw.write_text(orig_msw.replace(needle2, "if (false)"), encoding="utf-8")
              nrc, nt, nf, ne, ns, _, _, _ = run_junit(
                  "targets/default,bundles/si.edt.mcp.server,tests/si.edt.mcp.server.tests",
                  "si.edt.mcp.server.tests",
                  ["si.edt.mcp.server.toolkit.ops.ModuleSourceGuardedWriteTest"]
              )
              print(f"GW_NEG_CTRL_UNSYNC_BUF exit={nrc} T={nt} F={nf} E={ne}", flush=True)
              assert nrc != 0 and (nf + ne) >= 1
          finally:
              msw.write_text(orig_msw, encoding="utf-8")

          # 6. Full reactor verification (all bundles & all tests, no skips allowed)
          for xp in srv.rglob("TEST-*.xml"):
              xp.unlink()
          r_mvn = subprocess.run([
              "xvfb-run", "-a", "/opt/apache-maven-3.9.9/bin/mvn", "-B", "-ntp", "-Dstyle.color=never",
              "-fae", "verify"
          ], cwd=srv, capture_output=True, text=True)
          print(f"GW_FULL_MVN_EXIT={r_mvn.returncode}", flush=True)
          if r_mvn.returncode != 0:
              print(r_mvn.stdout[-3000:], flush=True)

          for bundle in ("si.edt.mcp.server.tests", "si.edt.mcp.oform.tests"):
              bdir = srv / "tests" / bundle / "target/surefire-reports"
              xmls = sorted(bdir.glob("TEST-*.xml")) if bdir.exists() else []
              tot = [0, 0, 0, 0]
              fails = []
              for xp in xmls:
                  r = ET.fromstring(xp.read_text(encoding="utf-8", errors="replace"))
                  tot[0] += int(r.attrib.get("tests", 0))
                  tot[1] += int(r.attrib.get("failures", 0))
                  tot[2] += int(r.attrib.get("errors", 0))
                  tot[3] += int(r.attrib.get("skipped", 0))
                  for tc in r.findall("testcase"):
                      bad = tc.find("failure")
                      if bad is None:
                          bad = tc.find("error")
                      if bad is not None:
                          fails.append(f"{r.attrib.get('name')}#{tc.attrib.get('name')}({bad.tag}): {(bad.attrib.get('message') or '')[:200]}")
              print(f"GW_FULL_JUNIT {bundle} xmls={len(xmls)} T={tot[0]} F={tot[1]} E={tot[2]} S={tot[3]}", flush=True)
              for f in fails:
                  print("  FULL_FAIL:", f, flush=True)
              assert tot[1] == 0 and tot[2] == 0

          r_gates2 = subprocess.run(["bash", "scripts/run-gates.sh"], cwd=srv, capture_output=True, text=True)
          print(f"GW_POSTBUILD_GATES exit={r_gates2.returncode}", flush=True)
          print(r_gates2.stdout.strip(), flush=True)
          assert r_gates2.returncode == 0
          assert r_mvn.returncode == 0
          print("GW_ALL_VERIFIED_0F_0E=1", flush=True)
          PY_INNER
