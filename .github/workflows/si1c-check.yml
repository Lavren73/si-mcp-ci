name: Тест своего Docker runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 10
    steps:
      - name: Проверить runner и установленные программы
        run: |
          set -euo pipefail
          echo 'Тест выполняется на выделенном self-hosted runner'
          test -x /opt/1cv8/x86_64/8.3.27.2342/1cv8
          EDT_CLI=$(find /opt/si-edt -type f -name 1cedtcli -print -quit)
          test -n "$EDT_CLI"
          mkdir -p "$RUNNER_TEMP/si1c-cli-check"
          timeout 240s xvfb-run -a "$EDT_CLI" -data "$RUNNER_TEMP/si1c-cli-check" -command version
      - name: Проверить лицензию конфигуратором на пустой ИБ
        run: |
          set -euo pipefail
          test -s /home/runner/test-ib/1Cv8.1CD
          LOG="$RUNNER_TEMP/si1c-designer.log"
          OUT="$RUNNER_TEMP/si1c-empty.cf"
          set +e
          timeout 150s xvfb-run -a /opt/1cv8/x86_64/8.3.27.2342/1cv8 \
            DESIGNER '/F/home/runner/test-ib' /DumpCfg "$OUT" /DisableStartupDialogs /Out "$LOG"
          code=$?
          set -e
          echo "Код конфигуратора: $code"
          if [ -f "$LOG" ]; then cat "$LOG"; fi
          test "$code" -eq 0 && test -s "$OUT"
