name: Инвентаризация доступности лицензии без изменения
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Проверить наличие лицензий без чтения их содержимого
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os
          home=pathlib.Path.home();stand=home/'.si-mcp-agent16-test-staging/si16-cliimport-42924163619-N8B9et'
          if not stand.is_dir() or stand.is_symlink():raise RuntimeError('stand missing')
          dirs={'VERSION_CONF':pathlib.Path('/opt/1cv8/x86_64/8.3.27.2342/conf'),'ROOT_CONF':pathlib.Path('/opt/1cv8/conf'),'SHARED':pathlib.Path('/var/1C/licenses'),'RUNNER_HOME_CONF':home/'.1cv8/conf','RUNNER_HOME_ALT':home/'.1cv8/1C/1cv8','ISOLATED_HOME_CONF':stand/'home/.1cv8/conf','ISOLATED_HOME_ALT':stand/'home/.1cv8/1C/1cv8'}
          for label,p in dirs.items():
              print('RESULT_'+label+'_EXISTS='+str(p.is_dir()).lower())
              if not p.is_dir():continue
              try:files=[x for x in p.iterdir() if x.name.lower().endswith('.lic') and x.is_file()]; readable=sum(os.access(x,os.R_OK) for x in files)
              except OSError:print('RESULT_'+label+'_LISTABLE=false');continue
              print('RESULT_'+label+'_LISTABLE=true');print('RESULT_'+label+'_LICENSE_FILE_COUNT='+str(len(files)));print('RESULT_'+label+'_READABLE_LICENSE_COUNT='+str(readable))
          for label,p in [('VERSION',dirs['VERSION_CONF']/'conf.cfg'),('ROOT',dirs['ROOT_CONF']/'conf.cfg'),('RUNNER_HOME',dirs['RUNNER_HOME_ALT']/'location.cfg'),('ISOLATED_HOME',dirs['ISOLATED_HOME_ALT']/'location.cfg')]:
              print('RESULT_'+label+'_CONFIG_EXISTS='+str(p.is_file()).lower())
          print('RESULT_NO_LICENSE_CONTENT_READ=true');print('RESULT_NOTHING_CHANGED=true')
          PY
