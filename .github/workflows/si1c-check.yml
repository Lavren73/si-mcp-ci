name: Тест своего Docker runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Проверить поставляемые Java без изменения установок
        shell: bash
        run: |
          set -u
          for root in /opt/si-edt /usr/lib/jvm /opt/java; do
            [ -d "$root" ] || continue
            while IFS= read -r -d '' JAVA; do
              VERSION=$(timeout 10s "$JAVA" -version 2>&1 | head -1 || true)
              printf 'JAVA_INVENTORY %s\n' "$VERSION"
              if [ -x "$(dirname "$JAVA")/javac" ]; then echo 'JAVA_INVENTORY_JAVAC=true'; else echo 'JAVA_INVENTORY_JAVAC=false'; fi
              if [ -f "$(dirname "$(dirname "$JAVA")")/jmods/javafx.graphics.jmod" ]; then echo 'JAVA_INVENTORY_JAVAFX=true'; else echo 'JAVA_INVENTORY_JAVAFX=false'; fi
            done < <(find "$root" -type f -path '*/bin/java' -print0 2>/dev/null)
          done
