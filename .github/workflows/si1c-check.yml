name: Диагностика лицензии по сохранённым журналам
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Прочитать только признаки в журнале и состояние процессов
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,re
          base=pathlib.Path.home()/'.si-mcp-agent16-test-staging';r=base/'si16-cliimport-42924163619-N8B9et'
          if base.is_symlink() or r.is_symlink() or not r.is_dir() or r.resolve().parent!=base.resolve():raise RuntimeError('stand identity not confirmed')
          f=r/'ib_import.log'
          if not f.is_file() or f.is_symlink() or f.stat().st_size>10000000:raise RuntimeError('bad saved log')
          text=f.read_text(encoding='utf8',errors='replace')
          print('RESULT_IMPORT_LOG_LINES='+str(len(text.splitlines())))
          for key,pat in {'LICENSE_NOT_FOUND':r'License not found','NO_LICENSE':r'no (?:available |valid )?licen[cs]e','PLATFORM_EXECUTION':r'platform execution|platform.*process|процесс.*платформ','PLATFORM_START_FAILED':r'(?:cannot|failed to|could not|не удалось).{0,80}(?:start|launch|запус).{0,80}(?:platform|платформ)','DESIGNER_START':r'\bDESIGNER\b|конфигуратор','DUMP_CONFIG':r'DumpConfigToFiles|выгрузк.{0,20}конфигурац','OSGI_EXCEPTION':r'!ENTRY|!STACK|java\.lang\.[A-Za-z]+Exception'}.items():
              print('RESULT_IMPORT_'+key+'='+str(bool(re.search(pat,text,re.I))).lower())
          methods=[]
          for m in re.findall(r'(?m)^\s*at\s+((?:com\._1c|org\.eclipse|java)\.[\w.$]+)\((?:[\w.$]+:\d+|Unknown Source)\)',text):
              if m not in methods:methods.append(m)
          for m in methods[:15]:print('RESULT_STACK_METHOD='+m)
          count=0;unreadable=0
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  d=(p/'cmdline').read_bytes()+b'\n'+(p/'environ').read_bytes()
                  if str(r).encode() in d:count+=1
              except OSError:unreadable+=1
          print('RESULT_STAND_PROCESSES='+str(count));print('RESULT_UNREADABLE_PROCESS_COUNT='+str(unreadable));print('RESULT_STAND_UNCHANGED=true')
          PY
