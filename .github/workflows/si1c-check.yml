name: Тест своего Docker runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Проверить тип CLI и конфигурацию запуска
        shell: bash
        run: |
          set -euo pipefail
          CLI=$(find /opt/si-edt -type f -name 1cedtcli -print -quit)
          export CLI
          python3 - <<'PY'
          import hashlib,os,pathlib
          p=pathlib.Path(os.environ['CLI']); data=p.read_bytes()
          print('RESULT_CLI_SHA256='+hashlib.sha256(data).hexdigest())
          print('RESULT_CLI_HEAD='+repr(data[:24]))
          if data.startswith(b'#!'):
              print('CLI_SCRIPT_BEGIN')
              print(data.decode('utf8','replace')[:6000])
              print('CLI_SCRIPT_END')
          for name in ('1cedtcli.ini','1cedt.ini'):
              f=p.parent/name
              if f.is_file():
                  print('INI_BEGIN '+name)
                  print(f.read_text(errors='replace')[:4000])
                  print('INI_END')
          PY
