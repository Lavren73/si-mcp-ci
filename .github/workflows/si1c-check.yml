name: Тест своего Docker runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Исходники SI-MCP с точной ревизией
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: d03eea5ea294b579f811afb412c081076baebc9b
          ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
          path: project
          persist-credentials: false
      - name: JDK 17 c JavaFX
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          java-package: jdk+fx
      - name: Сборка p2 без тестов
        working-directory: project/server
        env:
          MAVEN_OPTS: -Xmx3g
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = d03eea5ea294b579f811afb412c081076baebc9b
          mvn -B -ntp -Dstyle.color=never -DskipTests package > "$RUNNER_TEMP/si16-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/si16-build.log"; exit 1; }
          tail -30 "$RUNNER_TEMP/si16-build.log"
          SITE=repositories/si.edt.mcp.server.repository/target/repository
          test -f "$SITE/content.jar" || test -f "$SITE/content.xml"
          echo 'RESULT_BUILD_ONLY_TESTS_SKIPPED=true'
      - name: Сохранить только p2 сайт на один день
        uses: actions/upload-artifact@v4
        with:
          name: si16-p2-d03eea5
          path: project/server/repositories/si.edt.mcp.server.repository/target/repository/
          if-no-files-found: error
          retention-days: 1
