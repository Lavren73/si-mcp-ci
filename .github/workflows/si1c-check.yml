name: Аудит сохранённого тестового импорта
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Прочитать признаки ошибки без изменений
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,re
          base=pathlib.Path.home()/'.si-mcp-agent16-test-staging'
          r=base/'si16-cliimport-42924163619-N8B9et'
          if base.is_symlink() or r.is_symlink() or not r.is_dir() or r.resolve().parent!=base.resolve():raise RuntimeError('stand identity not confirmed')
          print('RESULT_SAVED_STAND_FOUND=true')
          print('RESULT_MARKER_PRESENT='+str((r/'PENDING_MUTATION_DO_NOT_CLEAN').is_file()).lower())
          f=r/'ib_import.log'
          print('RESULT_SAVED_IMPORT_LOG='+str(f.is_file() and not f.is_symlink()).lower())
          if not f.is_file() or f.is_symlink() or f.stat().st_size>10000000:raise RuntimeError('bad saved log')
          t=f.read_text(encoding='utf8',errors='replace').casefold();x=t.find('license not found')
          print('RESULT_EXACT_LICENSE_NOT_FOUND='+str(x>=0).lower())
          if x>=0:
              scope=t[max(0,x-2000):min(len(t),x+2000)]
              for k,pat in {'DESIGNER':r'designer|конфигуратор','INFOBASE':r'infobase|информационн.{0,10}баз','DUMP':r'dumpconfig|dumpcfg|выгруз','PLATFORM':r'platform|платформ','EXCEPTION':r'exception|исключени','COMMAND_FAILURE':r'failed|error|ошибк|не удалось'}.items():print('RESULT_NEAR_LICENSE_'+k+'='+str(bool(re.search(pat,scope))).lower())
          print('RESULT_PROJECT_FILES_COUNT='+str(sum(1 for p in (r/'workspace').glob('*/.project') if p.is_file())))
          count=0;unreadable=0
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  d=(p/'cmdline').read_bytes()+b'\n'+(p/'environ').read_bytes()
                  if str(r).encode() in d:count+=1
              except OSError:unreadable+=1
          print('RESULT_VISIBLE_STAND_PROCESSES='+str(count));print('RESULT_UNREADABLE_PROCESS_COUNT='+str(unreadable));print('RESULT_STAND_LEFT_UNCHANGED=true')
          PY
