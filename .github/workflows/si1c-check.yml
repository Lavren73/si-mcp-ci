name: Анализ журнала EDT сохранённого стенда
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Сопоставить исключения и блоки журнала
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,re
          base=pathlib.Path.home()/'.si-mcp-agent16-test-staging';r=base/'si16-p2run-42925545767-kYZUhT'
          if base.is_symlink() or r.is_symlink() or not r.is_dir() or r.resolve().parent!=base.resolve():raise RuntimeError('stand identity not confirmed')
          for label,path in [('CONSOLE',r/'edt.log'),('WORKSPACE',r/'workspace/.metadata/.log')]:
              if path.is_symlink() or not path.is_file():continue
              if path.stat().st_size>20000000:raise RuntimeError('log too large')
              lines=path.read_text(encoding='utf8',errors='replace').splitlines();print('RESULT_'+label+'_LINES='+str(len(lines)))
              for word in ('LifecycleException','ExceptionInInitializerError','InaccessibleObjectException',"The 'project' argument cannot be 'null'"):
                  indexes=[i for i,l in enumerate(lines) if word in l]
                  print('RESULT_'+label+'_'+re.sub(r'[^A-Za-z]','_',word).upper()+'_COUNT='+str(len(indexes)))
                  if not indexes:continue
                  i=indexes[-1];snippet='\n'.join(lines[max(0,i-8):min(len(lines),i+55)])
                  print('RESULT_'+label+'_EVENT_LINE='+str(i+1))
                  for method in re.findall(r'(?m)^\s*at\s+((?:com\._1c|org\.eclipse|si\.edt\.mcp|java|jdk|sun)\.[\w.$]+)\(',snippet)[:14]:print('RESULT_'+label+'_EVENT_METHOD='+method)
                  for mod,pkg in re.findall(r"module\s+([a-zA-Z0-9._]+)\s+does not\s+[\"']opens\s+([a-zA-Z0-9._]+)[\"']",snippet):print('RESULT_JAVA_MODULE_CLOSED='+mod+'/'+pkg)
              print('RESULT_'+label+'_LICENSE_NOT_FOUND='+str('license not found' in '\n'.join(lines).casefold()).lower())
          print('RESULT_STAND_UNCHANGED=true')
          PY
