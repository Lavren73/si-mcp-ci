name: Тест своего Docker runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Ресурсы и инструменты для отдельного стенда
        shell: bash
        run: |
          set -u
          python3 - <<'PY'
          import os,shutil,glob,re
          free=shutil.disk_usage(os.environ['RUNNER_TEMP']).free
          print('RESULT_FREE_MIB='+str(free//(1024*1024)))
          for tool in ['mvn','java','git','curl','python3','xvfb-run']:
              print('RESULT_TOOL_'+tool.upper().replace('-','_')+'='+str(bool(shutil.which(tool))).lower())
          versions=set()
          for p in glob.glob('/opt/1cv8/x86_64/*/1cv8'):
              s=p.split('/')[-2]
              if re.fullmatch(r'\d+\.\d+\.\d+\.\d+',s):versions.add(s)
          print('RESULT_PLATFORM_BIN_VERSIONS='+(','.join(sorted(versions)) or 'none'))
          PY
          printf 'RESULT_EDT_SIZE_KIB='
          du -sk /opt/si-edt 2>/dev/null | awk '{print $1}'
          if command -v java >/dev/null; then java -version 2>&1 | head -1; fi
