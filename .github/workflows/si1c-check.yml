name: Тест своего Docker runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 8
    steps:
      - name: EDT обнаружение платформ в отдельной временной области
        shell: bash
        run: |
          set -u
          DIR=$(mktemp -d "${RUNNER_TEMP:?}/si16-discovery-${GITHUB_RUN_ID}-XXXXXX")
          trap 'rm -rf -- "$DIR"' EXIT
          CLI=$(find /opt/si-edt -type f -name 1cedtcli -print -quit)
          if [ -z "$CLI" ]; then echo 'RESULT_CLI_MISSING'; exit 0; fi
          mkdir "$DIR/workspace"
          set +e
          timeout -s KILL 150s xvfb-run -a "$CLI" -data "$DIR/workspace" -command platform-versions > "$DIR/platforms.txt" 2>&1
          CODE=$?
          set -e
          export CODE
          python3 - "$DIR/platforms.txt" <<'PY'
          import os,re,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          print('RESULT_EDT_PLATFORM_VERSIONS_EXIT='+os.environ['CODE'])
          print('RESULT_PLATFORM_8327_2342_LISTED='+str(bool(re.search(r'(?<!\d)8\.3\.27\.2342(?!\d)',text))).lower())
          print('RESULT_ANY_PLATFORM_VERSION_LISTED='+str(bool(re.search(r'(?<!\d)8\.\d+\.\d+\.\d+(?!\d)',text))).lower())
          for line in text.splitlines():
              if re.search(r'none are supported|no supported|не поддержива|не найдены|not found',line,re.I):
                  print('RESULT_UNSUPPORTED_OR_NOT_FOUND_INDICATOR=true')
                  break
          PY
      - name: SI-MCP признаки установки и локальный порт
        shell: bash
        run: |
          python3 - <<'PY'
          import os,socket
          matches=[]
          for root,dirs,files in os.walk('/opt/si-edt',followlinks=False):
              matches.extend(n for n in files+dirs if n.startswith('si.edt.mcp.server'))
          print('RESULT_MCP_INSTALL_ARTIFACTS_PRESENT='+str(bool(matches)).lower())
          print('RESULT_MCP_INSTALL_ARTIFACTS_COUNT='+str(len(matches)))
          try:
              with socket.create_connection(('127.0.0.1',12260),timeout=2): pass
              print('RESULT_LOCAL_PORT_12260_LISTENING=true')
          except OSError:
              print('RESULT_LOCAL_PORT_12260_LISTENING=false')
          PY
