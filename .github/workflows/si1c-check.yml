name: Проверка неопределённой привязки тестовой ИБ
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Без запуска EDT проверить состояние сохранённого стенда
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,re
          base=pathlib.Path.home()/'.si-mcp-agent16-test-staging';r=base/'si16-p2run-42926257777-ihTomZ'
          if base.is_symlink() or r.is_symlink() or not r.is_dir() or r.resolve().parent!=base.resolve():raise RuntimeError('stand identity not confirmed')
          ws=r/'workspace';name='SI16Check42926257777'
          print('RESULT_STAND_FOUND=true');print('RESULT_PENDING_MARKER_PRESENT='+str((r/'PENDING_MUTATION_DO_NOT_CLEAN').is_file()).lower())
          print('RESULT_PROJECT_FILE_PRESENT='+str((ws/name/'.project').is_file()).lower());print('RESULT_IB_FILE_PRESENT='+str((r/'ib/1Cv8.1CD').is_file()).lower())
          launches=[p for p in ws.rglob('*.launch') if p.is_file() and not p.is_symlink()]
          print('RESULT_LAUNCH_FILES_COUNT='+str(len(launches)))
          hit=0
          for p in launches:
              if p.stat().st_size>2000000:continue
              t=p.read_text(encoding='utf8',errors='replace')
              if name in t and 'SI16McpIsolated' in t:hit+=1
          print('RESULT_LAUNCH_FILES_MATCHING_BOTH_NAMES='+str(hit))
          f=r/'edt.log'
          if f.is_file() and not f.is_symlink() and f.stat().st_size<20000000:
              t=f.read_text(encoding='utf8',errors='replace')
              for key,pat in {'LICENSE_NOT_FOUND':r'license not found','LAUNCH_CONFIG_OPERATION':r'create_launch_config|LaunchConfigCreator','INFObASE_ASSOCIATION':r'associat.{0,50}infobase|infobase.{0,50}associat','CONNECTION_TIMEOUT':r'timed out|timeout','ERROR':r'!ENTRY.+\s4\s|\berror\b'} .items():print('RESULT_LOG_'+key.upper()+'='+str(bool(re.search(pat,t,re.I))).lower())
          count=0;unreadable=0
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  d=(p/'cmdline').read_bytes()+b'\n'+(p/'environ').read_bytes()
                  if str(r).encode() in d:count+=1
              except OSError:unreadable+=1
          print('RESULT_VISIBLE_STAND_PROCESSES='+str(count));print('RESULT_UNREADABLE_PROCESS_COUNT='+str(unreadable));print('RESULT_STAND_UNCHANGED=true')
          PY
