name: Тест своего Docker runner
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 6
    steps:
      - name: Проверить границы копии EDT только чтением
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip,os,pathlib,re
          root=pathlib.Path('/opt/si-edt').resolve()
          print('RESULT_EDT_ROOT_SYMLINK='+str(pathlib.Path('/opt/si-edt').is_symlink()).lower())
          launchers=list(root.rglob('1cedt'))
          launchers=[p for p in launchers if p.is_file()]
          print('RESULT_EDT_LAUNCHER_COUNT='+str(len(launchers)))
          external=0;broken=0;links=0
          for here,dirs,files in os.walk(root,followlinks=False):
              for name in dirs+files:
                  p=pathlib.Path(here)/name
                  if not p.is_symlink():continue
                  links+=1
                  try:
                      target=p.resolve(strict=True)
                      if not target.is_relative_to(root):external+=1
                  except (OSError,RuntimeError):broken+=1
          print('RESULT_SYMLINK_COUNT='+str(links))
          print('RESULT_EXTERNAL_SYMLINK_COUNT='+str(external))
          print('RESULT_BROKEN_SYMLINK_COUNT='+str(broken))
          for exe in launchers:
              home=exe.parent
              print('RESULT_LAUNCHER_PARENT_HAS_P2='+str((home/'p2').is_dir()).lower())
              print('RESULT_LAUNCHER_PARENT_HAS_PLUGINS='+str((home/'plugins').is_dir()).lower())
              print('RESULT_LAUNCHER_PARENT_HAS_CONFIG='+str((home/'configuration').is_dir()).lower())
          hits=0; profiles=0
          for p in root.rglob('*.profile.gz'):
              profiles+=1
              try:
                  with gzip.open(p,'rt',encoding='utf8',errors='replace') as f: text=f.read(10000000)
                  if '/opt/si-edt' in text:hits+=1
              except (OSError,EOFError):pass
          print('RESULT_P2_PROFILE_COUNT='+str(profiles))
          print('RESULT_P2_PROFILES_MENTION_INSTALL_PATH='+str(hits))
          PY
