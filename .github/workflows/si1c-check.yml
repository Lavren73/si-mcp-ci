name: Проверить место для сохранения тестов
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Проверить временные каталоги и рабочее место
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,shutil
          home=pathlib.Path.home().resolve(); temp=pathlib.Path(os.environ['RUNNER_TEMP']).resolve();ws=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(); rws=pathlib.Path(os.environ['RUNNER_WORKSPACE']).resolve()
          print('RESULT_HOME_EXISTS='+str(home.is_dir()).lower())
          print('RESULT_HOME_WRITABLE='+str(os.access(home,os.W_OK)).lower())
          print('RESULT_HOME_IN_RUNNER_TEMP='+str(home==temp or temp in home.parents).lower())
          print('RESULT_HOME_IN_WORKSPACE='+str(home==rws or rws in home.parents).lower())
          print('RESULT_RUNNER_WORKSPACE_WRITABLE='+str(os.access(rws,os.W_OK)).lower())
          print('RESULT_HOME_AVAILABLE_MIB='+str(shutil.disk_usage(home).free//(1024*1024)))
          for root,label in [(temp,'TEMP'),(home,'HOME'),(rws,'RUNNER_WORKSPACE')]:
              if not root.is_dir():continue
              paths=list(root.glob('si16-cliimport-42923336536-*'))
              print('RESULT_'+label+'_PREVIOUS_STAND_COUNT='+str(len(paths)))
          count=0;unreadable=0
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdigit():continue
              try:
                  d=(p/'cmdline').read_bytes()+b'\n'+(p/'environ').read_bytes()
                  if b'si16-cliimport-42923336536-' in d:count+=1
              except OSError:unreadable+=1
          print('RESULT_VISIBLE_PREVIOUS_STAND_PROCESSES='+str(count))
          print('RESULT_UNREADABLE_PROCESS_COUNT='+str(unreadable))
          PY
