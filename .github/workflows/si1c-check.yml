name: Аудит журналов агента тестовой ИБ
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Найти причины отказа в журналах своего стенда
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,re
          base=pathlib.Path.home()/'.si-mcp-agent16-test-staging';r=base/'si16-p2run-42926257777-ihTomZ'
          if base.is_symlink() or r.is_symlink() or not r.is_dir() or r.resolve().parent!=base.resolve():raise RuntimeError('stand identity not confirmed')
          candidates=[]
          for root in (r/'home',r/'workspace'):
              for p in root.rglob('*'):
                  if p.is_symlink() or not p.is_file() or p.stat().st_size>10000000:continue
                  if p.suffix.lower() in ('.log','.out','.txt') or p.name=='.log':candidates.append(p)
          print('RESULT_TEST_STAND_LOG_COUNT='+str(len(candidates)))
          flags={'LICENSE_NOT_FOUND':r'license not found|лицензия не найдена','LICENSE_FAILURE':r'ошибк.{0,40}лиценз|licen[cs]e.{0,40}(not found|error|failed)','LOCK':r'configuration.{0,40}(?:locked|lock)|конфигурац.{0,40}блокир','AUTH_FAIL':r'auth fail|authentication failed','AGENT':r'designer.?agent|агент.{0,20}конфигуратор|agentmode'}
          totals={x:0 for x in flags}
          for p in candidates:
              t=p.read_text(encoding='utf8',errors='replace')
              for k,v in flags.items():totals[k]+=bool(re.search(v,t,re.I))
          for k,v in totals.items():print('RESULT_LOGS_WITH_'+k+'='+str(v))
          console=(r/'edt.log').read_text(encoding='utf8',errors='replace')
          names=re.findall(r'/[^\s\"\'<>]*(?:1cedt/ssh-[0-9]+|AgentBaseDir)[^\s\"\'<>]*',console,re.I)
          print('RESULT_CONSOLE_AGENT_PATH_REFERENCES='+str(len(names)))
          print('RESULT_PENDING_MARKER_PRESENT='+str((r/'PENDING_MUTATION_DO_NOT_CLEAN').is_file()).lower())
          print('RESULT_STAND_UNCHANGED=true')
          PY
