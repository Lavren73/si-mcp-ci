name: SI-MCP — проверка теста SnakeYAML на JDK 17
on:
  push:
    branches: [agent/16-yaml-check]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Исходники
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: 626a31f3750e8bc0c31df14d7fa954af94c5b589
          ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
          path: project
          persist-credentials: false
      - name: Среда
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          git -C project rev-parse HEAD
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Maven
        run: |
          curl -fsSL --retry 3 https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o "$RUNNER_TEMP/mvn.tgz"
          tar -xzf "$RUNNER_TEMP/mvn.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - name: Тест загрузки библиотеки и XML-verdict
        working-directory: project/server
        env:
          MAVEN_OPTS: -Xmx3g
          LANG: C.UTF-8
        run: |
          set +e
          xvfb-run -a mvn -B -ntp -Dstyle.color=never -Dtest=YamlBundleLoadingTest -DfailIfNoTests=false verify 2>&1 | tee "$RUNNER_TEMP/yaml.log" | tail -80
          code="${PIPESTATUS[0]}"
          echo "MAVEN_EXIT=$code"
          grep -E 'YamlBundleLoadingTest|Tests run:|No tests found' "$RUNNER_TEMP/yaml.log" | tail -40 || true
          python3 - <<'PYXML'
          import pathlib,xml.etree.ElementTree as E,sys
          files=list(pathlib.Path('.').rglob('TEST-*YamlBundleLoadingTest*.xml'))
          print('YAML_TEST_XML_COUNT',len(files))
          total=0
          for p in files:
              r=E.parse(p).getroot();print('YAML_SUITE',r.get('name'),'tests',r.get('tests'),'failures',r.get('failures'),'errors',r.get('errors'),'skipped',r.get('skipped'))
              total+=int(r.get('tests','0'))
              if int(r.get('failures','0')) or int(r.get('errors','0')) or int(r.get('skipped','0')):sys.exit(1)
          sys.exit(0 if total>=1 else 1)
          PYXML
          xmlcode=$?
          echo "YAML_XML_ASSERT_EXIT=$xmlcode"
          [ "$code" -eq 0 ] && [ "$xmlcode" -eq 0 ]
