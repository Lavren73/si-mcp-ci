name: SI16 аудит путей и результатов поиска лицензии
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Проверить личный запуск и стандартные каталоги без чтения лицензий
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re
          home=pathlib.Path.home();agent=home/'SI-MCP-Polygons/Agent-16';root=agent/'DesignerProbe-42992767563'
          for p in (home/'SI-MCP-Polygons',agent,root):
              if p.is_symlink() or not p.is_dir() or p.stat().st_uid!=os.getuid():raise RuntimeError('Unsafe or wrong personal stand')
          dirs={'RUNNER_HOME_CONF_NESTED':home/'.1cv8/1C/1cv8/conf','RUNNER_HOME_CONF_CASE_ALT':home/'.1cv8/1C/1Cv8/conf','PERSONAL_HOME_CONF_NESTED':root/'home/.1cv8/1C/1cv8/conf','PERSONAL_HOME_CONF_CASE_ALT':root/'home/.1cv8/1C/1Cv8/conf','ROOT_PLATFORM_CONF':pathlib.Path('/opt/1cv8/conf'),'VERSION_PLATFORM_CONF':pathlib.Path('/opt/1cv8/x86_64/8.3.27.2342/conf'),'SHARED_LICENSE':pathlib.Path('/var/1C/licenses'),'SHARED_LICENSE_LOWER':pathlib.Path('/var/1c/licenses')}
          for name,p in dirs.items():
              if not p.exists():print('RESULT_'+name+'_EXISTS=false');continue
              if not p.is_dir() or p.is_symlink():print('RESULT_'+name+'_SKIPPED=true');continue
              try:entries=list(p.iterdir())
              except OSError:print('RESULT_'+name+'_LISTABLE=false');continue
              files=[x for x in entries if x.suffix.lower()=='.lic' and x.is_file() and not x.is_symlink()]
              print('RESULT_'+name+'_LICENSE_FILE_COUNT='+str(len(files)))
              print('RESULT_'+name+'_LICENSE_READABLE_COUNT='+str(sum(os.access(x,os.R_OK) for x in files)))
              for cfg in ('location.cfg','conf.cfg','nethasp.ini','rclic.cfg'):
                  f=p/cfg
                  print('RESULT_'+name+'_'+cfg.replace('.','_').upper()+'_PRESENT='+str(f.is_file() and not f.is_symlink()).lower())
          logs=[root/'designer.log',root/'out/designer-out.log']
          text='\n'.join(x.read_text(encoding='utf8',errors='replace')[:300000] for x in logs if x.is_file() and not x.is_symlink())
          tests={'LICENSE_NOT_FOUND':r'license not found|лицензия не найдена|лицензия не обнаружена','SOFTWARE_FILE_NOT_FOUND':r'файл программной лицензии не найден|software license file.{0,30}not found','NETWORK':r'network|сетев|license server|сервер лиценз','HARDWARE_KEY':r'hasp|hardware.{0,20}key|ключ защиты|локальный ключ','PLATFORM_MESSAGE_PRESENT':r'licen[cs]|лиценз'}
          for n,p in tests.items():print('RESULT_DESIGNER_LOG_'+n+'='+str(bool(re.search(p,text,re.I))).lower())
          print('RESULT_LICENSE_CONTENT_NOT_READ=true')
          print('RESULT_LICENSE_SERVER_AVAILABILITY_NOT_TESTED=true')
          print('RESULT_NO_CONFIG_OR_LICENSE_CHANGED=true')
          PY
