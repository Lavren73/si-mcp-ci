name: SI-MCP — read-only runner kernel and boot observation (11)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: si1c-team-test-stand
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Observe kernel, boot time and visible display drivers without changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,os,pathlib,re,time
          boot=None
          for line in pathlib.Path('/proc/stat').read_text().splitlines():
              if line.startswith('btime '): boot=int(line.split()[1]);break
          uptime=float(pathlib.Path('/proc/uptime').read_text().split()[0])
          visible=[]
          for card in sorted(pathlib.Path('/sys/class/drm').glob('card*')):
              if not re.fullmatch(r'card\d+',card.name):continue
              driver=card/'device/driver'
              try: name=driver.resolve(strict=True).name
              except (OSError,RuntimeError): name=None
              visible.append({'card':card.name,'driver':name})
          data={'kernel_release':os.uname().release,
                'boot_utc':datetime.datetime.fromtimestamp(boot,datetime.timezone.utc).isoformat() if boot else None,
                'uptime_seconds':round(uptime,1),'visible_drm_drivers':visible,
                'scope':'Read-only view in runner container; absent DRM/session details do not describe the host desktop.'}
          print('DIAGNOSTIC_JSON='+json.dumps(data,ensure_ascii=True,sort_keys=True))
          PY
