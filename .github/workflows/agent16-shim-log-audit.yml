name: SI16 аудит загрузки диагностического агента
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Извлечь только типы ошибок и имена Java-классов
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,re
          home=pathlib.Path.home();root=home/'SI-MCP-Polygons/Agent-16/ShimCompiledProbe-43005781074'
          for d in (home/'SI-MCP-Polygons',home/'SI-MCP-Polygons/Agent-16',root):
              if not d.is_dir() or d.is_symlink() or d.stat().st_uid!=os.getuid():raise RuntimeError('Unsafe personal path')
          log=root/'edt.log';text=log.read_text(encoding='utf8',errors='replace')[-1000000:]
          for line in text.splitlines():
              if 'SI16_MAP_COPY_TRANSFORM_' in line:
                  for v in ('APPLIED','FAILED','MISMATCH'):
                      if 'SI16_MAP_COPY_TRANSFORM_'+v in line:print('RESULT_TRANSFORM_'+v+'=true')
              m=re.search(r'(?:Caused by: )?(java\.lang\.(?:NoClassDefFoundError|ClassNotFoundException|IllegalAccessError|VerifyError|UnsupportedClassVersionError)):\s*([\w.$/;-]{1,180})',line)
              if m:print('RESULT_EXCEPTION='+m.group(1)+' CLASS='+m.group(2))
              m=re.search(r'\bat\s+([\w.$]+)\(',line)
              if m and any(k in m.group(1) for k in ('SecureMapAgent','SecurePreferencesMapper','org.eclipse.equinox.launcher','InstrumentationImpl')):print('RESULT_FRAME='+m.group(1))
          print('RESULT_NO_MUTATION_ATTEMPTED=true')
          PY
