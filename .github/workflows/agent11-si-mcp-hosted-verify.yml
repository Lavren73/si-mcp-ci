name: '№11 — SI-MCP verify на hosted (точная голова, приватный исходник через deploy key)'
# Зачем: hosted-раннеры в приватном SI-MCP не стартуют (аккаунт-уровень), а публичный si-mcp-ci
# получает бесплатные GitHub-hosted раннеры. Прогон выполняем здесь, на точном SHA.
# Артефакты НЕ загружаем: репозиторий публичный, логи/артефакты видны всем — только счётчики и хеши.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Точный SHA SI-MCP для проверки'
        required: true
        default: 'fe9fbf2e27cc1a2b2415ebe31dbd7708a202caed'
      scope:
        description: 'client | scripts | both'
        required: true
        default: 'both'
permissions:
  contents: read
concurrency:
  group: si-mcp-hosted-verify-${{ github.event.inputs.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_SHA: ${{ github.event.inputs.sha }}
      SCOPE: ${{ github.event.inputs.scope }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: 1. Приватный исходник SI-MCP на точном SHA (deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "${TARGET_SHA}"
          mkdir -p "$RUNNER_TEMP/.ssh" && chmod 700 "$RUNNER_TEMP/.ssh"
          if printf '%s' "$DEPLOY_KEY" | grep -q 'BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "KEY_KIND=ssh-private-key"
            printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/.ssh/id_deploy"
            chmod 600 "$RUNNER_TEMP/.ssh/id_deploy"
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "$RUNNER_TEMP/.ssh/known_hosts" 2>/dev/null
            GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/.ssh/id_deploy -o UserKnownHostsFile=$RUNNER_TEMP/.ssh/known_hosts -o IdentitiesOnly=yes" \
              git clone --no-checkout git@github.com:Lavren73/SI-MCP.git "$RUNNER_TEMP/src"
          else
            echo "KEY_KIND=token"
            git clone --no-checkout "https://x-access-token:${DEPLOY_KEY}@github.com/Lavren73/SI-MCP.git" "$RUNNER_TEMP/src"
          fi
          cd "$RUNNER_TEMP/src"
          git checkout --detach "$TARGET_SHA"
          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD_SHA=$HEAD_SHA"
          echo "HEAD_TREE=$(git rev-parse HEAD^{tree})"
          echo "HEAD_SUBJECT=$(git log -1 --format=%s)"
          test "$HEAD_SHA" = "$TARGET_SHA" || { echo "SHA MISMATCH"; exit 1; }
          for f in client/make_installer.py client/siagent/codemode.py client/tests/test_review_2026_11_12.py client/tests/test_edt_stand.py; do
            [ -f "$f" ] && sha256sum "$f"
          done
          shred -u "$RUNNER_TEMP/.ssh/id_deploy" 2>/dev/null || rm -f "$RUNNER_TEMP/.ssh/id_deploy"

      - name: 2. Окружение Python (pytest 9.0.3 — как в локальных прогонах №11)
        run: |
          set -euo pipefail
          python3 -V
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --disable-pip-version-check pytest==9.0.3
          "$RUNNER_TEMP/venv/bin/python" -V
          "$RUNNER_TEMP/venv/bin/pytest" --version

      - name: 3. Гейт чистоты текста
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/src"
          if [ -f tools/проверка-текста.py ]; then
            "$RUNNER_TEMP/venv/bin/python" tools/проверка-текста.py > "$RUNNER_TEMP/text-gate.log" 2>&1
            echo "TEXT_GATE_EXIT=$?"
            tail -5 "$RUNNER_TEMP/text-gate.log"
          else
            echo "TEXT_GATE_EXIT=skipped (нет tools/проверка-текста.py)"
          fi

      - name: 4. Сборка установщика
        if: env.SCOPE == 'client' || env.SCOPE == 'both'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src/client"
          "$RUNNER_TEMP/venv/bin/python" make_installer.py | tee "$RUNNER_TEMP/installer.log"
          ls -l "$RUNNER_TEMP/src/si-agent-setup.py"
          sha256sum "$RUNNER_TEMP/src/si-agent-setup.py"

      - name: 5. Focused-тесты клиента
        if: env.SCOPE == 'client' || env.SCOPE == 'both'
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/src/client"
          set +e
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -rf -rs --tb=short -p no:cacheprovider \
            tests/test_review_2026_11_12.py tests/test_windows_install_shortcuts_16.py \
            --junitxml="$RUNNER_TEMP/focused.xml" > "$RUNNER_TEMP/focused.log" 2>&1
          code=$?
          set -e
          echo "FOCUSED_EXIT=$code"; tail -15 "$RUNNER_TEMP/focused.log"

      - name: 6. Полный client/tests с JUnit XML
        if: env.SCOPE == 'client' || env.SCOPE == 'both'
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/src/client"
          set +e
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -rf -rs --tb=short -p no:cacheprovider tests \
            --junitxml="$RUNNER_TEMP/client-junit.xml" > "$RUNNER_TEMP/client-pytest.log" 2>&1
          code=$?
          set -e
          echo "CLIENT_EXIT=$code"
          tail -25 "$RUNNER_TEMP/client-pytest.log"
          grep -A 40 'short test summary info' "$RUNNER_TEMP/client-pytest.log" || true
          sha256sum "$RUNNER_TEMP/client-junit.xml"
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import os,xml.etree.ElementTree as ET
          p=os.path.join(os.environ['RUNNER_TEMP'],'client-junit.xml')
          r=ET.parse(p).getroot(); s=r if r.tag=='testsuite' else r.find('testsuite')
          print('XML_tests=%s failures=%s errors=%s skipped=%s time=%s' % (
              s.get('tests'),s.get('failures'),s.get('errors'),s.get('skipped'),s.get('time')))
          tc=s.findall('testcase'); print('XML_testcase_elements=%d'%len(tc))
          bad=[t for t in tc if t.find('failure') is not None or t.find('error') is not None]
          for t in bad[:10]:
              print('FAILED_OR_ERROR:', t.get('classname'), t.get('name'))
          sk=[t for t in tc if t.find('skipped') is not None]
          for t in sk[:10]: print('SKIPPED:', t.get('classname'), t.get('name'))
          PY

      - name: 7. Серверные скриптовые тесты (python)
        if: env.SCOPE == 'scripts' || env.SCOPE == 'both'
        run: |
          set -uo pipefail
          cd "$RUNNER_TEMP/src"
          if [ -d server/scripts/tests ]; then
            set +e
            "$RUNNER_TEMP/venv/bin/python" -m pytest -q -rf -rs --tb=line -p no:cacheprovider server/scripts/tests \
              --junitxml="$RUNNER_TEMP/scripts-junit.xml" > "$RUNNER_TEMP/scripts-pytest.log" 2>&1
            code=$?
            set -e
            echo "SCRIPTS_EXIT=$code"
            echo "--- short test summary ---"
            grep -A 40 'short test summary info' "$RUNNER_TEMP/scripts-pytest.log" || true
            echo "--- FAILURES (имена и утверждения) ---"
            grep -B2 -A6 -E '^_{5,}' "$RUNNER_TEMP/scripts-pytest.log" || true
            exit "$code"
          else
            echo "SCRIPTS_EXIT=skipped (нет server/scripts/tests)"
          fi

      - name: 8. Итог (только счётчики и хеши — репозиторий публичный)
        if: always()
        run: |
          set -uo pipefail
          echo "TARGET_SHA=$TARGET_SHA"
          echo "SCOPE=$SCOPE"
          for f in client-pytest.log focused.log scripts-pytest.log installer.log text-gate.log; do
            [ -f "$RUNNER_TEMP/$f" ] && echo "--- $f (tail) ---" && tail -6 "$RUNNER_TEMP/$f"
          done
          for f in client-junit.xml focused.xml scripts-junit.xml; do
            [ -f "$RUNNER_TEMP/$f" ] && sha256sum "$RUNNER_TEMP/$f"
          done
          echo "ARTIFACTS_NOT_UPLOADED=true (публичный репозиторий)"
          echo "VERIFY_STEP_DONE=true"
