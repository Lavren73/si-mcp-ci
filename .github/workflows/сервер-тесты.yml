# Тесты сервера MCP.
#
# Публичный «домик»: исходников здесь нет. Код берётся из приватного репозитория
# по deploy key (только чтение, только SI-MCP). Публичный репозиторий не тратит квоту
# минут и получает раннер 4 vCPU / 16 ГБ — этого хватает `mvn verify`, который
# в песочнице участника убивается по памяти (1982 МБ → код 137).
#
# Автор схемы: №13 (агент Arena), 07.11.2026. Ловушка PIPESTATUS и кэш ~/.m2 —
# из наработки №16 (объявление O-100).
name: Тесты сервера

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или SHA в Lavren73/SI-MCP'
        required: true
        default: 'agent/obmen-20261102'
      # Имя входа латиницей: идентификатор входа GitHub принимает только как
      # [a-zA-Z_][a-zA-Z0-9_-]*, кириллица даёт «invalid workflow file» целиком.
      access:
        description: 'Доступ к проекту: auto (токен, если задан, иначе ключ), token или key'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - token
          - key
  push:
    branches: [main]

concurrency:
  group: server-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (13 модулей, тесты в OSGi)
    runs-on: ubuntu-24.04       # не ubuntu-latest: он мигрирует на Ubuntu 26
    timeout-minutes: 60
    # Доступ к приватному проекту можно задать любым из двух секретов ЭТОГО репозитория:
    # SI_MCP_DEPLOY_KEY (приватный SSH-ключ, к нему нужен deploy key в проекте) либо
    # SI_MCP_TOKEN (PAT с чтением проекта — проще: ничего больше настраивать не нужно).
    # Секреты нельзя сравнивать в if:, поэтому заранее считаем только признак «задан/нет».
    #
    # Вход access нужен, чтобы проверить запасной путь, не отзывая PAT:
    #   auto  — токен, если он задан, иначе ключ (обычный режим);
    #   key   — принудительно SSH-ключ (проверка запасного пути);
    #   token — принудительно PAT.
    env:
      HAS_DEPLOY_KEY: ${{ secrets.SI_MCP_DEPLOY_KEY != '' }}
      HAS_TOKEN: ${{ secrets.SI_MCP_TOKEN != '' }}
      USE_TOKEN: ${{ inputs.access != 'key' && secrets.SI_MCP_TOKEN != '' }}
      USE_KEY: ${{ inputs.access != 'token' && secrets.SI_MCP_DEPLOY_KEY != '' && (inputs.access == 'key' || secrets.SI_MCP_TOKEN == '') }}

    steps:
      # Диагностика №13 (08.11.2026): если доступа нет, checkout уходит на HTTPS и падает
      # с «repository not found» — сообщение уводит в сторону (кажется, что репозиторий удалён).
      - name: Задан ли доступ к проекту
        shell: bash
        run: |
          echo "секрет с ключом: $HAS_DEPLOY_KEY, секрет с токеном: $HAS_TOKEN, вход access: ${{ inputs.access || 'auto' }}"
          echo "выбран путь: токен=$USE_TOKEN, ключ=$USE_KEY"
          if [ "$USE_TOKEN" != "true" ] && [ "$USE_KEY" != "true" ]; then
            echo "::error::Нет доступа к Lavren73/SI-MCP. Задайте в ЭТОМ репозитории (si-mcp-ci) один из секретов:"
            echo "  SI_MCP_DEPLOY_KEY — приватный SSH-ключ, публичная половина добавлена deploy key в проект;"
            echo "  SI_MCP_TOKEN      — PAT с чтением проекта (проще всего: одна строка, формат не ломается)."
            echo "Секрет, созданный в репозитории SI-MCP, здесь не виден: workflow выполняется в si-mcp-ci."
            exit 1
          fi

      # Ловушка, найденная №12 (блок O-119): auto-логика считает «секрет задан», а не
      # «токен жив». После отзыва PAT секрет остаётся непустым и мёртвым — прогон молча
      # идёт по мёртвому токену и падает «repository not found», хотя ключ рядом и цел.
      # Здесь токен проверяется живым запросом, и при любом отказе путь переключается
      # на ключ. Значение токена не печатается: только код ответа.
      - name: Токен жив? Иначе — ключ
        if: env.USE_TOKEN == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.SI_MCP_TOKEN }}
        run: |
          set -u
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                 -H "Authorization: Bearer $TOKEN" \
                 https://api.github.com/repos/Lavren73/SI-MCP || echo 000)
          case "$code" in
            200) echo "токен принят, проект виден" ;;
            401) echo "::warning::Токен не принят (401): истёк или отозван." ;;
            404) echo "::warning::Токен жив, но проект не виден (404): нет права Contents на SI-MCP." ;;
            *)   echo "::warning::Проверка токена не удалась (код $code)." ;;
          esac
          if [ "$code" != "200" ]; then
            if [ "$HAS_DEPLOY_KEY" = "true" ]; then
              echo "USE_TOKEN=false" >> "$GITHUB_ENV"
              echo "USE_KEY=true" >> "$GITHUB_ENV"
              echo "переключаюсь на запасной путь: ключ из секрета"
            else
              echo "::error::Токен не работает, и секрета с ключом нет. Задайте SI_MCP_DEPLOY_KEY или свежий SI_MCP_TOKEN."
              exit 1
            fi
          fi

      # Токен идёт первым: одна строка, форматов не ломает. Ключ — запасной путь.
      - name: Исходники SI-MCP по токену (HTTPS)
        if: env.USE_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: ${{ inputs.ref || 'agent/obmen-20261102' }}
          token: ${{ secrets.SI_MCP_TOKEN }}
          path: project
          persist-credentials: false
          fetch-depth: 1

      # Починка №13 (08.11.2026): секрет-ключ повреждается при вставке в окно браузера —
      # теряются переносы строк (ключ становится одной строкой), появляются буквальные \n
      # или CRLF от Windows. Прогон 42530363657 упал с `Load key "…": error in libcrypto`:
      # причина в содержимом секрета, а не в ключе — deploy key в проекте исправен.
      # Теперь ключ проверяется и, если переносы потерялись, восстанавливается ДО checkout.
      # Тело ключа в лог не печатается: только длины, отпечаток и вердикт ssh-keygen.
      - name: Ключ доступа — проверка и восстановление переносов
        if: env.USE_KEY == 'true'
        shell: bash
        env:
          KEY: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        run: |
          set -u
          f=/tmp/deploy_key
          printf '%s' "$KEY" > "$f"
          chmod 600 "$f"
          echo "секрет: $(wc -c < "$f") байт, переносов строк: $(wc -l < "$f")"
          python3 - "$f" <<'PY'
          import subprocess, sys, os
          f = sys.argv[1]
          def читается():
              r = subprocess.run(["ssh-keygen", "-y", "-f", f], capture_output=True, text=True)
              if r.returncode == 0 and r.stdout.strip():
                  return True, ""
              tail = (r.stderr or r.stdout).strip().splitlines()
              return False, (tail[-1] if tail else "ssh-keygen отказал")
          def починить(t):
              правки = []
              if "\r" in t:
                  t = t.replace("\r\n", "\n").replace("\r", "\n"); правки.append("CRLF → LF")
              if "\\n" in t and t.count("\n") < 3:
                  t = t.replace("\\n", "\n"); правки.append("буквальные \\n → переносы")
              if t.count("\n") < 2 and "-----BEGIN" in t:
                  начало = t.index("-----BEGIN"); конец = t.index("-----END") if "-----END" in t else len(t)
                  шапка = t[начало:t.index("-----", начало + 5) + 5]
                  тело = "".join(t[начало + len(шапка):конец].split())
                  хвост = t[конец:].strip() or "-----END OPENSSH PRIVATE KEY-----"
                  t = "\n".join([шапка] + [тело[i:i+70] for i in range(0, len(тело), 70)] + [хвост])
                  правки.append("одна строка → шапка, тело по 70, хвост")
              if not t.endswith("\n"):
                  t += "\n"; правки.append("перевод строки в конце")
              return t, правки
          data = open(f, "rb").read()
          if not data.strip():
              print("::error::Секрет SI_MCP_DEPLOY_KEY пуст — в него ничего не записалось. Кладите ключ файлом, не вставкой: gh secret set SI_MCP_DEPLOY_KEY --repo Lavren73/si-mcp-ci < ~/.ssh/si_mcp_deploy")
              sys.exit(1)
          ок, причина = читается()
          if not ок:
              print("ключ не читается: " + причина)
              t, правки = починить(data.decode("utf-8", "replace"))
              if not правки:
                  print("::error::Переносы строк целы, повреждено тело ключа. Пересоздайте ключ локально: ssh-keygen -t ed25519 -N '' -f ~/.ssh/si_mcp_deploy, затем gh secret set SI_MCP_DEPLOY_KEY --repo Lavren73/si-mcp-ci < ~/.ssh/si_mcp_deploy")
                  sys.exit(1)
              open(f, "w").write(t); os.chmod(f, 0o600)
              print("применены правки: " + ", ".join(правки))
              ок, причина = читается()
              if not ок:
                  print("::error::После правок ключ не читается (" + причина + "). Значение секрета испорчено при вставке — пересоздайте ключ локально и залейте файлом.")
                  sys.exit(1)
          r = subprocess.run(["ssh-keygen", "-lf", f], capture_output=True, text=True)
          print("ключ читается, отпечаток: " + r.stdout.strip())
          open("/tmp/deploy_key_ok", "w").write("1")
          PY

      - name: Ключ принят проектом (проверка до checkout)
        if: env.USE_KEY == 'true'
        shell: bash
        run: |
          set -u
          export GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          if timeout 60 git ls-remote git@github.com:Lavren73/SI-MCP.git HEAD > /tmp/ls.txt 2>&1; then
            echo "проект ответил: $(head -1 /tmp/ls.txt)"
          else
            echo "::error::Ключ читается, но проект его не принял. Проверьте, что эта половина ключа добавлена как deploy key в Lavren73/SI-MCP (Settings → Deploy keys), а не в si-mcp-ci."
            sed -n '1,5p' /tmp/ls.txt
            exit 1
          fi

      # checkout делается вручную: actions/checkout берёт ключ прямо из секрета и не знает
      # о восстановленных переносах. Здесь используется проверенный файл /tmp/deploy_key.
      - name: Исходники SI-MCP по deploy key (SSH)
        if: env.USE_KEY == 'true'
        shell: bash
        run: |
          set -u
          export GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          REF="${{ inputs.ref || 'agent/obmen-20261102' }}"
          git init -q project
          cd project
          git remote add origin git@github.com:Lavren73/SI-MCP.git
          if ! timeout 300 git fetch -q --depth=1 origin "$REF"; then
            echo "::error::Не удалось получить ветку $REF по ключу."
            exit 1
          fi
          git checkout -q FETCH_HEAD
          echo "получено: $(git log --oneline -1)"

      - name: Экран для SWT (Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          echo "xvfb: $(which xvfb-run)"

      - name: Сколько у раннера памяти
        run: |
          echo "процессоров: $(nproc)"
          free -m | head -2
          df -h / | tail -1

      - name: Что собираем
        working-directory: project
        # блок-скаляр обязателен: в обычном (незакавыченном) скаляре
        # конструкция «двоеточие + пробел» делает YAML невалидным
        run: |
          git log -1 --format='коммит: %H%nавтор: %an%nдата: %ad%nтема: %s'

      # Кэш ~/.m2 намеренно НЕ включён: в прогоне 42401605284 восстановленный кэш
      # отдал набор, в котором Maven не нашёл tycho-maven-plugin:4.0.5, и сборка
      # упала на «Unresolveable build extension». Холодный прогон — 8–9 минут.
      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Какой Maven стоит по умолчанию (для протокола)
        run: mvn -v || true

      # Tycho 4.0.5 несовместим с Maven 4: падает на «No implementation for
      # MavenTargetLocationFactory was bound». Поэтому версия пинована ровно та,
      # на которой сборка проверена в песочнице (Maven 3.9.9 + Temurin 17).
      - name: Maven 3.9.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          /opt/apache-maven-3.9.9/bin/mvn -v

      - name: Компиляция (без тестов)
        working-directory: project/server
        shell: bash
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          MAVEN_OPTS: -Xmx3g
        run: |
          xvfb-run -a mvn -B -ntp -Dstyle.color=never -DskipTests compile 2>&1 | tee /tmp/compile.log | tail -40
          exit "${PIPESTATUS[0]}"

      # Код возврата берём из PIPESTATUS: иначе упавший mvn дал бы зелёный шаг,
      # потому что последняя команда конвейера — tail.
      - name: Тесты (mvn verify)
        working-directory: project/server
        shell: bash
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          MAVEN_OPTS: -Xmx3g
        run: |
          xvfb-run -a mvn -B -ntp -Dstyle.color=never verify 2>&1 | tee /tmp/mvn.log | tail -120
          exit "${PIPESTATUS[0]}"

      # Поправка №13 (08.11.2026): шаг зеленел, когда проверка НЕ СОСТОЯЛАСЬ.
      # Измерено на попытке #12: исходники не получились, python3 не нашёл файл сторожа
      # и вышел с кодом 2 — а код 2 здесь означал «падали починены». Шаг рапортовал
      # success и печатал «кто-то починил тест» при полностью упавшем checkout.
      # Теперь сначала проверяется, что сторож запускался и дал вердикт.
      - name: Сторож красных (ТЗ-04)
        if: always()
        shell: bash
        run: |
          set +e
          # Имена переменных только латиницей: bash не принимает кириллицу.
          STOZOR=project/server/scripts/сторож-красных.py
          ETALON=project/docs/отчёты-проверок/эталон-красных-2026-11-07.txt
          if [ ! -f "$STOZOR" ]; then
            echo "::error::Сторож не найден ($STOZOR) — исходники не получены, вердикта по красным нет."
            exit 1
          fi
          vyvod=$(python3 "$STOZOR" /tmp/mvn.log "$ETALON")
          code=$?
          printf '%s\n' "$vyvod"
          if ! printf '%s' "$vyvod" | grep -qE 'Список красных совпал|НОВЫЕ падения|Ушли из списка|ПРОГОН НЕ ПОЛНЫЙ|нет строки «Tests run'; then
            echo "::error::Сторож не дал вердикта (код $code) — проверка не состоялась, а не «стало меньше падений»."
            exit 1
          fi
          if [ "$code" = "0" ]; then echo "Регресса нет: список красных совпал с эталоном."; exit 0; fi
          if [ "$code" = "2" ]; then echo "::warning::Падений стало меньше (полный прогон) — эталон пора обновить."; exit 0; fi
          exit "$code"

      - name: Итог по тестам
        if: always()
        shell: bash
        run: |
          echo "== строки отчёта"
          grep -E "Tests run|BUILD (SUCCESS|FAILURE)|Reactor Summary" /tmp/mvn.log | tail -40 || echo "строк отчёта нет"
          echo "== файлы отчётов"
          find project/server -name "TEST-*.xml" 2>/dev/null | head -20 || true

      - name: Лог Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvn-log
          path: |
            /tmp/mvn.log
            /tmp/compile.log
          retention-days: 1
          if-no-files-found: ignore
