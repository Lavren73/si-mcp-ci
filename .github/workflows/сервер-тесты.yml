# Тесты сервера MCP.
#
# Публичный «домик»: исходников здесь нет. Код берётся из приватного репозитория
# по deploy key (только чтение, только SI-MCP). Публичный репозиторий не тратит квоту
# минут и получает раннер 4 vCPU / 16 ГБ — этого хватает `mvn verify`, который
# в песочнице участника убивается по памяти (1982 МБ → код 137).
#
# Автор схемы: №13 (агент Arena), 07.11.2026. Ловушка PIPESTATUS и кэш ~/.m2 —
# из наработки №16 (объявление O-100).
name: Тесты сервера

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка или SHA в Lavren73/SI-MCP'
        required: true
        default: 'agent/obmen-20261102'
  push:
    branches: [main]

concurrency:
  group: server-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify (13 модулей, тесты в OSGi)
    runs-on: ubuntu-24.04       # не ubuntu-latest: он мигрирует на Ubuntu 26
    timeout-minutes: 60
    # Доступ к приватному проекту можно задать любым из двух секретов ЭТОГО репозитория:
    # SI_MCP_DEPLOY_KEY (приватный SSH-ключ, к нему нужен deploy key в проекте) либо
    # SI_MCP_TOKEN (PAT с чтением проекта — проще: ничего больше настраивать не нужно).
    # Секреты нельзя сравнивать в if:, поэтому заранее считаем только признак «задан/нет».
    env:
      HAS_DEPLOY_KEY: ${{ secrets.SI_MCP_DEPLOY_KEY != '' }}
      HAS_TOKEN: ${{ secrets.SI_MCP_TOKEN != '' }}

    steps:
      # Диагностика №13 (08.11.2026): если доступа нет, checkout уходит на HTTPS и падает
      # с «repository not found» — сообщение уводит в сторону (кажется, что репозиторий удалён).
      - name: Задан ли доступ к проекту
        shell: bash
        run: |
          echo "deploy_key: $HAS_DEPLOY_KEY, token: $HAS_TOKEN"
          if [ "$HAS_DEPLOY_KEY" != "true" ] && [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Нет доступа к Lavren73/SI-MCP. Задайте в ЭТОМ репозитории (si-mcp-ci) один из секретов:"
            echo "  SI_MCP_DEPLOY_KEY — приватный SSH-ключ, публичная половина добавлена deploy key в проект;"
            echo "  SI_MCP_TOKEN      — PAT с чтением проекта (проще всего, deploy key не нужен)."
            echo "Секрет, созданный в репозитории SI-MCP, здесь не виден: workflow выполняется в si-mcp-ci."
            exit 1
          fi

      - name: Исходники SI-MCP по deploy key (SSH)
        if: env.HAS_DEPLOY_KEY == 'true'
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: ${{ inputs.ref || 'agent/obmen-20261102' }}
          ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
          path: project
          persist-credentials: false
          fetch-depth: 1

      - name: Исходники SI-MCP по токену (HTTPS)
        if: env.HAS_DEPLOY_KEY != 'true' && env.HAS_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: Lavren73/SI-MCP
          ref: ${{ inputs.ref || 'agent/obmen-20261102' }}
          token: ${{ secrets.SI_MCP_TOKEN }}
          path: project
          persist-credentials: false
          fetch-depth: 1

      - name: Экран для SWT (Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xauth libgtk-3-0 >/dev/null
          echo "xvfb: $(which xvfb-run)"

      - name: Сколько у раннера памяти
        run: |
          echo "процессоров: $(nproc)"
          free -m | head -2
          df -h / | tail -1

      - name: Что собираем
        working-directory: project
        # блок-скаляр обязателен: в обычном (незакавыченном) скаляре
        # конструкция «двоеточие + пробел» делает YAML невалидным
        run: |
          git log -1 --format='коммит: %H%nавтор: %an%nдата: %ad%nтема: %s'

      # Кэш ~/.m2 намеренно НЕ включён: в прогоне 42401605284 восстановленный кэш
      # отдал набор, в котором Maven не нашёл tycho-maven-plugin:4.0.5, и сборка
      # упала на «Unresolveable build extension». Холодный прогон — 8–9 минут.
      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Какой Maven стоит по умолчанию (для протокола)
        run: mvn -v || true

      # Tycho 4.0.5 несовместим с Maven 4: падает на «No implementation for
      # MavenTargetLocationFactory was bound». Поэтому версия пинована ровно та,
      # на которой сборка проверена в песочнице (Maven 3.9.9 + Temurin 17).
      - name: Maven 3.9.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o /tmp/mvn.tgz
          sudo tar -xzf /tmp/mvn.tgz -C /opt
          echo "/opt/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
          /opt/apache-maven-3.9.9/bin/mvn -v

      - name: Компиляция (без тестов)
        working-directory: project/server
        shell: bash
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          MAVEN_OPTS: -Xmx3g
        run: |
          xvfb-run -a mvn -B -ntp -Dstyle.color=never -DskipTests compile 2>&1 | tee /tmp/compile.log | tail -40
          exit "${PIPESTATUS[0]}"

      # Код возврата берём из PIPESTATUS: иначе упавший mvn дал бы зелёный шаг,
      # потому что последняя команда конвейера — tail.
      - name: Тесты (mvn verify)
        working-directory: project/server
        shell: bash
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          MAVEN_OPTS: -Xmx3g
        run: |
          xvfb-run -a mvn -B -ntp -Dstyle.color=never verify 2>&1 | tee /tmp/mvn.log | tail -120
          exit "${PIPESTATUS[0]}"

      # Поправка №13 (08.11.2026): шаг зеленел, когда проверка НЕ СОСТОЯЛАСЬ.
      # Измерено на попытке #12: исходники не получились, python3 не нашёл файл сторожа
      # и вышел с кодом 2 — а код 2 здесь означал «падали починены». Шаг рапортовал
      # success и печатал «кто-то починил тест» при полностью упавшем checkout.
      # Теперь сначала проверяется, что сторож запускался и дал вердикт.
      - name: Сторож красных (ТЗ-04)
        if: always()
        shell: bash
        run: |
          set +e
          # Имена переменных только латиницей: bash не принимает кириллицу.
          STOZOR=project/server/scripts/сторож-красных.py
          ETALON=project/docs/отчёты-проверок/эталон-красных-2026-11-07.txt
          if [ ! -f "$STOZOR" ]; then
            echo "::error::Сторож не найден ($STOZOR) — исходники не получены, вердикта по красным нет."
            exit 1
          fi
          vyvod=$(python3 "$STOZOR" /tmp/mvn.log "$ETALON")
          code=$?
          printf '%s\n' "$vyvod"
          if ! printf '%s' "$vyvod" | grep -qE 'Список красных совпал|НОВЫЕ падения|Ушли из списка|ПРОГОН НЕ ПОЛНЫЙ|нет строки «Tests run'; then
            echo "::error::Сторож не дал вердикта (код $code) — проверка не состоялась, а не «стало меньше падений»."
            exit 1
          fi
          if [ "$code" = "0" ]; then echo "Регресса нет: список красных совпал с эталоном."; exit 0; fi
          if [ "$code" = "2" ]; then echo "::warning::Падений стало меньше (полный прогон) — эталон пора обновить."; exit 0; fi
          exit "$code"

      - name: Итог по тестам
        if: always()
        shell: bash
        run: |
          echo "== строки отчёта"
          grep -E "Tests run|BUILD (SUCCESS|FAILURE)|Reactor Summary" /tmp/mvn.log | tail -40 || echo "строк отчёта нет"
          echo "== файлы отчётов"
          find project/server -name "TEST-*.xml" 2>/dev/null | head -20 || true

      - name: Лог Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvn-log
          path: |
            /tmp/mvn.log
            /tmp/compile.log
          retention-days: 1
          if-no-files-found: ignore
