name: SI16 текущая доступность платформы и мест лицензий
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 5
    steps:
      - name: Проверить файлы платформы и наличие файлов лицензий без чтения содержимого
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os
          home=pathlib.Path.home();root=home/'SI-MCP-Polygons/Agent-16/Stand-42971555122'
          for p in (home/'SI-MCP-Polygons',home/'SI-MCP-Polygons/Agent-16',root):
              if p.is_symlink() or not p.is_dir():raise RuntimeError('Personal stand not verified')
          platform=pathlib.Path('/opt/1cv8/x86_64/8.3.27.2342/1cv8')
          print('RESULT_PLATFORM_8327_2342_EXECUTABLE='+str(platform.is_file() and os.access(platform,os.X_OK)).lower())
          dirs={'VERSION_CONF':pathlib.Path('/opt/1cv8/x86_64/8.3.27.2342/conf'),'ROOT_CONF':pathlib.Path('/opt/1cv8/conf'),'SHARED':pathlib.Path('/var/1C/licenses'),'RUNNER_HOME_CONF':home/'.1cv8/conf','RUNNER_HOME_ALT':home/'.1cv8/1C/1cv8','PERSONAL_HOME_CONF':root/'home/.1cv8/conf','PERSONAL_HOME_ALT':root/'home/.1cv8/1C/1cv8'}
          for label,p in dirs.items():
              if not p.is_dir():print('RESULT_'+label+'_DIRECTORY=false');continue
              if p.is_symlink():print('RESULT_'+label+'_SYMLINK_SKIPPED=true');continue
              try: count=sum(1 for f in p.iterdir() if f.name.lower().endswith('.lic') and f.is_file() and not f.is_symlink())
              except OSError:print('RESULT_'+label+'_LISTABLE=false');continue
              print('RESULT_'+label+'_LICENSE_COUNT='+str(count))
          print('RESULT_LICENSE_CONTENT_NOT_READ=true')
          print('RESULT_LICENSE_SERVER_OR_HARDWARE_NOT_TESTED=true')
          print('RESULT_BINDING_NOT_ATTEMPTED=true')
          PY
