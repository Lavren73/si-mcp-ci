      continue-on-error: true
      id: maven
    - name: Sanitize allowlisted maven reports before upload
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import pathlib,os,re,json
        root=pathlib.Path(os.environ['TEAM_RUN'])/'reports';hits=[]
        for p in root.rglob('*'):
            if not p.is_file() or p.is_symlink():continue
            text=p.read_text(errors='replace');original=text
            text=re.sub(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----.*?-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----','<redacted-private-key>',text,flags=re.S)
            text=re.sub(r'\bgh[pousr]_[A-Za-z0-9]{20,}|\bgithub_pat_[A-Za-z0-9_]{30,}','<redacted-token>',text)
            text=re.sub(r'(?i)(Authorization:\s*Bearer\s+)[A-Za-z0-9._-]{20,}',r'\1<redacted>',text)
            if text!=original:p.write_text(text);hits.append(p.name)
        (root/'artifact-sanitization.json').write_text(json.dumps({'heuristic_not_full_audit':True,'files_redacted':hits},indent=2));print('REDACTED_FILES',len(hits))
        PY
      if: always() && env.TEAM_RUN != ''
    - name: Upload allowlisted maven reports only
      if: always() && env.TEAM_RUN != ''
      uses: actions/upload-artifact@v4
      with:
        name: accumulated-maven-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.TEAM_RUN }}/reports/
        retention-days: 7
    - name: Final exact-source summary; failures and unavailable checks stay visible
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,json,collections
        r=pathlib.Path(os.environ['TEAM_RUN'])/'reports';allrows=[];missing=[]
        for phase in ('fast','maven'):
            p=r/(phase+'-results.json')
            if p.exists():allrows+=json.loads(p.read_text())['results']
            else:missing.append(phase)
        counts=dict(collections.Counter(x['status'] for x in allrows));summary={'counts':counts,'missing_phases':missing,'results':allrows,'integration_SHA':None,'release_ready':False}
        (r/'accumulated-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2));print(json.dumps(summary,ensure_ascii=False))
        p=pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']);p.write_text('# Independent accumulated checks\n\n'+str(counts)+'\n\nNot an integration/release SHA. Full results in allowlisted reports.\n')
        raise SystemExit(1 if missing or counts.get('FAIL',0) else 0)
        PY
      if: always() && env.TEAM_RUN != ''
    - name: Upload final batch summary
      if: always() && env.TEAM_RUN != ''
      uses: actions/upload-artifact@v4
      with:
        name: accumulated-summary-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.TEAM_RUN }}/reports/accumulated-summary.json
        retention-days: 7
