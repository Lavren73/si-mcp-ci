                ('fake-http','tools/З-11-T2-тест-mcp-http.py',[],C),
                ('format-comparison','tools/ЗД-41-тест-сверки-13.py',[],C),
                ('exception-probe','tools/ЗД-152-ошибка-службы-тест-13.py',[str(C)],C),
                ('zd154-independent','tools/ЗД-154-независимый-тест-13.py',[str(C)],C),
                ('window-start','tools/З-15-проверка-старта-окна-13.py',[str(C)],C)]:
                if (cwd/file).is_file():run('common-'+name,[PY,file]+args,cwd,'common',300)
                else:notrun('common-'+name,'Probe missing in exact common SHA')
            r=source('pr157');run('pr157-installer-focused',[PY,'-m','pytest','-q','tests/test_installer.py','tests/test_installer_safety.py','tests/test_windows_install_shortcuts_16.py','--junitxml='+str(REPORT/'pr157-installer-focused.xml')],r/'client','pr157',600)
            run('pr157-docstring',[PY,C/'tools/З-15-текст-установщика-13.py',str(r)],C,'pr157')
            r=source('pr162');run('pr162-focused',[PY,'-m','pytest','-q','tests/test_rollback.py','tests/test_rollback_snapshot_cut.py','tests/test_diagnostics_failclosed.py','tests/test_edt_stand.py','--junitxml='+str(REPORT/'pr162-focused.xml')],r/'client','pr162',600)
            run('pr162-independent',[PY,'tools/проверка-Р-1-№16.py','client'],r,'pr162')
            r=source('pr166')
            run('pr166-catalog-en',[PY,'tests/extract_edt_catalog.py','--check'],r/'client','pr166')
            run('pr166-catalog-ru',[PY,'tests/извлечь-каталог-из-исходников.py','--src','../server','--check'],r/'client','pr166')
            run('pr166-focused',[PY,'-m','pytest','-q','tests/test_archive_hij.py','tests/test_catalog_extract.py','--junitxml='+str(REPORT/'pr166-focused.xml')],r/'client','pr166')
            run('pr172-guard-pytest',[PY,'-m','pytest','-q','server/scripts/tests/test_storozh_krasnyh.py','--junitxml='+str(REPORT/'pr172-guard-pytest.xml')],source('pr172'),'pr172',600)
            run('pr172-server-python-all',[PY,'-m','pytest','-q','--junitxml='+str(REPORT/'pr172-server-python-all.xml')],source('pr172')/'server/scripts/tests','pr172',900)
            control=RUN/'guard-negative-control'
            subprocess.run(['git','clone','--no-hardlinks',str(C),str(control)],check=True,stdout=subprocess.DEVNULL)
            shutil.copyfile(source('pr172')/'server/scripts/tests/test_storozh_krasnyh.py',control/'server/scripts/tests/test_storozh_krasnyh.py')
