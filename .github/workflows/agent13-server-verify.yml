name: '№13 — Сервер SI-MCP mvn verify на hosted (ЗД-29, точный SHA)'
# Зачем: в приватном SI-MCP hosted-раннеры не стартуют на уровне аккаунта (шапка
# agent11-si-mcp-hosted-verify.yml), а ЗД-01/ЗД-29 требуют именно вердикта `mvn verify`
# на машине с памятью 4-8 ГБ. Публичный домик даёт бесплатный раннер с 16 ГБ.
# Рецепт прогона взят из приватного .github/workflows/сервер-тесты.yml (четыре находки
# первого настоящего прогона: Maven 3.9.9 вместо 4.x, xvfb-run, кэш ~/.m2 выключен,
# корректный код возврата через PIPESTATUS).
# Репозиторий публичный: сырые логи не печатаются и не выгружаются. При ошибке последние
# 80 строк печатаются после редактирования секретов; redacted Maven log и Surefire XML
# публикуются отдельными публичными artifacts на 1 день, без исходников/прочих файлов.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Точный SHA SI-MCP для проверки'
        required: true
        default: '7f001a3a28306c77102743a2879c9542491f52e8'
      goal:
        description: 'Цель Maven (по умолчанию verify)'
        required: true
        default: 'verify'
      profile:
        description: 'Профиль Maven без дефиса, например edt-2026.2 (пусто - профиль по умолчанию)'
        required: false
        default: ''
      java:
        description: 'Версия JDK: 17 по умолчанию, для профиля edt-2026.2 нужен 25 (требование osgi.ee платформы)'
        required: false
        default: '17'
      fail_heads:
        description: 'Устаревший вход, совместимость; сообщения об ошибках никогда не печатаются.'
        required: false
        default: 'no'
permissions:
  contents: read
concurrency:
  group: si-mcp-server-verify-${{ github.event.inputs.sha }}
  cancel-in-progress: false
jobs:
  verify:
    name: mvn verify на hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET_SHA: ${{ github.event.inputs.sha }}
      GOAL: ${{ github.event.inputs.goal }}
      PROFILE: ${{ github.event.inputs.profile }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
  # ВНИМАНИЕ. Имена переменных bash только латиницей.
    steps:
      - name: Код обёртки публичного workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Самопроверка сторожа workflow
        run: python3 -m unittest discover -s tools -p 'test_watchdog_verdict.py' -v
      - name: 1. Приватный исходник SI-MCP на точном SHA (deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          test -n "${TARGET_SHA}"
          mkdir -p "$RUNNER_TEMP/.ssh" && chmod 700 "$RUNNER_TEMP/.ssh"
          if printf '%s' "$DEPLOY_KEY" | grep -q 'BEGIN [A-Z ]*PRIVATE KEY'; then
            echo "KEY_KIND=ssh-private-key"
            printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/.ssh/id_deploy"
            chmod 600 "$RUNNER_TEMP/.ssh/id_deploy"
            ssh-keyscan -t rsa,ecdsa,ed25519 github.com > "$RUNNER_TEMP/.ssh/known_hosts" 2>/dev/null
            GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/.ssh/id_deploy -o UserKnownHostsFile=$RUNNER_TEMP/.ssh/known_hosts -o IdentitiesOnly=yes" \
              git clone --quiet --no-checkout git@github.com:Lavren73/SI-MCP.git "$RUNNER_TEMP/src"
          else
            echo "KEY_KIND=token"
            printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "x-access-token\n";; *) printf "%s\n" "$DEPLOY_KEY";; esac' > "$RUNNER_TEMP/.ssh/askpass"
            chmod 700 "$RUNNER_TEMP/.ssh/askpass"
            GIT_ASKPASS="$RUNNER_TEMP/.ssh/askpass" GIT_TERMINAL_PROMPT=0 git clone --quiet --no-checkout https://github.com/Lavren73/SI-MCP.git "$RUNNER_TEMP/src"
          fi
          cd "$RUNNER_TEMP/src"
          git checkout --quiet --detach "$TARGET_SHA"
          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD_SHA=$HEAD_SHA"
          echo "HEAD_TREE=$(git rev-parse HEAD^{tree})"
          test "$HEAD_SHA" = "$TARGET_SHA" || { echo "SHA MISMATCH"; exit 1; }
          rm -f "$RUNNER_TEMP/.ssh/id_deploy" "$RUNNER_TEMP/.ssh/askpass"

      - name: 2. Память и диск раннера
        run: |
          echo "процессоров: $(nproc)"
          free -m | head -2
          df -h / | tail -1

      - name: 3. JDK 17 (Temurin) и Maven 3.9.9
        run: |
          set -euo pipefail
          curl -sSL -o "$RUNNER_TEMP/maven.tar.gz" https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz
          mkdir -p "$RUNNER_TEMP/maven"
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP/maven" --strip-components=1
          echo "$RUNNER_TEMP/maven/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ github.event.inputs.java }}

      - name: 4. Версии инструментов
        run: |
          java -version 2>&1 | head -2
          mvn -v

      - name: 5. xvfb (иначе 48 падений gtk_init_check)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb

      - name: 6. mvn verify (xvfb-run, без кэша ~/.m2)
        working-directory: ${{ runner.temp }}/src/server
        shell: bash
        env:
          MAVEN_OPTS: -Xmx3g
        run: |
          set +e
          # Профиль отдельным входом: цель в кавычках уходит в Maven одним словом, поэтому
          # "-Pedt-2026.2 verify" в goal было бы прочитано как один аргумент -P "edt-2026.2 verify"
          # и Maven ответил бы "No goals have been specified" (находка прогона 44028718674).
          PROFILE_ARG=""
          if [ -n "$PROFILE" ]; then PROFILE_ARG="-P$PROFILE"; fi
          echo "команда: mvn -B -ntp -Dstyle.color=never $PROFILE_ARG $GOAL"
          xvfb-run --auto-servernum mvn -B -ntp -Dstyle.color=never $PROFILE_ARG $GOAL > "$RUNNER_TEMP/mvn.log" 2>&1
          code=$?
          echo "MVN_EXIT=$code"
          # Print only the sanitized tail; never dump the raw Maven stream to public logs.
          if [ "$code" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/mvn.log" <<'PY'
          import re,sys
          try: text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          except OSError: text='[maven.log unavailable]'
          def redact(text):
              text=re.sub(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----","[REDACTED PRIVATE KEY]",text,flags=re.S)
              pat=r"(?i)((?:password|passwd|token|secret|api[_-]?key|authorization)[\x22\x27]?\s*[:=]\s*)([\x22\x27]?)([^\x22\x27\s<>&]+)([\x22\x27]?)"
              text=re.sub(pat,lambda m:m.group(1)+m.group(2)+"[REDACTED]"+m.group(4),text)
              def redact_xml_tags(text):
                  pat=r"(?is)<(password|passwd|token|secret|api[_-]?key)[^>]*>.*?</\1\s*>"
                  return re.sub(pat,lambda m:"<"+m.group(1)+">[REDACTED]</"+m.group(1)+">",text)
              text=redact_xml_tags(text)
              text=re.sub(r"(?i)Bearer\s+[A-Za-z0-9._~+/=-]{12,}","Bearer [REDACTED]",text)
              text=re.sub(r"https?://[^/\s:@]+:[^/\s@]+@","https://[REDACTED]@",text)
              text=re.sub(r"gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}","[REDACTED_GITHUB_TOKEN]",text)
              text=re.sub(r"AKIA[0-9A-Z]{16}","[REDACTED_AWS_KEY]",text)
              return text
          text=redact(text)
          print('MVN_LOG_LAST_80_BEGIN')
          print('\n'.join(text.splitlines()[-80:]))
          print('MVN_LOG_LAST_80_END')
          PY
          fi
          exit "$code"

      - name: 7. Сводка surefire по счётчикам
        if: always()
        shell: bash
        run: |
          set +e
          cd "$RUNNER_TEMP/src"
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          files = glob.glob('server/**/target/surefire-reports/TEST-*.xml', recursive=True)
          tests = fail = err = skip = 0
          bad = []
          for f in files:
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              s = r if r.tag == 'testsuite' else r.find('testsuite')
              if s is None:
                  continue
              tests += int(s.get('tests') or 0)
              fail += int(s.get('failures') or 0)
              err += int(s.get('errors') or 0)
              skip += int(s.get('skipped') or 0)
              for tc in s.findall('testcase'):
                  if tc.find('failure') is not None or tc.find('error') is not None:
                      bad.append(tc.get('classname', '?') + '#' + tc.get('name', '?'))
          print('SUREFIRE_FILES=%d' % len(files))
          print('TESTS=%d FAILURES=%d ERRORS=%d SKIPPED=%d' % (tests, fail, err, skip))
          print('BAD_UNIQUE=%d' % len(set(bad)))
          for b in sorted(set(bad)):
              if re.fullmatch(r'[A-Za-z_$][A-Za-z0-9_.$]*#[A-Za-z_$][A-Za-z0-9_.$]*(?:\[[A-Za-z0-9_.$-]+\])?', b):
                  print('FAILED:', b)
              else:
                  print('FAILED: <identifier omitted>')
          PY

      - name: 8. Сторож красных (fail-closed)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/src"
          # Абсолютные пути обязательны: обёртка из домика работает в СВОЁМ каталоге
          # ($GITHUB_WORKSPACE), поэтому относительный «server/scripts/...» у неё не существует.
          STOZOR="$RUNNER_TEMP/src/server/scripts/сторож-красных.py"
          ETALON=$(ls "$RUNNER_TEMP/src"/docs/отчёты-проверок/эталон-красных-*.txt 2>/dev/null | tail -1)
          # Почему ARGV — массив, а не одна строка (найдено №13 на прогоне 45066035766):
          # `python3 tools/watchdog_verdict.py "$STOZOR" ...` запускал ОБЁРТКУ из домика
          # (это нормально), но её sys.argv[1:] попадали в subprocess как ЕДИНСТВЕННЫЙ аргумент.
          # Обёртка вызывала сторож в собственном рабочем каталоге, а не в "$RUNNER_TEMP/src".
          # Отсюда два дефекта: (1) при любой правке обёртки прогон падал `invalid-arguments`;
          # (2) эталон читался из копии домика, а не из проверяемого дерева — на final после
          # #496 вердикт «ПРОГОН НЕ ПОЛНЫЙ» относится к чужому эталону, а не к прогону.
          if [ ! -f "$STOZOR" ] || [ -z "$ETALON" ] || [ ! -f "$RUNNER_TEMP/mvn.log" ]; then
            echo 'WATCHDOG=missing-input'; exit 1
          fi
          ARGV=()
          while IFS= read -r -d '' a; do ARGV+=("$a"); done < <(printf '%s\0' "$STOZOR" "$RUNNER_TEMP/mvn.log" "$ETALON")
          python3 "$GITHUB_WORKSPACE/tools/watchdog_verdict.py" "${ARGV[@]}"

      - name: 9. Итог (только счётчики и хеши)
        if: always()
        shell: bash
        run: |
          echo "SHA=$TARGET_SHA GOAL=$GOAL"
          echo "HEAD_SHA=$(cd "$RUNNER_TEMP/src" && git rev-parse HEAD)"
          echo "HEAD_TREE=$(cd "$RUNNER_TEMP/src" && git rev-parse HEAD^{tree})"
          grep -c . "$RUNNER_TEMP/mvn.log" | sed 's/^/MVN_LOG_LINES=/'

      - name: Prepare redacted Maven diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/src" "$RUNNER_TEMP/mvn.log" "$RUNNER_TEMP/diagnostics" <<'PY'
          import glob,os,re,sys
          from pathlib import Path
          source,log_path,out=sys.argv[1:]
          out=Path(out); out.mkdir(parents=True,exist_ok=True)
          def redact(text):
              text=re.sub(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----","[REDACTED PRIVATE KEY]",text,flags=re.S)
              pat=r"(?i)((?:password|passwd|token|secret|api[_-]?key|authorization)[\x22\x27]?\s*[:=]\s*)([\x22\x27]?)([^\x22\x27\s<>&]+)([\x22\x27]?)"
              text=re.sub(pat,lambda m:m.group(1)+m.group(2)+"[REDACTED]"+m.group(4),text)
              def redact_xml_tags(text):
                  pat=r"(?is)<(password|passwd|token|secret|api[_-]?key)[^>]*>.*?</\1\s*>"
                  return re.sub(pat,lambda m:"<"+m.group(1)+">[REDACTED]</"+m.group(1)+">",text)
              text=redact_xml_tags(text)
              text=re.sub(r"(?i)Bearer\s+[A-Za-z0-9._~+/=-]{12,}","Bearer [REDACTED]",text)
              text=re.sub(r"https?://[^/\s:@]+:[^/\s@]+@","https://[REDACTED]@",text)
              text=re.sub(r"gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}","[REDACTED_GITHUB_TOKEN]",text)
              text=re.sub(r"AKIA[0-9A-Z]{16}","[REDACTED_AWS_KEY]",text)
              return text
          try: raw=Path(log_path).read_text(encoding='utf-8',errors='replace')
          except OSError: raw='[maven.log unavailable]\n'
          (out/'maven.log').write_text(redact(raw),encoding='utf-8')
          reports=glob.glob(os.path.join(source,'server/**/target/surefire-reports/TEST-*.xml'),recursive=True)
          report_dir=out/'surefire-reports'; report_dir.mkdir(parents=True,exist_ok=True)
          for report in reports:
              rel=os.path.relpath(report,source); dest=report_dir/rel;dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_text(redact(Path(report).read_text(encoding='utf-8',errors='replace')),encoding='utf-8')
          if not reports: (report_dir/'NO_REPORTS.txt').write_text('No Surefire TEST-*.xml files were produced.\n',encoding='utf-8')
          print('DIAGNOSTICS_PREPARED=1 SUREFIRE_REPORTS='+str(len(reports))+' SECRETS_REDACTED=1')
          PY

      - name: Upload sanitized Maven log artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-log-${{ github.event.inputs.sha }}
          path: ${{ runner.temp }}/diagnostics/maven.log
          if-no-files-found: error
          retention-days: 1

      - name: Upload sanitized Surefire reports artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.event.inputs.sha }}
          path: ${{ runner.temp }}/diagnostics/surefire-reports/
          if-no-files-found: error
          retention-days: 1
