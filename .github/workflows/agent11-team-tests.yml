name: SI-MCP — team runner setup and sequential tests (11)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: si1c-team-test-stand
  cancel-in-progress: false
jobs:
  suite:
    runs-on:
    - self-hosted
    - Linux
    - X64
    - si1c
    timeout-minutes: 75
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      RUNNER_TOOL_CACHE: /home/runner/si1c-team-tests/toolcache
      AGENT_TOOLSDIRECTORY: /home/runner/si1c-team-tests/toolcache
    steps:
    - name: Create isolated team directories; check free space
      shell: bash
      run: |
        set -euo pipefail
        umask 077
        BASE="$HOME/si1c-team-tests"
        if [ -e "$BASE" ]; then
          test -d "$BASE" && test ! -L "$BASE" && test -O "$BASE"
          test "$(cat "$BASE/OWNER.txt")" = 'SI-MCP team test stand; provisioned by agent 11'
        else
          mkdir -m 700 "$BASE"
          printf '%s\n' 'SI-MCP team test stand; provisioned by agent 11' > "$BASE/OWNER.txt"
        fi
        for p in tools toolcache cache reports runs infobases workspaces locks; do
          test ! -L "$BASE/$p"
          mkdir -p "$BASE/$p"
        done
        AVAILABLE=$(df -Pk "$BASE" | awk 'NR==2 {print $4}')
        test "$AVAILABLE" -gt 20971520 || { echo 'Less than 20 GiB free; stopping without deleting data'; exit 1; }
        RUN="$BASE/runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        test ! -e "$RUN"
        mkdir -m 700 "$RUN"
        mkdir "$RUN/home" "$RUN/reports"
        printf 'TEAM_BASE=%s\nTEAM_RUN=%s\n' "$BASE" "$RUN" >> "$GITHUB_ENV"
        echo "Permanent run directory: $RUN"
        df -h "$BASE"
    - name: Create and license-check three empty infobases, strictly sequentially
      shell: bash
      run: |
        set -euo pipefail
        PLATFORM=/opt/1cv8/x86_64/8.3.27.2342/1cv8
        test -x "$PLATFORM"
        echo 'Waiting for the team live-test lock (no parallel infobase changes)'
        exec 9>"$TEAM_BASE/locks/live-tests.lock"
        flock -w 600 9
        for SLOT in 01 02 03; do
          IB="$TEAM_BASE/infobases/slot-$SLOT"
          WS="$TEAM_BASE/workspaces/slot-$SLOT"
          if [ -e "$IB" ]; then
            test -d "$IB" && test ! -L "$IB"
            test "$(cat "$IB/TEAM-OWNER.txt")" = "SI-MCP isolated test infobase slot-$SLOT"
            test -s "$IB/1Cv8.1CD" || { echo 'Existing incomplete base: manual inspection required'; exit 1; }
          else
            mkdir -m 700 "$IB"
            printf 'SI-MCP isolated test infobase slot-%s\n' "$SLOT" > "$IB/TEAM-OWNER.txt"
            echo "Creating slot-$SLOT (timeout 180 seconds)"
            timeout 180s xvfb-run -a "$PLATFORM" CREATEINFOBASE "File=$IB" /DisableStartupDialogs /Out "$TEAM_RUN/reports/create-slot-$SLOT.log"
            test -s "$IB/1Cv8.1CD"
          fi
          test ! -L "$WS"
          mkdir -p "$WS"
          echo "Checking licensed Designer on slot-$SLOT"
          timeout 150s xvfb-run -a "$PLATFORM" DESIGNER "/F$IB" /DumpCfg "$TEAM_RUN/reports/slot-$SLOT.cf" /DisableStartupDialogs /Out "$TEAM_RUN/reports/designer-slot-$SLOT.log"
          test -s "$TEAM_RUN/reports/slot-$SLOT.cf"
          echo "LIVE_SLOT_$SLOT=PASS"
        done
        printf 'Separate bases: slot-01, slot-02, slot-03. No simultaneous sessions tested.\n' >> "$GITHUB_STEP_SUMMARY"
        echo 'Original /home/runner/test-ib and other participants stands were not changed.'
      id: bases
    - name: Prepare a private SSH client if the container has none
      shell: bash
      run: |
        set -euo pipefail
        if command -v ssh >/dev/null; then ssh -V; exit 0; fi
        DEST="$TEAM_BASE/tools/openssh"
        if [ ! -x "$DEST/usr/bin/ssh" ]; then
          APT="$TEAM_BASE/cache/apt"
          mkdir -p "$APT/lists/partial" "$APT/cache/archives/partial" "$APT/downloads"
          OPTS=(-o "Dir::State::lists=$APT/lists" -o "Dir::Cache=$APT/cache" -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          apt-get "${OPTS[@]}" update
          cd "$APT/downloads"
          apt-get "${OPTS[@]}" download openssh-client
          mapfile -t DEBS < <(find . -maxdepth 1 -name 'openssh-client_*.deb' -type f)
          test "${#DEBS[@]}" -eq 1
          mkdir -p "$DEST"
          dpkg-deb -x "${DEBS[0]}" "$DEST"
        fi
        "$DEST/usr/bin/ssh" -V
        echo "$DEST/usr/bin" >> "$GITHUB_PATH"
    - name: JDK 17 in the team tool cache
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Python 3.12 in the team tool cache
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Node.js 22 in the team tool cache
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install verified Maven 3.9.9 and PowerShell 7.4.13 without sudo
      shell: bash
      run: |
        set -euo pipefail
        DL="$TEAM_BASE/cache/downloads"
        mkdir -p "$DL"
        MAVEN="$TEAM_BASE/tools/apache-maven-3.9.9"
        if [ ! -x "$MAVEN/bin/mvn" ]; then
          cd "$DL"
          curl -fL --retry 2 --connect-timeout 20 --max-time 300 https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz -o maven-3.9.9.tar.gz
          echo 'a555254d6b53d267965a3404ecb14e53c3827c09c3b94b5678835887ab404556bfaf78dcfe03ba76fa2508649dca8531c74bca4d5846513522404d48e8c4ac8b  maven-3.9.9.tar.gz' | sha512sum -c -
          tar --no-same-owner -xzf maven-3.9.9.tar.gz -C "$TEAM_BASE/tools"
        fi
        "$MAVEN/bin/mvn" -version
        echo "$MAVEN/bin" >> "$GITHUB_PATH"
        PWSH="$TEAM_BASE/tools/powershell-7.4.13"
        if [ ! -x "$PWSH/pwsh" ]; then
          cd "$DL"
          URL=https://github.com/PowerShell/PowerShell/releases/download/v7.4.13
          curl -fL --retry 2 --connect-timeout 20 --max-time 600 "$URL/powershell-7.4.13-linux-x64.tar.gz" -o powershell-7.4.13-linux-x64.tar.gz
          curl -fL --retry 2 --connect-timeout 20 --max-time 60 "$URL/hashes.sha256" -o powershell-7.4.13.sha256
          python3 - <<'PY'
        import hashlib,pathlib,re
        name='powershell-7.4.13-linux-x64.tar.gz'
        raw=pathlib.Path('powershell-7.4.13.sha256').read_bytes()
        text=raw.decode('utf-16' if raw[:2] in (bytes.fromhex('fffe'),bytes.fromhex('feff')) else 'utf-8-sig')
        lines=[x for x in text.splitlines() if name in x]
        if len(lines)!=1:raise SystemExit('Expected exactly one official PowerShell checksum')
        hashes=re.findall(r'(?i)\b[0-9a-f]{64}\b',lines[0])
        if len(hashes)!=1:raise SystemExit('Invalid checksum format')
        actual=hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()
        if actual!=hashes[0].lower():raise SystemExit('PowerShell checksum mismatch; STOP')
        print('Official PowerShell SHA256 verified')
        PY
          mkdir -p "$PWSH"
          tar --no-same-owner -xzf powershell-7.4.13-linux-x64.tar.gz -C "$PWSH"
          chmod u+x "$PWSH/pwsh"
        fi
        "$PWSH/pwsh" -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
        echo "$PWSH" >> "$GITHUB_PATH"
    - name: Install isolated Python test dependencies and jsdom
      shell: bash
      run: |
        set -euo pipefail
        VENV="$TEAM_BASE/tools/python-tests"
        if [ ! -x "$VENV/bin/python" ]; then python -m venv "$VENV"; fi
        "$VENV/bin/python" -m pip install --disable-pip-version-check 'pytest==8.4.2' 'pytest-subtests==0.14.2' 'jsonschema==4.25.1' 'PyYAML==6.0.3'
        echo "$VENV/bin" >> "$GITHUB_PATH"
        npm install --prefix "$TEAM_BASE/tools/node-tests" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
        echo "NODE_PATH=$TEAM_BASE/tools/node-tests/node_modules" >> "$GITHUB_ENV"
        "$VENV/bin/python" -m pip freeze > "$TEAM_RUN/reports/python-dependencies.txt"
    - name: Checkout pinned private source without persisting credentials
      uses: actions/checkout@v4
      with:
        repository: Lavren73/SI-MCP
        ref: b029b9e0566310aea3b02242bb23a568b71771f1
        ssh-key: ${{ secrets.SI_MCP_DEPLOY_KEY }}
        persist-credentials: false
        path: team-source-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Preserve exact source outside the temporary checkout
      shell: bash
      run: |
        set -euo pipefail
        CHECKOUT="$GITHUB_WORKSPACE/team-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        EXPECTED=b029b9e0566310aea3b02242bb23a568b71771f1
        test "$(git -C "$CHECKOUT" rev-parse HEAD)" = "$EXPECTED"
        mkdir "$TEAM_RUN/source"
        git -C "$CHECKOUT" archive HEAD | tar -xf - -C "$TEAM_RUN/source"
        printf '%s\n' "$EXPECTED" > "$TEAM_RUN/reports/source-sha.txt"
        printf 'Source SHA: `%s`\n' "$EXPECTED" >> "$GITHUB_STEP_SUMMARY"
        echo "TEAM_SOURCE=$TEAM_RUN/source" >> "$GITHUB_ENV"
    - name: Build the client installer before testing
      shell: bash
      run: |
        set -euo pipefail
        cd "$TEAM_SOURCE/client"
        export HOME="$TEAM_RUN/home"
        python make_installer.py > "$TEAM_RUN/reports/installer.log" 2>&1 &
        PID=$!
        while kill -0 "$PID" 2>/dev/null; do echo 'Installer build running...'; sleep 10; done
        set +e
        wait "$PID"
        CODE=$?
        set -e
        tail -35 "$TEAM_RUN/reports/installer.log"
        exit "$CODE"
      id: installer
      continue-on-error: true
    - name: Client, index and BSL offline tests (no model API calls)
      shell: bash
      run: |
        set -euo pipefail
        cd "$TEAM_SOURCE/client"
        export HOME="$TEAM_RUN/home"
        set +e
        python прогнать-тесты.py 2>&1 | tee "$TEAM_RUN/reports/client-stand.log"
        CODE=${PIPESTATUS[0]}
        set -e
        printf '%s\n' "$CODE" > "$TEAM_RUN/reports/client-stand.exit"
        exit "$CODE"
      id: client
      continue-on-error: true
    - name: Server Python unit tests including jsdom where available
      shell: bash
      run: |
        set -euo pipefail
        cd "$TEAM_SOURCE/server/scripts/tests"
        export HOME="$TEAM_RUN/home"
        set +e
        python -m pytest -q --junitxml="$TEAM_RUN/reports/server-python.xml" 2>&1 | tee "$TEAM_RUN/reports/server-python.log"
        CODE=${PIPESTATUS[0]}
        set -e
        printf '%s\n' "$CODE" > "$TEAM_RUN/reports/server-python.exit"
        exit "$CODE"
      id: python_tests
      continue-on-error: true
    - name: PowerShell updater checks
      shell: bash
      run: |
        set -euo pipefail
        export HOME="$TEAM_RUN/home"
        set +e
        pwsh -NoLogo -NoProfile -File "$TEAM_SOURCE/server/scripts/tests/test_edt_selfupdate.ps1" 2>&1 | tee "$TEAM_RUN/reports/powershell.log"
        CODE=${PIPESTATUS[0]}
        set -e
        printf '%s\n' "$CODE" > "$TEAM_RUN/reports/powershell.exit"
        exit "$CODE"
      id: powershell_tests
      continue-on-error: true
    - name: Full Maven/Tycho verify with tests, one heavy process
      shell: bash
      run: |
        set -euo pipefail
        cd "$TEAM_SOURCE/server"
        export HOME="$TEAM_RUN/home"
        export MAVEN_OPTS="-Xmx3g -Dfile.encoding=UTF-8 -Duser.home=$TEAM_RUN/home"
        echo 'Full mvn verify started; heartbeat every 20 seconds. Tests are NOT skipped.'
        set +e
        nice -n 10 ionice -c 2 -n 7 timeout --signal=TERM --kill-after=60s 2400s xvfb-run -a mvn -B -ntp -Dstyle.color=never -Dmaven.repo.local="$TEAM_BASE/cache/m2" verify > "$TEAM_RUN/reports/maven.log" 2>&1 &
        PID=$!
        while kill -0 "$PID" 2>/dev/null; do
          printf '[%s] Maven is running; ' "$(date -u +%T)"
          tail -1 "$TEAM_RUN/reports/maven.log"
          sleep 20
        done
        wait "$PID"
        CODE=$?
        set -e
        printf '%s\n' "$CODE" > "$TEAM_RUN/reports/maven.exit"
        tail -100 "$TEAM_RUN/reports/maven.log"
        python - <<'PY'
        import os,pathlib,xml.etree.ElementTree as ET,json
        src=pathlib.Path(os.environ['TEAM_SOURCE'])
        reports=list(src.glob('server/**/surefire-reports/TEST-*.xml'))
        total=[0,0,0,0];failed=[]
        for p in reports:
            x=ET.parse(p).getroot()
            total=[a+int(x.get(k,'0')) for a,k in zip(total,('tests','failures','errors','skipped'))]
            for case in x.findall('testcase'):
                if case.find('failure') is not None or case.find('error') is not None:
                    failed.append(case.get('classname','')+'#'+case.get('name',''))
        out={'reports':len(reports),'tests':total[0],'failures':total[1],'errors':total[2],'skipped':total[3],'failed_tests':failed}
        pathlib.Path(os.environ['TEAM_RUN'],'reports','maven-summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
        print(json.dumps(out,ensure_ascii=False))
        if not reports or total[0]==0:raise SystemExit('No non-empty test reports: NOT a green test run')
        PY
        exit "$CODE"
      id: maven_tests
      continue-on-error: true
    - name: Static server gates (stand-required checks remain explicitly unverified)
      shell: bash
      run: |
        set -euo pipefail
        cd "$TEAM_SOURCE/server"
        export HOME="$TEAM_RUN/home"
        set +e
        bash scripts/run-gates.sh --json "$TEAM_RUN/reports/gates.json" 2>&1 | tee "$TEAM_RUN/reports/gates.log"
        CODE=${PIPESTATUS[0]}
        set -e
        printf '%s\n' "$CODE" > "$TEAM_RUN/reports/gates.exit"
        exit "$CODE"
      id: gates
      continue-on-error: true
    - name: Text validation without modifying source
      shell: bash
      run: |
        set -euo pipefail
        cd "$TEAM_SOURCE"
        export HOME="$TEAM_RUN/home"
        set +e
        python tools/проверка-текста.py 2>&1 | tee "$TEAM_RUN/reports/text.log"
        CODE=${PIPESTATUS[0]}
        set -e
        printf '%s\n' "$CODE" > "$TEAM_RUN/reports/text.exit"
        exit "$CODE"
      id: text
      continue-on-error: true
    - name: BSL fixture integrity and standalone synthetic contract checks
      shell: bash
      run: |
        set -euo pipefail
        cd "$TEAM_SOURCE"
        export HOME="$TEAM_RUN/home"
        python - <<'PY'
        import subprocess,os,pathlib,json
        root=pathlib.Path(os.environ['TEAM_SOURCE']);reports=pathlib.Path(os.environ['TEAM_RUN'])/'reports'
        plan=[('corpus-integrity',['python', 'check_corpus.py'],root/'data/bsl-corpus'),
              ('contract',['python','tools/З-11-T2-тест-контракта.py'],root),
              ('fake-http',['python','tools/З-11-T2-тест-mcp-http.py'],root),
              ('format-comparison',['python','tools/ЗД-41-тест-сверки-13.py'],root),
              ('exception-probe',['python','tools/ЗД-152-ошибка-службы-тест-13.py',str(root)],root)]
        results={}
        for name,cmd,cwd in plan:
            try:
                with (reports/(name+'.log')).open('w') as f:
                    p=subprocess.run(cmd,cwd=cwd,stdout=f,stderr=subprocess.STDOUT,timeout=240)
                results[name]=p.returncode
            except subprocess.TimeoutExpired:results[name]=124
            print(name,'EXIT',results[name],flush=True)
            print((reports/(name+'.log')).read_text()[-6500:],flush=True)
        (reports/'additional-checks.json').write_text(json.dumps(results,indent=2))
        raise SystemExit(1 if any(results.values()) else 0)
        PY
      id: extra
      continue-on-error: true
    - name: Summarize without turning failures or skips green
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os,pathlib,json
        names=['bases','installer','client','python_tests','powershell_tests','maven_tests','gates','text','extra']
        results={n:os.environ.get('RESULT_'+n,'unknown') for n in names}
        print(json.dumps(results,indent=2))
        p=os.environ.get('TEAM_RUN')
        if p:pathlib.Path(p,'reports','outcomes.json').write_text(json.dumps(results,indent=2))
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('\n| Suite | Outcome |\n|---|---|\n')
            for n,v in results.items():f.write(f'| {n} | {v} |\n')
            f.write('\nLive MCP/EDT end-to-end behavior, Windows, paid model calls and simultaneous licensed sessions were NOT tested by this workflow.\n')
        if any(v!='success' for v in results.values()):raise SystemExit('One or more suites failed or did not run. See individual outcomes.')
        PY
      id: summary
      if: always()
      env:
        RESULT_bases: ${{ steps.bases.outcome }}
        RESULT_installer: ${{ steps.installer.outcome }}
        RESULT_client: ${{ steps.client.outcome }}
        RESULT_python_tests: ${{ steps.python_tests.outcome }}
        RESULT_powershell_tests: ${{ steps.powershell_tests.outcome }}
        RESULT_maven_tests: ${{ steps.maven_tests.outcome }}
        RESULT_gates: ${{ steps.gates.outcome }}
        RESULT_text: ${{ steps.text.outcome }}
        RESULT_extra: ${{ steps.extra.outcome }}
    - name: Upload only test reports; never licenses or credentials
      if: always() && env.TEAM_RUN != ''
      uses: actions/upload-artifact@v4
      with:
        name: team-tests-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ env.TEAM_RUN }}/reports/
        retention-days: 7
        if-no-files-found: warn
    - name: Report persistent locations and disk usage
      shell: bash
      run: |
        set -euo pipefail
        printf 'Preserved run: %s\n' "${TEAM_RUN:-not initialized}"
        if [ -n "${TEAM_BASE:-}" ]; then du -sh "$TEAM_BASE"; df -h "$TEAM_BASE"; fi
      if: always()
