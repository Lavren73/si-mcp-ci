name: SI-MCP — inspect and stop only our own smoke remnants (11)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: si1c-team-test-stand
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: [self-hosted, Linux, X64, si1c]
    timeout-minutes: 4
    steps:
      - name: Verify socket addresses and stop only exact own workspace processes; no GUI launch
        shell: bash
        run: |
          set -euo pipefail
          BASE="$HOME/si1c-team-tests"
          test ! -L "$BASE" && test -O "$BASE"
          test "$(cat "$BASE/OWNER.txt")" = 'SI-MCP team test stand; provisioned by agent 11'
          exec 9>"$BASE/locks/live-tests.lock"
          flock -w 90 9
          python3 - <<'PY'
          import os,pathlib,signal,time,json,ipaddress,socket
          base=pathlib.Path('/home/runner/si1c-team-tests')
          ws=base/'runs/43084355230-1/workspace'
          edt=base/'runs/43070810460-1/edt'
          out=base/'runs'/('cleanup-'+os.environ['GITHUB_RUN_ID'])
          if out.exists():raise SystemExit('Refusing existing cleanup directory')
          out.mkdir(mode=0o700)
          def listeners():
              rows=[]
              for fn,family in [('/proc/net/tcp',socket.AF_INET),('/proc/net/tcp6',socket.AF_INET6)]:
                  for line in pathlib.Path(fn).read_text().splitlines()[1:]:
                      a=line.split()
                      if len(a)<10 or a[3]!='0A':continue
                      raw,port=a[1].split(':')
                      if int(port,16)!=45113:continue
                      b=bytes.fromhex(raw)[::-1] if family==socket.AF_INET else b''.join(bytes.fromhex(raw[i:i+8])[::-1] for i in range(0,32,8))
                      addr=ipaddress.ip_address(socket.inet_ntop(family,b));v4=getattr(addr,'ipv4_mapped',None)
                      rows.append({'address':str(addr),'raw_proc_address':raw,'port':45113,'loopback':(v4 or addr).is_loopback})
              return rows
          def matches(p):
              try:
                  if p.stat().st_uid!=os.getuid():return None
                  args=(p/'cmdline').read_bytes().split(b'\0')
                  comm=(p/'comm').read_text().strip()
                  if comm not in ('java','javaw','1cedt','1cedtcli'):return None
                  if str(ws).encode() not in args:return None
                  if not any(a.startswith(str(edt).encode()+b'/') for a in args):return None
                  start=(p/'stat').read_text().rsplit(')',1)[1].split()[19]
                  return {'pid':int(p.name),'name':comm,'start':start}
              except (OSError,ValueError,IndexError):return None
          before=listeners();targets=[]
          for p in pathlib.Path('/proc').iterdir():
              if not p.name.isdecimal():continue
              x=matches(p)
              if x:targets.append(x)
          print('OUR_EXACT_WORKSPACE_PROCESS_COUNT='+str(len(targets)))
          for x in targets:
              current=matches(pathlib.Path('/proc')/str(x['pid']))
              if current and current['start']==x['start']:
                  try:os.kill(x['pid'],signal.SIGTERM)
                  except ProcessLookupError:pass
          until=time.monotonic()+12
          while time.monotonic()<until:
              alive=[x for x in targets if matches(pathlib.Path('/proc')/str(x['pid']))==x]
              if not alive:break
              time.sleep(1)
          for x in targets:
              if matches(pathlib.Path('/proc')/str(x['pid']))==x:
                  try:os.kill(x['pid'],signal.SIGKILL)
                  except ProcessLookupError:pass
          remaining=[x for x in targets if matches(pathlib.Path('/proc')/str(x['pid']))==x]
          report={'listeners_before':before,'matched_own_processes':targets,'remaining_own_processes':remaining,'listeners_after':listeners(),'other_processes_signalled':False,'gui_started':False,'host_wide_sessions_checked':False}
          (out/'cleanup.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('CLEANUP_REPORT='+str(out/'cleanup.json')+'\n')
          if remaining:raise SystemExit('Own processes remain; inspect without killing anything else')
          PY
      - name: Preserve cleanup metadata only
        if: always() && env.CLEANUP_REPORT != ''
        uses: actions/upload-artifact@v4
        with:
          name: smoke-cleanup-${{ github.run_id }}
          path: ${{ env.CLEANUP_REPORT }}
          retention-days: 7
